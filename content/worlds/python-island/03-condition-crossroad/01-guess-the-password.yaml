# 퀘스트 3-1: 비밀번호를 맞춰라!
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000008
order: 1
title: 비밀번호를 맞춰라!
concept: if/else
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: if/else 조건문
  learning_goals:
    - if 문으로 조건을 검사할 수 있다
    - else로 조건이 거짓일 때 실행할 코드를 작성할 수 있다
    - == 비교 연산자를 사용할 수 있다
  story_context: 갈림길의 비밀 문 앞에 섰어요! 올바른 비밀번호를 입력해야 문이 열려요.
  exercise_description: password 변수에 "열려라"를 저장하고, if문으로 password가 "열려라"와 같으면 "통과!"를 출력하세요
  starter_code: |-
    # 비밀번호를 확인하는 코드를 작성해보세요!
    password = "열려라"

    if password == "열려라":
        print()
  expected_output_hint: 통과! 가 출력되어야 해요
  checklist:
    - 'if 아래 print( ) 안에 "통과!"를 넣어요'
    - 'if 안의 줄은 네 칸 들여 써요'
  example_output: |-
    통과!
  fallback_text: 'if는 "만약 ~라면"이에요! if password == "열려라": 이렇게 조건을 쓰고, 다음 줄에 들여쓰기 후 실행할 코드를 써요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 통과!
  hints:
    level_1: if 뒤에 조건을 쓰고, 조건이 맞으면 아래 코드가 실행돼요!
    level_2: print() 안에 "통과!"를 넣어보세요!
    level_3: print("___") 문이 열릴 때 나올 메시지를 넣어보세요!
  solution_code: |-
    password = "열려라"

    if password == "열려라":
        print("통과!")
