# 퀘스트 3-7: 영화관 할인 시스템
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000032
order: 7
title: 영화관 할인 시스템
concept: 조건문 종합
xp_reward: 75
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 조건문 종합 활용 - 할인 시스템 만들기
  learning_goals:
    - if/elif/else를 활용하여 실용적인 프로그램을 만들 수 있다
    - 여러 조건을 조합하여 복잡한 로직을 구현할 수 있다
    - 변수와 조건문을 함께 사용할 수 있다
  story_context: 갈림길의 영화관에서 할인 시스템을 만들어야 해요! 나이와 요일에 따라 할인율이 달라져요.
  exercise_description: age=10, is_weekend=False일 때, 어린이(13세 미만) 평일 50% 할인을 적용하여 나이, 할인율, 가격을 출력하세요. 원래 가격은 10000원이에요.
  starter_code: |
    # 영화관 할인 시스템을 만들어보세요!
    age = 10
    is_weekend = False
    price = 10000

    # 어린이(13세 미만)이면 할인!
    # if 문으로 나이와 요일에 따라 discount를 정해보세요!


    # 최종 가격을 계산하세요!
    # final_price = price * (100 - discount) // 100

    # 나이, 할인율, 가격을 출력하세요!
  expected_output_hint: '나이: 10살, 할인율: 50%, 가격: 5000원 이 각각 출력되어야 해요'
  checklist:
    - 'if 로 13세 미만인지, 평일인지 살펴서 discount 를 정해요'
    - 'final_price 로 할인된 가격을 구해요'
    - '나이·할인율·가격을 한 줄씩 보여 줘요'
  example_output: |-
    나이: 10살
    할인율: 50%
    가격: 5000원
  fallback_text: if 안에 또 if를 쓸 수 있어요! 먼저 나이로 어린이인지 확인하고, 그 안에서 평일인지 주말인지 확인해요.
  is_challenge: true
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      나이: 10살
      할인율: 50%
      가격: 5000원
  hints:
    level_1: 먼저 나이를 확인하고, 그 다음 주말인지 평일인지 확인해야 해요!
    level_2: 'if age < 13: 안에서 is_weekend를 확인해보세요! 평일이면 50% 할인!'
    level_3: 'if age < 13: 안에 if is_weekend == False: 를 넣고, discount = 50 으로 설정해보세요! else일 때는 30이에요.'
  solution_code: |-
    age = 10
    is_weekend = False
    price = 10000

    if age < 13:
        if is_weekend == False:
            discount = 50
        else:
            discount = 30
    else:
        discount = 0

    final_price = price * (100 - discount) // 100

    print("나이: " + str(age) + "살")
    print("할인율: " + str(discount) + "%")
    print("가격: " + str(final_price) + "원")
