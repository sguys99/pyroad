# 퀴즈 3-2: 비밀 문 버그 잡기
# 작성 안내: content/README.md "퀴즈" (P7-12). 공개 부분(prompt)에 정답을 쓰지 마세요

id: b1000000-0000-0000-0000-000000000107
order: 2
title: 비밀 문 버그 잡기
concept: if/else, 비교(==)
xp_reward: 30
quest_type: quiz
quiz_kind: bug_hunt
prompt:
  topic: 같은지 비교하는 기호
  learning_goals:
    - 값을 넣는 기호와 같은지 비교하는 기호가 다르다는 것을 안다
  story_context: 갈림길의 비밀 문 코드가 고장 났어요! 비밀번호가 맞는데도 문이 열리지 않고 오류가 나요.
  fallback_text: = 하나는 상자에 값을 넣는 기호예요. if 에서는 두 값이 같은지 물어봐야 해요. 앞에서 비밀번호 퀘스트를 풀 때 쓴 기호를 떠올려 봐요.
  quiz:
    question: 오류가 나는 줄을 찾아 고쳐요
    lines:
      - id: ln-g5ma
        code: password = "1234"
      - id: ln-x7pe
        code: 'if password = "1234":'
      - id: ln-b3sk
        code: '    print("문이 열려요!")'
      - id: ln-w8vh
        code: 'else:'
      - id: ln-f2ty
        code: '    print("땡!")'
    fixes:
      - id: fx-a6rq
        code: 'if password == "1234":'
      - id: fx-l4cn
        code: 'if password == 1234:'
      - id: fx-z9um
        code: 'if password = "1234"'
answer:
  quiz_answer:
    accepted:
      - { line: ln-x7pe, fix: fx-a6rq }
    explanation: if 에서 두 값이 같은지 물어볼 때는 == 를 써요. = 하나는 상자에 값을 넣는 기호예요.
    explanations:
      ln-g5ma: 이 줄은 상자에 비밀번호를 넣는 줄이라 = 하나가 맞아요.
      ln-b3sk: 이 줄은 들여쓰기도 따옴표도 잘 맞아요.
      ln-w8vh: else 줄은 잘 썼어요. 쌍점(:)도 있어요.
      ln-f2ty: 이 줄은 들여쓰기도 따옴표도 잘 맞아요.
      fx-l4cn: 따옴표가 없으면 숫자 1234예요. 상자에 든 글자 "1234"와는 달라서 문이 열리지 않아요.
      fx-z9um: 쌍점(:)이 빠졌고, = 하나는 상자에 값을 넣는 기호라 if 에서 쓸 수 없어요.
