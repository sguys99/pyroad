# 퀘스트 3-5: 마법사의 조건
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000011
order: 5
title: 마법사의 조건
concept: and/or/not 논리연산자
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 논리연산자 and, or, not
  learning_goals:
    - and는 두 조건이 모두 참일 때 참이 되는 것을 안다
    - or는 하나만 참이어도 참이 되는 것을 안다
    - 논리연산자로 복합 조건을 만들 수 있다
  story_context: 마법사가 되려면 두 가지 시험을 모두 통과해야 해요! 마법 점수와 용기 점수가 모두 높아야 해요.
  exercise_description: magic = 80, courage = 70일 때, 둘 다 60 이상이면 "마법사 합격!"을 출력하세요
  starter_code: |-
    # 마법사 자격을 확인해보세요!
    magic = 80
    courage = 70

    if magic >= 60 and courage >= 60:
        print()
  expected_output_hint: 마법사 합격! 이 출력되어야 해요
  checklist:
    - 'and 로 두 조건을 함께 봐요'
    - 'if 아래 print( ) 안에 "마법사 합격!"을 넣어요'
  example_output: |-
    마법사 합격!
  fallback_text: and는 "그리고"예요! magic >= 60 and courage >= 70은 "마법 점수가 60 이상이고 용기 점수도 60 이상"이라는 뜻이에요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 마법사 합격!
  hints:
    level_1: and는 두 조건을 모두 만족해야 해요. 80은 60 이상이고, 70도 60 이상인가요?
    level_2: 두 조건 모두 맞으니까 print() 안에 합격 메시지를 넣으면 돼요!
    level_3: print("___") 두 시험을 모두 통과하면 나올 메시지를 넣어보세요!
  solution_code: |-
    magic = 80
    courage = 70

    if magic >= 60 and courage >= 60:
        print("마법사 합격!")
