# 퀘스트 3-3: 성적표 만들기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000009
order: 3
title: 성적표 만들기
concept: if/elif/else
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: if/elif/else 다중 조건문
  learning_goals:
    - elif로 여러 조건을 순서대로 검사할 수 있다
    - if/elif/else의 실행 흐름을 이해한다
  story_context: 갈림길의 마법 성적표! 점수에 따라 다른 등급이 나와요.
  exercise_description: 'score = 85일 때, 90 이상이면 "등급: A", 80 이상이면 "등급: B", 그 외에는 "등급: C"를 출력하세요'
  starter_code: |-
    # 점수에 따라 등급을 매겨보세요!
    score = 85

    if score >= 90:
        print("등급: A")
    elif score >= 80:
        print()
    else:
        print("등급: C")
  expected_output_hint: '등급: B 가 출력되어야 해요'
  fallback_text: elif는 "그렇지 않고 만약 ~라면"이에요! 위의 조건이 안 맞으면 다음 elif 조건을 확인해요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: contains
    expected: 등급
  hints:
    level_1: score가 85이면 90 이상인가요? 아니라면 80 이상인가요?
    level_2: 85는 90보다 작지만 80보다 크니까 elif 조건에 해당해요!
    level_3: 'print("등급: ___") 85점의 등급 알파벳을 넣어보세요!'
  solution_code: |-
    score = 85

    if score >= 90:
        print("등급: A")
    elif score >= 80:
        print("등급: B")
    else:
        print("등급: C")
