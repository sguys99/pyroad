# 퀘스트 3-6: 놀이공원 입장
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000010
order: 6
title: 놀이공원 입장
concept: 비교연산자 (>=, <=, >, <)
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 비교연산자로 조건 만들기
  learning_goals:
    - '>=, <=, >, < 비교연산자를 사용할 수 있다'
    - 비교 결과가 True/False임을 이해한다
  story_context: 놀이공원에 가려면 키가 120cm 이상이어야 해요! 키를 재볼까요?
  exercise_description: height = 130일 때, height >= 120이면 "입장 가능!"을 출력하세요
  starter_code: |-
    # 키를 확인하는 코드를 작성해보세요!
    height = 130

    if height >= 120:
        print()
  expected_output_hint: 입장 가능! 이 출력되어야 해요
  checklist:
    - 'if 아래 print( ) 안에 "입장 가능!"을 넣어요'
    - '130이 120 이상인지 생각해 봐요'
  example_output: |-
    입장 가능!
  fallback_text: '>= 는 "크거나 같다"는 뜻이에요! height >= 120은 키가 120 이상인지 물어보는 거예요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 입장 가능!
  hints:
    level_1: '>= 기호는 "크거나 같다"는 뜻이에요. 130은 120보다 크거나 같나요?'
    level_2: 조건이 맞으니까 print() 안에 출력할 메시지를 넣으면 돼요!
    level_3: print("___") 키가 충분할 때 나올 메시지를 넣어보세요!
  solution_code: |-
    height = 130

    if height >= 120:
        print("입장 가능!")
