# 퀘스트 6-8: 여러 값 돌려주기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000042
order: 8
title: 여러 값 돌려주기
concept: 다중 return (튜플)
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 함수에서 여러 값 돌려주기 (튜플)
  learning_goals:
    - 함수에서 여러 값을 return할 수 있다
    - return된 여러 값을 각각 변수에 받을 수 있다
  story_context: 함수의 탑에서 마법 분석기를 만들어요! 숫자 중 가장 작은 것과 가장 큰 것을 동시에 알려줘요!
  exercise_description: def min_max(a, b, c) 함수를 만들어 가장 작은 값과 가장 큰 값을 return하세요. min_max(1, 9, 5)를 호출하여 결과를 출력!
  starter_code: |-
    # 최소값과 최대값을 동시에 돌려주는 함수!
    def min_max(a, b, c):
        smallest = min(a, b, c)
        biggest = max(a, b, c)
        # smallest와 biggest를 동시에 return 하세요! (쉼표로 구분)
        

    small, big = min_max(1, 9, 5)
    print(small)
    print(big)
  expected_output_hint: 1과 9가 각각 한 줄씩 출력되어야 해요
  checklist:
    - 'return 뒤에 smallest, biggest 를 쉼표로 이어 써요'
    - '작은 수와 큰 수가 한 줄씩 나오는지 봐요'
  example_output: |-
    1
    9
  fallback_text: return 뒤에 쉼표로 여러 값을 쓰면 한 번에 돌려줄 수 있어요! small, big = min_max(1, 9, 5) 이렇게 받으면 돼요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      1
      9
  hints:
    level_1: return 뒤에 쉼표로 두 개의 값을 쓸 수 있어요!
    level_2: return smallest, biggest 이렇게 두 값을 동시에 돌려줘요!
    level_3: 함수 안 빈 줄에 return smallest, biggest 를 넣어보세요!
  solution_code: |-
    def min_max(a, b, c):
        smallest = min(a, b, c)
        biggest = max(a, b, c)
        return smallest, biggest

    small, big = min_max(1, 9, 5)
    print(small)
    print(big)
