# 퀘스트 6-3: 기본값이 있는 함수
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000041
order: 3
title: 기본값이 있는 함수
concept: 기본 매개변수
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 기본 매개변수 (default parameter)
  learning_goals:
    - 함수의 매개변수에 기본값을 설정할 수 있다
    - 기본값이 있으면 인자를 생략할 수 있음을 이해한다
  story_context: 함수의 탑에서 인사 마법을 업그레이드! 이름을 안 말해도 기본 인사를 해줘요!
  exercise_description: def greet(name="친구") 함수를 만들고, greet()과 greet("파이뱀")을 각각 호출하세요
  starter_code: |
    # 기본값이 있는 함수를 만들어보세요!
    def greet(name="친구"):
        # "안녕, " + name + "!" 를 출력하세요!
        

    # 이름 없이 한 번, 이름을 넣어서 한 번, 총 두 번 호출해보세요!
  expected_output_hint: 안녕, 친구! 와 안녕, 파이뱀! 이 각각 출력되어야 해요
  fallback_text: '매개변수에 = 으로 기본값을 넣으면, 호출할 때 값을 안 넣어도 기본값이 사용돼요! def greet(name="친구"): 에서 greet()은 "친구"가, greet("파이뱀")은 "파이뱀"이 name에 들어가요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      안녕, 친구!
      안녕, 파이뱀!
  hints:
    level_1: 기본값이 있으면 함수를 호출할 때 값을 안 넣어도 괜찮아요!
    level_2: greet()은 name이 "친구"가 되고, greet("파이뱀")은 name이 "파이뱀"이 돼요!
    level_3: 함수 안에 print("안녕, " + name + "!") 를 쓰고, 아래에 greet() 와 greet("파이뱀") 두 줄을 넣어보세요!
  solution_code: |-
    def greet(name="친구"):
        print("안녕, " + name + "!")

    greet()
    greet("파이뱀")
