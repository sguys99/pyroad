# 퀘스트 6-11: 성적 분석 프로그램
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000044
order: 11
title: 성적 분석 프로그램
concept: 함수 종합
xp_reward: 75
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 함수 종합 활용 - 성적 분석 프로그램
  learning_goals:
    - 여러 함수를 만들어 역할을 분담할 수 있다
    - 함수의 return 값을 다른 함수에서 활용할 수 있다
    - 함수를 조합하여 실용적인 프로그램을 만들 수 있다
  story_context: 함수의 탑 마지막 시험! 배운 함수 마법을 모두 써서 성적 분석 프로그램을 완성해봐요!
  exercise_description: 'average 함수(3과목 평균)와 grade 함수(평균으로 등급 판정)를 만들어 성적을 분석하세요. 점수: 80, 90, 85'
  starter_code: |-
    # 성적 분석 프로그램을 만들어보세요!
    def average(a, b, c):
        # 세 과목의 평균을 구해서 return 하세요!
        

    def grade(avg):
        # 90 이상 "A", 80 이상 "B", 70 이상 "C", 나머지 "D"
        

    # 3과목 점수
    avg = average(80, 90, 85)
    g = grade(avg)

    print("평균: " + str(avg))
    print("등급: " + g)
  expected_output_hint: '평균: 85.0 과 등급: B 가 출력되어야 해요'
  checklist:
    - 'average 에서 세 점수를 더해 3으로 나눠 return 해요'
    - 'grade 에서 if·elif·else 로 등급을 return 해요'
    - '평균과 등급이 한 줄씩 나오는지 봐요'
  example_output: |-
    평균: 85.0
    등급: B
  fallback_text: average 함수로 평균을 구하고, grade 함수로 등급을 판정해요! 두 함수를 조합하면 성적 분석 프로그램이 완성돼요.
  is_challenge: true
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      평균: 85.0
      등급: B
  hints:
    level_1: average 함수는 3개 숫자의 평균을, grade 함수는 평균에 따른 등급을 돌려줘요!
    level_2: average(80, 90, 85) = 85.0이고, grade(85.0) = "B"예요!
    level_3: average는 return (a + b + c) / 3, grade는 if/elif/else로 등급을 return 하세요!
  solution_code: |-
    def average(a, b, c):
        return (a + b + c) / 3

    def grade(avg):
        if avg >= 90:
            return "A"
        elif avg >= 80:
            return "B"
        elif avg >= 70:
            return "C"
        else:
            return "D"

    avg = average(80, 90, 85)
    g = grade(avg)

    print("평균: " + str(avg))
    print("등급: " + g)
