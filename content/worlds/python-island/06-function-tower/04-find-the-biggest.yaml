# 퀘스트 6-4: 최댓값 찾기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000021
order: 4
title: 최댓값 찾기
concept: 내장함수 max(), min()
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 파이썬 내장함수 max()와 min()
  learning_goals:
    - max()로 가장 큰 값을 찾을 수 있다
    - min()로 가장 작은 값을 찾을 수 있다
    - 파이썬에 이미 만들어진 함수가 있다는 것을 안다
  story_context: 탑 꼭대기에서 마법 숫자들 중 가장 큰 숫자를 찾는 시험! 파이썬의 내장함수를 사용해봐요.
  exercise_description: numbers 리스트에서 max()를 사용하여 가장 큰 수를 출력하세요
  starter_code: |-
    # 가장 큰 수를 찾아보세요!
    numbers = [3, 7, 1, 9, 4]
    biggest = 
    print(biggest)
  expected_output_hint: 9 가 출력되어야 해요
  checklist:
    - 'biggest 에 max(numbers)를 넣어요'
    - '가장 큰 수가 나오는지 봐요'
  example_output: |-
    9
  fallback_text: max()는 가장 큰 값을 찾아주는 내장함수예요! max([3, 7, 1, 9, 4])는 9를 돌려줘요. min()은 반대로 가장 작은 값을 찾아줘요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: '9'
  hints:
    level_1: 파이썬에는 이미 만들어진 편리한 함수들이 있어요! 가장 큰 값을 찾는 함수는?
    level_2: max()는 가장 큰 값을 찾아줘요! max(numbers) 이렇게!
    level_3: biggest = ___(numbers) 가장 큰 값을 찾는 함수 이름을 넣어보세요!
  solution_code: |-
    numbers = [3, 7, 1, 9, 4]
    biggest = max(numbers)
    print(biggest)
