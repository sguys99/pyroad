# 퀘스트 2-6: 글자 합치기 마법
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000028
order: 6
title: 글자 합치기 마법
concept: 문자열 연결(+)
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 문자열 연결 연산자 +
  learning_goals:
    - + 연산자로 문자열을 합칠 수 있다
    - 문자열끼리 더하면 이어붙여지는 것을 이해한다
  story_context: 변수의 숲에서 마법 접착제를 발견했어요! 글자와 글자를 이어붙여 새로운 단어를 만들어봐요!
  exercise_description: first = "파이", second = "썬"을 변수에 저장하고, + 연산자로 합쳐서 출력하세요
  starter_code: |-
    # 글자를 합쳐보세요!
    first = "파이"
    second = "썬"
    result = 
    print(result)
  expected_output_hint: 파이썬 이 출력되어야 해요
  checklist:
    - 'result 에 first + second 를 넣어요'
    - 'print(result)로 합친 글자를 보여 줘요'
  example_output: |-
    파이썬
  fallback_text: 문자열끼리 + 를 쓰면 이어붙여져요! "파이" + "썬" = "파이썬"이 돼요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 파이썬
  hints:
    level_1: 문자열을 합치려면 + 기호를 사용해요! 숫자 더하기와 비슷하죠?
    level_2: result = first + second 이렇게 두 변수를 + 로 합쳐보세요!
    level_3: result = ___ + ___ 두 변수 이름을 넣어보세요!
  solution_code: |-
    first = "파이"
    second = "썬"
    result = first + second
    print(result)
