# 퀘스트 5-7: 리스트 정렬하기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000038
order: 7
title: 리스트 정렬하기
concept: sort()
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 리스트 정렬하기 sort()
  learning_goals:
    - sort()로 리스트를 오름차순 정렬할 수 있다
    - 정렬 후 리스트가 변경되는 것을 이해한다
  story_context: 리스트 호수의 숫자 물고기가 뒤죽박죽이에요! sort()로 깔끔하게 정리해봐요!
  exercise_description: numbers = [3, 1, 4, 1, 5]를 sort()로 정렬한 후 출력하세요
  starter_code: |-
    # 숫자를 정렬해보세요!
    numbers = [3, 1, 4, 1, 5]

    # sort()로 정렬하세요!

    print(numbers)
  expected_output_hint: '[1, 1, 3, 4, 5] 가 출력되어야 해요'
  checklist:
    - 'numbers.sort( )로 작은 수부터 줄 세워요'
    - 'print(numbers)로 보여 줘요'
  example_output: |-
    [1, 1, 3, 4, 5]
  fallback_text: sort()는 리스트를 작은 수부터 큰 수 순서로 정리해줘요! numbers.sort() 이렇게 쓰면 돼요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: '[1, 1, 3, 4, 5]'
  hints:
    level_1: 리스트를 정리하는 마법 주문이 있어요! 리스트이름.sort()를 써보세요.
    level_2: numbers.sort() 이렇게 쓰면 작은 수부터 큰 수 순서로 정렬돼요!
    level_3: numbers.___() print 전에 정렬하는 함수를 호출해보세요!
  solution_code: |-
    numbers = [3, 1, 4, 1, 5]
    numbers.sort()
    print(numbers)
