# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 'True'
  hints:
    level_1: in은 "안에 있는지" 확인하는 마법이에요! 결과는 True 또는 False예요.
    level_2: '"바나나" in fruits 이렇게 쓰면 바나나가 리스트에 있는지 확인해요!'
    level_3: result = "바나나" in fruits 처럼 in 표현을 result에 넣어보세요!
  solution_code: |-
    fruits = ["사과", "바나나", "포도"]
    result = "바나나" in fruits
    print(result)
