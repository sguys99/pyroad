# 퀘스트 5-4: 리스트 순회하기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000037
order: 4
title: 리스트 순회하기
concept: for + 리스트
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: for 반복문으로 리스트 순회하기
  learning_goals:
    - for 반복문으로 리스트의 각 항목을 하나씩 꺼낼 수 있다
    - 리스트 순회의 개념을 이해한다
  story_context: 리스트 호수에서 색깔 물고기를 하나씩 잡아보아요! for 반복문으로 모든 물고기를 순서대로 만나봐요!
  exercise_description: colors = ["빨강", "초록", "파랑"] 리스트를 for 반복문으로 순회하며 각 색깔을 출력하세요
  starter_code: "# 색깔을 하나씩 출력해보세요!

    colors = [\"빨강\", \"초록\", \"파랑\"]


    for color in colors:

    \    # color를 출력해보세요!

    \    "
  expected_output_hint: 빨강, 초록, 파랑이 한 줄씩 출력되어야 해요
  checklist:
    - 'for 아래에 print(color)를 써요'
    - '그 줄은 네 칸 들여 써요'
  example_output: |-
    빨강
    초록
    파랑
  fallback_text: 'for color in colors: 라고 쓰면 colors 리스트에서 하나씩 꺼내서 color 변수에 넣어줘요! 첫 번째는 빨강, 두 번째는 초록, 세 번째는 파랑이에요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      빨강
      초록
      파랑
  hints:
    level_1: for 다음에 변수 이름을 쓰고, in 다음에 리스트를 쓰면 하나씩 꺼내줘요!
    level_2: 'for color in colors: 이렇게 쓰면 color에 빨강, 초록, 파랑이 차례로 들어와요!'
    level_3: for 안 빈 줄에 print(color) 를 넣어보세요!
  solution_code: |-
    colors = ["빨강", "초록", "파랑"]

    for color in colors:
        print(color)
