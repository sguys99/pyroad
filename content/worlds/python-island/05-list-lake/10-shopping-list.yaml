# 퀘스트 5-10: 쇼핑 리스트 정리기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000040
order: 10
title: 쇼핑 리스트 정리기
concept: 리스트 종합
xp_reward: 75
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 리스트 종합 활용 - 쇼핑 리스트 만들기
  learning_goals:
    - 빈 리스트를 만들고 append()로 항목을 추가할 수 있다
    - sort()로 리스트를 정렬할 수 있다
    - for 반복문으로 리스트를 순회하여 출력할 수 있다
    - len()으로 항목 수를 세어 출력할 수 있다
  story_context: 리스트 호수에서 마지막 시험! 쇼핑 리스트를 만들고, 정리하고, 예쁘게 출력해봐요!
  exercise_description: 빈 리스트를 만들고, 우유/주스/과자를 append하고, sort()로 정렬한 후, for로 순회 출력하세요
  starter_code: |-
    # 쇼핑 리스트를 만들어보세요!
    shopping = []

    # 3개 항목을 추가하세요! (append 사용)


    # 정렬하세요! (sort 사용)


    # 출력하세요!
    print("--- 쇼핑 목록 ---")
    for item in shopping:
        print(item)
    print("총 " + str(len(shopping)) + "개")
  expected_output_hint: 쇼핑 목록이 정렬되어 출력되어야 해요
  checklist:
    - 'append( )로 우유·주스·과자를 하나씩 더해요'
    - 'sort( )로 가나다 순서로 줄 세워요'
    - '목록과 총 개수가 나오는지 봐요'
  example_output: |-
    --- 쇼핑 목록 ---
    과자
    우유
    주스
    총 3개
  fallback_text: 빈 리스트 []를 만들고, append()로 항목을 추가하고, sort()로 정렬한 뒤, for로 하나씩 출력해요!
  is_challenge: true
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      --- 쇼핑 목록 ---
      과자
      우유
      주스
      총 3개
  hints:
    level_1: 빈 리스트부터 시작해서 하나씩 추가하고, 정렬하고, 출력하는 순서예요!
    level_2: shopping.append()로 추가, shopping.sort()로 정렬, for item in shopping:으로 출력!
    level_3: shopping.append("우유") 처럼 3개를 추가하고, shopping.sort() 로 정렬하세요!
  solution_code: |-
    shopping = []
    shopping.append("우유")
    shopping.append("주스")
    shopping.append("과자")
    shopping.sort()
    print("--- 쇼핑 목록 ---")
    for item in shopping:
        print(item)
    print("총 " + str(len(shopping)) + "개")
