# 퀘스트 7-3: 숫자 맞추기 게임
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000022
order: 3
title: 숫자 맞추기 게임
concept: 종합 프로젝트
xp_reward: 200
quest_type: project
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: '종합 프로젝트: 숫자 맞추기 게임 만들기'
  learning_goals:
    - 배운 모든 개념(변수, 조건, 반복, 함수)을 조합할 수 있다
    - 프로그램을 단계적으로 설계하고 구현할 수 있다
    - 완성된 프로그램을 만드는 경험을 쌓는다
  story_context: 프로젝트 왕국의 최종 관문! 배운 모든 것을 모아 숫자 맞추기 게임을 완성하면 코딩 마법사가 돼요!
  exercise_description: 1~10 사이의 비밀 숫자를 맞추는 게임을 만드세요. 5단계에 걸쳐 하나씩 기능을 추가하며 완성해요!
  starter_code: |
    # 숫자 맞추기 게임을 만들어보세요!
    import random
  expected_output_hint: 프로젝트를 5단계로 나누어 완성해요
  fallback_text: 드디어 프로젝트 왕국에 도착했어요! 지금까지 배운 변수, 조건문, 반복문을 모두 활용해서 숫자 맞추기 게임을 만들 거예요. 5단계로 나누어 하나씩 만들어볼까요?
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: contains
    expected: 번 만에 맞췄어요
  hints:
    level_1: 이 프로젝트는 5단계로 진행돼요. 각 단계의 안내를 잘 따라가 보세요!
    level_2: random, 변수, 조건문, 반복문을 차례대로 사용할 거예요!
    level_3: 각 단계에서 힌트를 활용하면 더 쉽게 진행할 수 있어요!
# 단계별 prompt 는 공개(prompt_skeleton.steps[]), answer 는 정답(quest_answer_keys.steps[])
steps:
  - step_number: 1
    prompt:
      step_goal: random 모듈로 1~10 사이의 비밀 숫자를 만들고 출력해보기
      checklist:
        - 'import random 아래에서 random.randint(1, 10)으로 비밀 숫자를 만들어요'
        - 'secret 에 넣고 print( )로 보여 줘요'
      example_output: |-
        7
      starter_code: |
        # 1단계: 비밀 숫자 만들기
        import random

        # 비밀 숫자를 만들어보세요! random 모듈을 사용해볼까요?
      fallback_text: 1단계에서는 random 모듈을 사용해서 비밀 숫자를 만들어요! random.randint(1, 10)을 사용하면 1부터 10 사이의 숫자를 랜덤으로 만들 수 있어요. 변수에 저장하고 print()로 확인해보세요!
    answer:
      validation:
        type: code_check
        expected: random.randint
      hints:
        level_1: random 모듈의 randint 함수를 사용하면 원하는 범위의 숫자를 만들 수 있어요!
        level_2: secret = random.randint(1, 10) 이렇게 변수에 저장하고, print()로 확인해보세요!
        level_3: |-
          secret = random.___(1, 10)
          print(secret)
          랜덤 숫자를 만드는 함수 이름을 넣어보세요!
      solution_code: |-
        import random

        secret = random.randint(1, 10)
        print(secret)
  - step_number: 2
    prompt:
      step_goal: 추측 숫자를 guess 변수에 저장하고 "추측"과 함께 출력하기 (Pyodide에서는 random으로 대체)
      checklist:
        - 'guess 변수에 추측 숫자를 넣어요'
        - 'print( )로 "추측"이라는 말과 함께 보여 줘요'
      example_output: |-
        비밀 숫자: 7
        추측: 3
      starter_code: ''
      fallback_text: 2단계에서는 추측 숫자를 만들어요! 실제 게임에서는 input()으로 사용자에게 물어보지만, 여기서는 int(random.randint(1, 10))으로 자동 추측을 만들어볼 거예요. guess 변수에 저장하고, print()로 "추측"이라는 말과 함께 보여주세요!
    answer:
      # B30: 예전 규칙 code_check "int(" 는 1단계 코드의 randint( 에 이미 걸려서 아무것도 안 해도 통과했음.
      # 단계 목표(추측을 변수에 저장하고 보여주기)대로 guess 변수 + 출력의 "추측"을 확인
      validation:
        type: all
        rules:
          - type: code_check
            expected: guess
          - type: contains
            expected: 추측
      hints:
        level_1: 추측 숫자를 저장할 변수가 필요해요! guess라는 이름은 어떨까요?
        level_2: 실제 게임에서는 input()을 쓰지만, 여기서는 int(random.randint(1, 10))으로 자동 추측을 만들어요!
        level_3: |-
          guess = ___(random.randint(1, 10))
          print("추측: " + ___(guess))
          타입을 바꾸는 함수를 넣어보세요!
      solution_code: |-
        import random

        secret = random.randint(1, 10)
        guess = int(random.randint(1, 10))
        print("비밀 숫자: " + str(secret))
        print("추측: " + str(guess))
  - step_number: 3
    prompt:
      step_goal: if/elif/else로 비밀 숫자와 추측을 비교하기
      checklist:
        - 'if 로 정답인지 먼저 봐요'
        - 'elif 와 else 로 더 큰지 작은지 알려 줘요'
        - '숫자는 매번 바뀌어서 나오는 말도 달라져요'
      example_output: |-
        비밀 숫자가 추측보다 커요!
      starter_code: ''
      fallback_text: 3단계에서는 조건문으로 비밀 숫자와 추측을 비교해요! if/elif/else를 사용해서 정답인지, 더 큰 숫자를 말해야 하는지, 더 작은 숫자를 말해야 하는지 알려주세요!
    answer:
      # B09 (§12-Q18): 숫자가 무작위라 세 갈래 중 어느 쪽이 실행될지 몰라요. 예전 규칙 contains "보다 커요"는
      # 정답 코드도 절반쯤 떨어뜨렸음. 시드 고정 대신 규칙을 넓혀 올바른 답이 모두 통과하게 함
      validation:
        type: all
        rules:
          - type: code_check
            expected: elif
          - type: contains_any
            expected: [커요, 작아요, 정답]
      hints:
        level_1: 'if, elif, else를 사용해서 세 가지 경우를 나눠보세요: 같을 때, 작을 때, 클 때!'
        level_2: |-
          if guess == secret: 정답!
          elif guess < secret: 더 커요!
          else: 더 작아요!
          이런 구조예요!
        level_3: |-
          if guess == secret:
              print("___!")
          elif guess < secret:
              print("비밀 숫자가 더 ___!")
          else:
              print("비밀 숫자가 더 ___!")
          ___에 정답, 커요, 작아요 중 알맞은 말을 넣어보세요! 숫자는 매번 바뀌니까 어느 말이 나와도 괜찮아요.
      solution_code: |-
        import random

        secret = random.randint(1, 10)
        guess = int(random.randint(1, 10))

        if guess == secret:
            print("정답!")
        elif guess < secret:
            print("비밀 숫자가 추측보다 커요!")
        else:
            print("비밀 숫자가 추측보다 작아요!")
  - step_number: 4
    prompt:
      step_goal: while 반복문으로 정답을 맞출 때까지 반복하기
      checklist:
        - 'while guess != secret: 으로 반복을 만들어요'
        - '반복 안에서 힌트를 보여 주고 guess 를 새로 정해요'
        - '반복이 끝나면 정답! 을 보여 줘요'
      example_output: |-
        비밀 숫자가 추측보다 커요!
        비밀 숫자가 추측보다 작아요!
        정답!
      starter_code: ''
      fallback_text: '4단계에서는 while 반복문으로 게임을 반복해요! while guess != secret: 으로 정답을 맞출 때까지 계속 추측하도록 만들어보세요!'
    answer:
      validation:
        type: code_check
        expected: while
      hints:
        level_1: while 반복문을 사용하면 조건이 참인 동안 계속 반복할 수 있어요!
        level_2: 'while guess != secret: 이렇게 쓰면 정답을 맞출 때까지 반복해요! 추측 코드를 while 안에 넣어보세요.'
        level_3: |-
          while guess ___ secret:
              guess = ___(random.randint(1, 10))
          같지 않다는 비교 기호와 타입 변환 함수를 넣어보세요!
      solution_code: |-
        import random

        secret = random.randint(1, 10)
        guess = int(random.randint(1, 10))

        while guess != secret:
            if guess < secret:
                print("비밀 숫자가 추측보다 커요!")
            else:
                print("비밀 숫자가 추측보다 작아요!")
            guess = int(random.randint(1, 10))

        print("정답!")
  - step_number: 5
    prompt:
      step_goal: 시도 횟수를 세고 완성 메시지 출력하기
      checklist:
        - 'attempts 를 0에서 시작해요'
        - '한 번 추측할 때마다 attempts 에 1을 더해요'
        - '마지막에 몇 번 만에 맞췄는지 보여 줘요'
      example_output: |-
        비밀 숫자가 추측보다 커요!
        정답! 2번 만에 맞췄어요!
      starter_code: ''
      fallback_text: 마지막 5단계! 시도 횟수를 세는 변수 attempts를 추가하고, 정답을 맞추면 "정답! N번 만에 맞췄어요!"를 출력하세요. 이걸로 게임이 완성돼요!
    answer:
      validation:
        type: contains
        expected: 번 만에 맞췄어요
      hints:
        level_1: attempts라는 변수를 만들어서 추측할 때마다 1씩 올려보세요!
        level_2: attempts = 0을 while 앞에 두고, while 안에서 attempts = attempts + 1로 올려요!
        level_3: print("정답! " + ___(attempts) + "번 만에 맞췄어요!") 숫자를 글자로 바꾸는 함수를 넣어보세요!
      solution_code: |-
        import random

        secret = random.randint(1, 10)
        guess = int(random.randint(1, 10))
        attempts = 0

        while guess != secret:
            attempts = attempts + 1
            if guess < secret:
                print("비밀 숫자가 추측보다 커요!")
            else:
                print("비밀 숫자가 추측보다 작아요!")
            guess = int(random.randint(1, 10))

        attempts = attempts + 1
        print("정답! " + str(attempts) + "번 만에 맞췄어요!")
