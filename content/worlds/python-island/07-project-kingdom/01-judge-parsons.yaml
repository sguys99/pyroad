        - { id: ln-k2dh, indent: 0 }
        - { id: ln-w9ac, indent: 1 }
        - { id: ln-b5ny, indent: 0 }
        - { id: ln-e3lq, indent: 1 }
        - { id: ln-p6xf, indent: 0 }
        - { id: ln-i7vo, indent: 1 }
    explanation: 비밀 숫자와 고른 숫자를 먼저 상자에 넣고, if 와 elif 로 작은지 큰지 물어본 뒤, 둘 다 아니면 else 로 정답을 알려 줘요. 5는 7보다 작아서 "더 큰 수예요"가 나와요.
