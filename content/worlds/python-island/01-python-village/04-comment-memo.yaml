# 퀘스트 1-4: 주석으로 메모하기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000003
order: 4
title: 주석으로 메모하기
concept: 주석(#), print()
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 주석(#)의 역할과 사용법
  learning_goals:
    - '#으로 시작하는 줄이 주석임을 안다'
    - 주석은 컴퓨터가 무시하고 사람만 읽는 메모임을 이해한다
    - 주석과 코드를 구분하여 작성할 수 있다
  story_context: 마을의 게시판에 비밀 메모를 남기는 모험가. 주석으로 쓴 메모는 컴퓨터가 읽지 못해요!
  exercise_description: 첫 줄에 주석(#)으로 아무 메모나 남기고, 둘째 줄에 print()로 "파이썬은 재미있어!"를 출력하세요
  starter_code: |
    # 여기에 메모를 남겨보세요 (이 줄은 주석이에요!)
  expected_output_hint: 파이썬은 재미있어! 만 출력되어야 해요 (주석은 출력되지 않아요)
  fallback_text: '#으로 시작하는 줄은 주석이에요. 컴퓨터는 이 줄을 무시해요! 주석 아래에 print("파이썬은 재미있어!")를 써보세요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: 파이썬은 재미있어!
  hints:
    level_1: '# 뒤에 쓴 글은 컴퓨터가 무시해요. 진짜 실행되는 코드는 뭘까요?'
    level_2: 주석 줄 아래에 print()로 문장을 출력해보세요!
    level_3: |-
      # ___
      print("___") 주석에 메모를, print에 문장을 넣어보세요!
  solution_code: |-
    # 파이썬 메모
    print("파이썬은 재미있어!")
