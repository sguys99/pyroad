# 보스 1: 출력 대장 버그버그 (P9-12 견본)
# 작성 안내: content/README.md "보스". 라운드 하나 = 퀴즈 하나와 같은 규칙. 공개 부분(prompt)에 정답을 쓰지 마세요

id: b1000000-0000-0000-0000-000000000201
order: 11
title: 출력 대장 버그버그
concept: print() 총정리
xp_reward: 60
quest_type: boss
prompt:
  topic: 1단계에서 배운 print()·따옴표·주석·줄바꿈 총정리
  learning_goals:
    - print()가 무엇을 어떤 차례로 보여 주는지 읽을 수 있다
    - 따옴표·괄호 짝이 틀린 줄을 찾아 고칠 수 있다
  story_context: 마을 입구 시계탑에 버그버그가 나타나 안내판 글자를 엉망으로 만들고 있어요! 문제를 맞힐 때마다 파이뱀이 버그버그를 콕 찌를 수 있어요.
  fallback_text: print()는 괄호 안의 글자를 화면에 보여 줘요. 따옴표와 괄호는 여는 것과 닫는 것의 짝이 맞아야 하고, 줄을 쓴 차례대로 한 줄씩 나와요.
  boss:
    name: 출력 대장 버그버그
    intro: 히히! 마을 안내판은 내가 접수했다! 내 문제를 다섯 개 다 풀면 돌려줄게!
    on_defeat: 으앗, 졌다! 너 print() 진짜 잘하는구나. 안내판은 돌려줄게, 다음 마을에서 또 보자!
    on_victory: 이번엔 내가 이겼지롱! 그래도 거의 다 왔어. 조금 쉬었다가 다시 도전해!
rounds:
  - quiz_kind: multiple_choice
    review_quest: b1000000-0000-0000-0000-000000000002
    prompt:
      quiz:
        question: 이 코드를 돌리면 무엇이 나올까?
        code: |-
          print("버그를")
          print("잡자!")
        options:
          - { id: opt-r4wk, text: "버그를\n잡자!" }
          - { id: opt-c8nz, text: '버그를 잡자!' }
          - { id: opt-y2hd, text: "\"버그를\"\n\"잡자!\"" }
          - { id: opt-e6tq, text: "잡자!\n버그를" }
    answer:
      quiz_answer:
        accepted: [opt-r4wk]
        explanation: print()는 하나가 한 줄이에요. 쓴 차례대로 버그를, 잡자! 가 한 줄씩 나와요.
        explanations:
          opt-c8nz: print()를 두 번 쓰면 두 줄로 나와요. 한 줄로 붙지 않아요.
          opt-y2hd: 따옴표는 글자를 감싸는 표시라 화면에는 나오지 않아요.
          opt-e6tq: 컴퓨터는 위에서 아래로, 쓴 차례대로 실행해요.
  - quiz_kind: bug_hunt
    review_quest: b1000000-0000-0000-0000-000000000023
    prompt:
      quiz:
        question: 오류가 나는 줄을 찾아 고쳐요
        lines:
          - id: ln-a4kd
            code: print("파이뱀 출동!")
          - id: ln-p7ws
            code: print("버그버그 등장!)
        fixes:
          - id: fx-r3hm
            code: print("버그버그 등장!")
          - id: fx-j8tc
            code: print(버그버그 등장!)
          - id: fx-n5qe
            code: print("버그버그 등장!"
    answer:
      quiz_answer:
        accepted:
          - { line: ln-p7ws, fix: fx-r3hm }
        explanation: 큰따옴표로 연 글자는 큰따옴표로 닫아야 해요. 그다음 괄호도 닫아 주면 짝이 다 맞아요.
        explanations:
          ln-a4kd: 이 줄은 따옴표와 괄호 짝이 잘 맞아요. 다른 줄을 살펴봐요.
          fx-j8tc: 따옴표가 없으면 파이썬이 글자로 읽지 못해서 오류가 나요.
          fx-n5qe: 따옴표는 맞췄는데 닫는 괄호가 빠졌어요. 괄호도 짝이 맞아야 해요.
  - quiz_kind: fill_blank
    review_quest: b1000000-0000-0000-0000-000000000024
    prompt:
      quiz:
        question: 빈칸을 채워 하나와 둘이 서로 다른 줄에 나오게 해요
        code: |-
          print("하나{{bk-w2nx}}둘")
        tokens:
          - { id: tok-q4ma, text: \n }
          - { id: tok-h6rb, text: \t }
          - { id: tok-z3kv, text: /n }
    answer:
      quiz_answer:
        accepted:
          - { bk-w2nx: tok-q4ma }
        explanation: 글자 안에 역슬래시 n 을 넣으면 그 자리에서 줄이 바뀌어요.
        explanations:
          tok-h6rb: 역슬래시 t 는 줄을 바꾸지 않고 칸을 띄워요.
          tok-z3kv: 빗금(/)은 보통 글자라서 그대로 화면에 나와요. 줄바꿈은 역슬래시(\)로 써요.
  - quiz_kind: multiple_choice
    review_quest: b1000000-0000-0000-0000-000000000003
    prompt:
      quiz:
        question: 코드에서 '#'으로 시작하는 줄은 어떤 일을 할까?
        options:
          - { id: opt-m3vb, text: 사람이 읽는 메모라서 실행되지 않아요 }
          - { id: opt-k9sa, text: 화면에 그 글자를 크게 보여 줘요 }
          - { id: opt-t5gu, text: 그 줄을 두 번 실행해요 }
    answer:
      quiz_answer:
        accepted: [opt-m3vb]
        explanation: '#으로 시작하는 줄은 주석이에요. 사람에게 남기는 메모라 컴퓨터는 건너뛰어요.'
        explanations:
          opt-k9sa: 화면에 보여 주는 건 print()의 일이에요. 주석은 화면에 나오지 않아요.
          opt-t5gu: 주석은 실행되지 않아요. 한 번도요!
  - quiz_kind: parsons
    review_quest: b1000000-0000-0000-0000-000000000002
    prompt:
      quiz:
        question: 로켓 발사 숫자 세기! 셋, 둘, 하나, 발사! 차례로 나오게 줄을 놓아요
        lines:
          - { id: ln-k2wd, code: 'print("셋")' }
          - { id: ln-b9fe, code: 'print("둘")' }
          - { id: ln-u4hs, code: 'print("하나")' }
          - { id: ln-m7cq, code: 'print("발사!")' }
    answer:
      quiz_answer:
        accepted:
          - [ln-k2wd, ln-b9fe, ln-u4hs, ln-m7cq]
        explanation: 컴퓨터는 위에 쓴 줄부터 차례로 실행해요. 먼저 나올 글자를 위에 놓으면 돼요.
