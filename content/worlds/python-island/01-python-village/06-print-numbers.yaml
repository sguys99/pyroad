# 퀘스트 1-6: 숫자도 출력해요
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000025
order: 6
title: 숫자도 출력해요
concept: print()로 숫자 출력
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: print()로 숫자 출력하기
  learning_goals:
    - print()로 숫자를 출력할 수 있다
    - 숫자는 따옴표 없이 쓰는 것을 안다
  story_context: 파이썬 마을의 시계탑에 올해 연도를 새겨야 해요! 숫자를 출력해볼까요?
  exercise_description: print()로 숫자 2026을 출력하세요. 따옴표 없이 숫자만 넣어보세요!
  starter_code: |
    # 숫자 2026을 출력해보세요!
    # 힌트: 따옴표 없이 숫자만 넣으면 돼요!
  expected_output_hint: 2026 이 출력되어야 해요
  fallback_text: print() 안에 따옴표 없이 숫자를 넣으면 숫자가 그대로 출력돼요! print(2026) 이렇게요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: '2026'
  hints:
    level_1: 글자는 따옴표가 필요하지만, 숫자는 따옴표 없이 바로 쓸 수 있어요!
    level_2: print(2026) 이렇게 따옴표 없이 숫자만 넣어보세요!
    level_3: print(___) 괄호 안에 올해 연도 숫자를 넣어보세요!
  solution_code: print(2026)
