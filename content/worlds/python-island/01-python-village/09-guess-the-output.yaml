# 퀴즈 1-9: 무엇이 나올까?
# 작성 안내: content/README.md "퀴즈" (P7-12). 공개 부분(prompt)에 정답을 쓰지 마세요

id: b1000000-0000-0000-0000-000000000103
order: 9
title: 무엇이 나올까?
concept: print(), 주석, 숫자 출력
xp_reward: 30
quest_type: quiz
quiz_kind: multiple_choice
prompt:
  topic: 주석과 print() 출력 예측하기
  learning_goals:
    - 주석(#)은 실행되지 않는다는 것을 안다
    - print()는 따옴표 안의 글자만 보여 준다는 것을 안다
  story_context: 시계탑 아래 게시판에 파이뱀이 코드를 붙여 놨어요. 돌리기 전에 무엇이 나올지 맞혀 봐요!
  fallback_text: '#으로 시작하는 줄은 메모라서 컴퓨터가 읽지 않아요. 따옴표는 글자를 감싸는 표시일 뿐 화면에는 나오지 않아요.'
  quiz:
    question: 이 코드를 돌리면 무엇이 나올까? (줄이 바뀌는 곳은 쉼표로 적었어요)
    code: |-
      # print("비밀 메모")
      print("안녕")
      print(2026)
    options:
      - { id: opt-h3ku, text: '안녕, 2026' }
      - { id: opt-b7xe, text: '"안녕", 2026' }
      - { id: opt-q2mi, text: '비밀 메모, 안녕, 2026' }
      - { id: opt-z5ca, text: '안녕' }
answer:
  quiz_answer:
    accepted: [opt-h3ku]
    explanation: '첫 줄은 #으로 시작하는 주석이라 실행되지 않아요. 글자 안녕과 숫자 2026이 한 줄씩 나와요.'
    explanations:
      opt-b7xe: 따옴표는 "여기부터 여기까지 글자"라는 표시예요. 화면에는 나오지 않아요.
      opt-q2mi: '#으로 시작하는 줄은 메모(주석)라서 컴퓨터가 실행하지 않아요.'
      opt-z5ca: 숫자도 print()로 보여 줄 수 있어요. 마지막 줄도 실행돼요.
