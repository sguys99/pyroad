# 퀘스트 1-3: 따옴표의 비밀
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000023
order: 3
title: 따옴표의 비밀
concept: 작은따옴표, 큰따옴표
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 작은따옴표와 큰따옴표의 차이
  learning_goals:
    - 작은따옴표와 큰따옴표 모두 문자열을 만들 수 있다
    - 문자열 안에 따옴표가 포함될 때 다른 종류의 따옴표로 감싸야 함을 안다
  story_context: 파이썬 마을의 따옴표 가게에 왔어요! 작은따옴표와 큰따옴표, 언제 어떤 걸 써야 할까요?
  exercise_description: print()를 사용하여 I'm happy! 를 출력해보세요. 큰따옴표로 감싸면 안에 작은따옴표를 쓸 수 있어요!
  starter_code: |
    # I'm happy! 를 출력해보세요!
    # 힌트: 큰따옴표로 감싸보세요!
  expected_output_hint: I'm happy! 가 출력되어야 해요
  fallback_text: 문자열 안에 작은따옴표(  '  )가 있으면 큰따옴표(")로 감싸면 돼요! print("I'm happy!") 이렇게요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: I'm happy!
  hints:
    level_1: 글자 안에 작은따옴표가 있으면, 바깥을 큰따옴표로 감싸야 해요!
    level_2: print("I'm happy!") 이렇게 큰따옴표로 감싸보세요!
    level_3: print("___") 큰따옴표 안에 I'm happy!를 넣어보세요!
  solution_code: print("I'm happy!")
