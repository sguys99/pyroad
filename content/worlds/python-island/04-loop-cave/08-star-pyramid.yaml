# 퀘스트 4-8: 별 피라미드 만들기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000036
order: 8
title: 별 피라미드 만들기
concept: 반복 종합
xp_reward: 75
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: for 반복문과 문자열 반복으로 피라미드 만들기
  learning_goals:
    - for 반복문과 문자열 반복(*)을 조합할 수 있다
    - 반복 변수를 활용하여 패턴을 만들 수 있다
  story_context: 동굴을 탈출하면 별 피라미드를 쌓아야 해요! 반복의 마법으로 피라미드를 완성해봐요!
  exercise_description: for 반복문과 "*" * i 를 사용하여 5줄짜리 별 피라미드를 만드세요
  starter_code: |-
    # 별 피라미드를 만들어보세요!
    # 1줄: *
    # 2줄: **
    # ...
    # 5줄: *****

    for i in range(1, 6):
        print()
  expected_output_hint: '* 부터 ***** 까지 피라미드가 출력되어야 해요'
  checklist:
    - 'print( ) 안에 "*" * i 를 넣어요'
    - '줄마다 별이 하나씩 늘어나는지 봐요'
  example_output: |-
    *
    **
    ***
    ****
    *****
  fallback_text: for i in range(1, 6)으로 i가 1, 2, 3, 4, 5가 되면서 "*" * i로 별이 1개, 2개, 3개, 4개, 5개 출력돼요!
  is_challenge: true
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      *
      **
      ***
      ****
      *****
  hints:
    level_1: '"*" * i 에서 i가 1, 2, 3, 4, 5로 바뀌면 별이 몇 개씩 나올까요?'
    level_2: 'for i in range(1, 6): 으로 i를 1부터 5까지 바꾸면서 print("*" * i)를 써보세요!'
    level_3: print() 안에 "*" * i 를 넣어보세요! i가 1이면 *, 2이면 ** 가 나와요!
  solution_code: |-
    for i in range(1, 6):
        print("*" * i)
