# 퀘스트 4-3: 구구단 외우기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000013
order: 3
title: 구구단 외우기
concept: for 반복문 활용
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: for 반복문으로 구구단 출력하기
  learning_goals:
    - for 반복문을 활용하여 패턴을 출력할 수 있다
    - 변수를 활용한 계산식을 반복문에서 사용할 수 있다
  story_context: 동굴의 마법사가 구구단 시험을 내요! 2단을 외워볼까요?
  exercise_description: 'for 반복문으로 2단 구구단(2x1=2부터 2x9=18)을 출력하세요. 형식: 2 x 1 = 2'
  starter_code: |-
    # 2단 구구단을 출력해보세요!
    # 형식: 2 x 1 = 2

    for i in range(1, 10):
        print()
  expected_output_hint: 2 x 1 = 2 부터 2 x 9 = 18 까지 출력되어야 해요
  checklist:
    - 'print( ) 안에 2, "x", i, "=", 2*i 를 차례로 넣어요'
    - '2 x 1 = 2 부터 2 x 9 = 18 까지 나오는지 봐요'
  example_output: |-
    2 x 1 = 2
    2 x 2 = 4
    2 x 3 = 6
    2 x 4 = 8
    2 x 5 = 10
    2 x 6 = 12
    2 x 7 = 14
    2 x 8 = 16
    2 x 9 = 18
  fallback_text: for i in range(1, 10)으로 i가 1부터 9까지 바뀌면서 2 * i를 계산해요! print(2, "x", i, "=", 2*i)로 예쁘게 출력할 수 있어요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: contains
    expected: = 6
  hints:
    level_1: 구구단은 같은 숫자에 1, 2, 3, ... 9를 곱하는 거예요! print() 안에 무엇을 넣어야 할까요?
    level_2: print() 안에 2, "x", i, "=", 2 * i 이렇게 넣어보세요!
    level_3: print(___, "x", i, "=", ___) 곱하는 숫자와 결과 계산식을 넣어보세요!
  solution_code: |-
    for i in range(1, 10):
        print(2, "x", i, "=", 2*i)
