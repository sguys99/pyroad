# 보스 4: 메아리 버그버그 (P9-13)
# 작성 안내: content/README.md "보스". 라운드 하나 = 퀴즈 하나와 같은 규칙. 공개 부분(prompt)에 정답을 쓰지 마세요

id: b1000000-0000-0000-0000-000000000204
order: 12
title: 메아리 버그버그
concept: 반복문 총정리
xp_reward: 36
quest_type: boss
prompt:
  topic: 4단계에서 배운 for·range()·while·반복 멈추기와 건너뛰기·글자 곱하기 총정리
  learning_goals:
    - range()가 어디서 시작해 어디 앞에서 멈추는지 안다
    - 반복할 때마다 상자 값이 어떻게 바뀌는지 따라갈 수 있다
    - 반복을 아예 끝내는 말과 이번 차례만 건너뛰는 말을 구별한다
  story_context: 동굴 깊은 곳에서 "반복~ 반복~" 메아리가 끝없이 울려요. 메아리를 멈추지 않으면 동굴 밖으로 나갈 수 없대요!
  fallback_text: for 는 정해진 횟수만큼, while 은 조건이 맞는 동안 반복해요. range(1, 5)는 1부터 시작해 5 바로 앞인 4에서 멈춰요. break 는 반복을 아예 끝내요. 이번 차례만 건너뛰고 다음 차례로 가는 말도 따로 있어요.
  boss:
    name: 메아리 버그버그
    look: cave
    intro: 반복! 반복! 반복~! 동굴에 내 목소리가 울린다~ 다섯 문제를 다 풀기 전엔 못 나가지롱~
    on_defeat: 메아리가… 멈췄다…! 반복을 이렇게 잘 세다니. 동굴 문 열어 줄게~ 열어 줄게~
    on_victory: 또 만났네~ 만났네~ 반복이 몇 번 도는지 손가락으로 세어 보고 다시 와~
rounds:
  - quiz_kind: multiple_choice
    review_quest: b1000000-0000-0000-0000-000000000033
    prompt:
      quiz:
        question: 메아리 주문이에요. 돌리면 무엇이 나올까?
        code: |-
          for i in range(3):
              print("메" + "아" * i)
        options:
          - { id: opt-n6dw, text: "메\n메아\n메아아" }
          - { id: opt-b3ky, text: "메아\n메아아\n메아아아" }
          - { id: opt-t8oe, text: "메아\n메아\n메아" }
          - { id: opt-z4cr, text: '메아아아' }
    answer:
      quiz_answer:
        accepted: [opt-n6dw]
        explanation: range(3)은 0, 1, 2 예요. "아"를 0번, 1번, 2번 곱하니까 메, 메아, 메아아 가 한 줄씩 나와요.
        explanations:
          opt-b3ky: range(3)은 1이 아니라 0부터 시작해요. 처음엔 "아"가 0번 붙어요.
          opt-t8oe: i 는 반복할 때마다 0, 1, 2 로 바뀌어요. 붙는 "아"의 개수도 달라져요.
          opt-z4cr: print()가 반복 안에 있어서 반복할 때마다 한 줄씩 나와요.
  - quiz_kind: bug_hunt
    review_quest: b1000000-0000-0000-0000-000000000012
    prompt:
      quiz:
        question: 1부터 5까지 세야 하는데 5가 빠져요. 틀린 줄을 찾아 고쳐요
        lines:
          - id: ln-r7hq
            code: 'for i in range(1, 5):'
          - id: ln-e2vs
            code: '    print(i)'
        fixes:
          - id: fx-w3gn
            code: 'for i in range(1, 6):'
          - id: fx-u9ab
            code: 'for i in range(0, 5):'
          - id: fx-h6lc
            code: 'for i in range(2, 6):'
    answer:
      quiz_answer:
        accepted:
          - { line: ln-r7hq, fix: fx-w3gn }
        explanation: range()의 끝 숫자는 들어가지 않아요. 5까지 세려면 끝을 하나 더 큰 6으로 써요.
        explanations:
          ln-e2vs: 이 줄은 들여쓰기가 맞고 i 를 잘 보여 줘요. 반복 범위를 정하는 줄을 살펴봐요.
          fx-u9ab: 0부터 시작하면 0, 1, 2, 3, 4 가 나와요. 여전히 5가 없어요.
          fx-h6lc: 끝은 맞췄지만 2부터 시작해서 1이 빠져요.
  - quiz_kind: fill_blank
    review_quest: b1000000-0000-0000-0000-000000000015
    prompt:
      quiz:
        question: 빈칸을 채워 4만 건너뛰고 1, 2, 3, 5, 6, 7 이 나오게 해요
        code: |-
          for n in range(1, 8):
              if n == 4:
                  {{bk-j5yt}}
              print(n)
        tokens:
          - { id: tok-p8ux, text: continue }
          - { id: tok-c4ga, text: break }
          - { id: tok-o3fm, text: stop }
    answer:
      quiz_answer:
        accepted:
          - { bk-j5yt: tok-p8ux }
        explanation: continue 는 이번 차례만 건너뛰고 다음 숫자로 넘어가요. 4일 때 print 를 건너뛰어서 4만 빠져요.
        explanations:
          tok-c4ga: break 는 반복을 아예 끝내요. 1, 2, 3 까지만 나와요.
          tok-o3fm: 파이썬에는 stop 이라는 명령이 없어서 오류가 나요.
  - quiz_kind: parsons
    review_quest: b1000000-0000-0000-0000-000000000035
    prompt:
      quiz:
        question: while 로 3 + 2 + 1 을 더해서 합계 6을 딱 한 번만 보여 줘요. 줄을 놓고 들여쓰기도 맞춰요
        indent: true
        lines:
          - { id: ln-v5ok, code: 'total = 0' }
          - { id: ln-i2pw, code: 'n = 3' }
          - { id: ln-q8ze, code: 'while n > 0:' }
          - { id: ln-g4ma, code: 'total = total + n' }
          - { id: ln-k7rb, code: 'n = n - 1' }
          - { id: ln-d3yf, code: 'print(total)' }
    answer:
      quiz_answer:
        accepted:
          - - { id: ln-v5ok, indent: 0 }
            - { id: ln-i2pw, indent: 0 }
            - { id: ln-q8ze, indent: 0 }
            - { id: ln-g4ma, indent: 1 }
            - { id: ln-k7rb, indent: 1 }
            - { id: ln-d3yf, indent: 0 }
          - - { id: ln-i2pw, indent: 0 }
            - { id: ln-v5ok, indent: 0 }
            - { id: ln-q8ze, indent: 0 }
            - { id: ln-g4ma, indent: 1 }
            - { id: ln-k7rb, indent: 1 }
            - { id: ln-d3yf, indent: 0 }
        explanation: 두 상자를 먼저 만들고, 반복 안에서 n 을 더한 다음 1 줄여요. 합계는 반복이 끝난 뒤 한 번만 보여 줘야 해서 print 는 들여쓰지 않아요.
  - quiz_kind: multiple_choice
    review_quest: b1000000-0000-0000-0000-000000000014
    prompt:
      quiz:
        question: 동굴 출구 주문이에요. 돌리면 무엇이 나올까?
        code: |-
          for n in range(1, 10):
              if n % 2 == 0:
                  continue
              if n > 5:
                  break
              print(n)
        options:
          - { id: opt-m4xu, text: "1\n3\n5" }
          - { id: opt-a9kf, text: "1\n3\n5\n7\n9" }
          - { id: opt-w7se, text: "2\n4" }
          - { id: opt-y5bl, text: "1\n3\n5\n7" }
    answer:
      quiz_answer:
        accepted: [opt-m4xu]
        explanation: 짝수는 continue 로 건너뛰고, 홀수 1, 3, 5 를 보여 줘요. 7이 되면 5보다 커서 break 로 반복이 끝나요.
        explanations:
          opt-a9kf: 7은 5보다 커서 break 를 만나요. break 뒤로는 반복하지 않아요.
          opt-w7se: continue 는 짝수일 때 print 를 건너뛰게 해요. 짝수는 나오지 않아요.
          opt-y5bl: 7일 때는 print 보다 break 를 먼저 만나서 7은 나오지 않아요.
