# 퀘스트 4-3: 별 찍기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000033
order: 3
title: 별 찍기
concept: 문자열 반복(*)
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: 문자열 반복 연산자 *
  learning_goals:
    - '* 연산자로 문자열을 반복할 수 있다'
    - print()와 문자열 반복을 조합할 수 있다
  story_context: 동굴 벽에 별을 새겨야 마법 문이 열려요! 별을 5개 찍어볼까요?
  exercise_description: print("*" * 5)를 사용하여 별 5개를 한 줄로 출력하세요
  starter_code: |-
    # 별을 5개 찍어보세요!
    # 힌트: 문자열 * 숫자 = 반복!

    print("*" * ___)
  expected_output_hint: '***** 가 출력되어야 해요'
  checklist:
    - '"*" * 뒤 빈칸에 5를 넣어요'
    - '별 다섯 개가 한 줄로 나오는지 봐요'
  example_output: |-
    *****
  fallback_text: 문자열에 * 숫자를 하면 그만큼 반복돼요! "*" * 5 = "*****" 이에요.
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: '*****'
  hints:
    level_1: 문자열에 * 를 쓰면 반복할 수 있어요! "하" * 3 = "하하하"
    level_2: '"*" * 5 이렇게 쓰면 별이 5번 반복돼요!'
    level_3: print("*" * ___) 빈칸에 숫자 5를 넣어보세요!
  solution_code: print("*" * 5)
