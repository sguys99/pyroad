# 퀘스트 4-6: 짝수만 골라내기
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000015
order: 6
title: 짝수만 골라내기
concept: for, if, continue
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: continue로 특정 반복 건너뛰기
  learning_goals:
    - continue가 현재 반복만 건너뛰는 것을 안다
    - '% (나머지) 연산자를 사용할 수 있다'
    - for와 if를 조합하여 필터링할 수 있다
  story_context: 동굴의 마법 필터! 짝수만 통과시키고 홀수는 막아요.
  exercise_description: 1부터 10까지 반복하면서 짝수만 출력하세요 (홀수는 continue로 건너뛰기)
  starter_code: |-
    # 짝수만 출력해보세요!
    for i in range(1, 11):
        if i % 2 != 0:
            # 홀수면 건너뛰세요!
            
        print(i)
  expected_output_hint: 2, 4, 6, 8, 10이 한 줄씩 출력되어야 해요
  checklist:
    - '홀수일 때 continue 를 써서 건너뛰어요'
    - '짝수만 한 줄씩 나오는지 봐요'
  example_output: |-
    2
    4
    6
    8
    10
  fallback_text: '% 는 나머지를 구하는 연산자예요! i % 2 != 0은 홀수라는 뜻이에요. continue를 만나면 아래 코드를 건너뛰고 다음 반복으로 가요.'
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      2
      4
      6
      8
      10
  hints:
    level_1: 짝수는 2로 나누어 떨어지는 숫자예요. 홀수는 건너뛰려면 어떤 명령어를 써야 할까요?
    level_2: continue를 쓰면 아래 코드를 건너뛰고 다음 반복으로 가요!
    level_3: ___ 홀수를 건너뛰는 명령어 한 단어를 써보세요!
  solution_code: |-
    for i in range(1, 11):
        if i % 2 != 0:
            continue
        print(i)
