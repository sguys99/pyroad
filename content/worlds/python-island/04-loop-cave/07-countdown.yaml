# 퀘스트 4-7: 카운트다운
# 작성 안내: content/README.md

id: b1000000-0000-0000-0000-000000000035
order: 7
title: 카운트다운
concept: while 감소 반복
xp_reward: 50
quest_type: code
# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: while 반복문으로 감소하며 반복하기
  learning_goals:
    - while 반복문으로 숫자를 줄여가며 반복할 수 있다
    - 감소하는 반복 패턴을 이해한다
  story_context: 동굴 탈출 카운트다운! 5초 안에 빠져나가야 해요! 5, 4, 3, 2, 1... 탈출!
  exercise_description: while 반복문으로 5부터 1까지 카운트다운을 출력하세요
  # B31: 예전 시작 코드는 count 를 줄이는 줄이 없어 그대로 실행하면 무한 루프(5초 타임아웃)였음.
  # 빈칸(___)을 채우기 전에는 오류로 바로 멈춰요
  starter_code: |
    # 카운트다운을 만들어보세요!
    count = 5

    while count >= 1:
        print(count)
        # count를 1씩 줄여보세요! ___ 에 알맞은 숫자를 넣어요
        count = count - ___
  expected_output_hint: 5, 4, 3, 2, 1이 한 줄씩 출력되어야 해요
  checklist:
    - '빈칸 ___ 에 1을 넣어 count 를 하나씩 줄여요'
    - '5부터 1까지 한 줄씩 나오는지 봐요'
  example_output: |-
    5
    4
    3
    2
    1
  fallback_text: count = 5에서 시작해서, 반복할 때마다 count = count - 1로 1씩 줄여가요. count가 0이 되면 멈춰요!
# 정답: 서버만 읽습니다 (quest_answer_keys). validation.type 만 공개(quests.validation_type)
answer:
  validation:
    type: output_match
    expected: |-
      5
      4
      3
      2
      1
  hints:
    level_1: 'while count >= 1: 은 count가 1 이상인 동안 반복해요. count를 줄여가야 해요!'
    level_2: count = count - 1 으로 반복할 때마다 1씩 줄이면 돼요!
    level_3: count = count - ___ 의 ___ 에 1을 넣어보세요! 그러면 5, 4, 3, 2, 1 하고 멈춰요.
  solution_code: |-
    count = 5

    while count >= 1:
        print(count)
        count = count - 1
