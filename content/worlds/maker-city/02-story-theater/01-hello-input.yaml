# 3월드 퀘스트 2-1: 모험가 별명
# 작성 안내: content/README.md · 설계: docs/curriculum/world3.md §4 3-2
# 시험 손님(P11-05, 제안 C): 손님마다 다른 별명 → 별명을 그대로 print 한 답은 떨어짐. 진짜 이름이 아니라 별명만 물음(제안 J)

id: b3000000-0000-0000-0000-000000000008
order: 1
title: 모험가 별명
concept: input()
xp_reward: 100
quest_type: code
prompt:
  topic: input() 으로 묻고 답 받기
  learning_goals:
    - input() 으로 질문하고 입력한 답을 변수에 담을 수 있다
    - 입력받은 글자를 f-string 에 넣어 인사할 수 있다
  story_context: 모험 이야기 극장에 왔어요! 그런데 이야기책이 첫 장에서 멈춰 버렸대요. 이야기를 다시 움직이려면 관객에게 말을 걸어야 해요. 먼저 관객의 모험가 별명을 물어볼까요? 진짜 이름 말고 멋진 별명으로요!
  exercise_description: 'input("모험가 별명은? ") 으로 별명을 물어 nickname 에 담고, "반가워요, (별명) 모험가님!" 을 출력하세요'
  starter_code: |
    # 1) input( ) 으로 "모험가 별명은? " 하고 물어 nickname 에 담아요

    # 2) f-string 으로 "반가워요, (별명) 모험가님!" 을 출력해요
  expected_output_hint: 시험 손님이 별명을 말하면 그 별명으로 인사해야 해요
  checklist:
    - nickname = input("모험가 별명은? ") 을 써요
    - f-string 의 { } 안에 nickname 을 넣어 인사해요
    - 시험 손님 부르기로 손님마다 다른 별명이 나오는지 봐요
  example_output: '모험가 별명은? 반가워요, 별똥 모험가님!'
  fallback_text: 'input("질문") 은 질문을 보여 주고, 사용자가 글자를 치고 Enter 를 누를 때까지 기다려요. 친 글자가 그대로 돌아와서 nickname = input("모험가 별명은? ") 처럼 변수에 담을 수 있어요. 그다음 print(f"반가워요, {nickname} 모험가님!") 처럼 f-string 에 넣어요.'
