        # 1이면 "미르가 신나서 하늘을 한 바퀴 날았어요. 엔딩: 노래하는 친구"
        # 아니고 가방에 열쇠가 있으면 "열쇠로 보물 상자가 열렸어요! 엔딩: 숲속 보물 찾기"
        # 둘 다 아니면 "미르와 지도를 들고 집으로 돌아가 다음 모험을 꿈꿔요. 엔딩: 다음 모험 약속"
        # 마지막에 "(별명)의 모험 끝!" 을 출력해요
      fallback_text: '갈림길이 셋이면 if, elif, else 를 써요. 위에서부터 차례로 확인해서 처음 참인 곳 하나만 실행해요. 노래(1)인지 먼저 보고, 아니면 가방에 열쇠가 있는지, 둘 다 아니면 마지막 엔딩이에요. 다 만들면 시험 손님 세 명이 엔딩 세 개를 하나씩 봐요!'
    answer:
      validation:
        type: code_check
        expected: 'elif'
        whole_word: true
      scenarios:
        - name: 노래하는 손님
          inputs: ['콩콩', '1', '거북이', '1']
          expect:
            type: all
            rules:
              - { type: contains, expected: '엔딩: 노래하는 친구' }
              - { type: contains, expected: '모험 끝' }
        - name: 열쇠로 선물하는 손님
          inputs: ['콩콩', '1', '거북이', '2']
          expect:
            type: all
            rules:
              - { type: contains, expected: '엔딩: 숲속 보물 찾기' }
              - { type: contains, expected: '모험 끝' }
        - name: 지도로 선물하는 손님
          inputs: ['콩콩', '2', '거북이', '2']
          expect:
            type: all
            rules:
              - { type: contains, expected: '엔딩: 다음 모험 약속' }
              - { type: contains, expected: '모험 끝' }
      hints:
        level_1: '엔딩이 세 개라서 갈림길도 세 갈래예요. 두 번째 갈림길에서 가방을 확인해요.'
        level_2: 'if gift == "1": 엔딩 1, elif "열쇠" in bag: 엔딩 2, else: 엔딩 3 을 쓰고, 맨 아래에 print(f"{nickname}의 모험 끝!") 을 써요.'
        level_3: |-
          if gift == "1":
              print("미르가 신나서 하늘을 한 바퀴 날았어요. 엔딩: 노래하는 친구")
          ___ "열쇠" in bag:
              print("열쇠로 보물 상자가 열렸어요! 엔딩: 숲속 보물 찾기")
          else:
              print("미르와 지도를 들고 집으로 돌아가 다음 모험을 꿈꿔요. 엔딩: 다음 모험 약속")
          print(f"{nickname}의 모험 끝!")
          빈칸에 "아니면 만약"을 뜻하는 주문을 넣어 보세요!
      solution_code: |
        # 숲속 모험 이야기
        nickname = input("모험가 별명은? ")
        bag = []
        print(f"{nickname}, 모험을 시작해요!")

        # 2단계: 첫 갈림길
        way = input("1) 반짝이는 동굴  2) 시원한 강  어디로 갈까요? ")
        if way == "1":
            print("동굴에서 반짝이는 열쇠를 주웠어요!")
            bag.append("열쇠")
        else:
            print("강가에서 낡은 지도를 주웠어요!")
            bag.append("지도")

        # 3단계: 수수께끼 문
        print("커다란 문이 말해요. 등딱지를 지고 느릿느릿 걷는 동물은?")
        tries = 1
        answer = input("정답은? ")
        while answer != "거북이":
            print("땡! 다시 생각해 봐요.")
            tries = tries + 1
            answer = input("정답은? ")
        print(f"{tries}번 만에 문이 열렸어요!")

        # 4단계: 아기 용 미르
        def talk_dragon(bag):
            print("문 너머에서 아기 용 미르를 만났어요!")
            if "열쇠" in bag:
                print("미르: 내 보물 상자 열쇠잖아! 찾아 줘서 고마워!")
            else:
                print("미르: 지도가 있구나! 같이 보물 상자를 찾아보자!")

        talk_dragon(bag)

        # 5단계: 마지막 선택
        gift = input("미르에게 무엇을 해 줄까요? 1) 노래 불러 주기  2) 선물 주기 ")
        if gift == "1":
            print("미르가 신나서 하늘을 한 바퀴 날았어요. 엔딩: 노래하는 친구")
        elif "열쇠" in bag:
            print("열쇠로 보물 상자가 열렸어요! 엔딩: 숲속 보물 찾기")
        else:
            print("미르와 지도를 들고 집으로 돌아가 다음 모험을 꿈꿔요. 엔딩: 다음 모험 약속")
        print(f"{nickname}의 모험 끝!")
