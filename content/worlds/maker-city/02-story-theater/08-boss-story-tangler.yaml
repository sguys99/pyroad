# 3월드 보스 2: 이야기 뒤죽박죽 버그버그 (5문제)
# 작성 안내: content/README.md "보스". 공개 부분(prompt)에 정답을 쓰지 마세요
# 퀴즈·보스 코드에는 input() 을 넣지 않음 → "입력했다고 해요" 주석과 답 리스트로 (world3.md §5)

id: b3000000-0000-0000-0000-000000000202
order: 8
title: 이야기 뒤죽박죽 버그버그
concept: 입력과 갈림길 총정리
xp_reward: 60
quest_type: boss
prompt:
  topic: 입력은 글자, int 로 바꾸기, 다시 묻기, 갈림길 총정리
  learning_goals:
    - 입력받은 값이 글자라는 것을 떠올려 결과를 예측할 수 있다
    - 다시 묻기 반복과 갈림길의 순서를 맞추고 버그를 고칠 수 있다
  story_context: 이야기책이 마지막 장까지 열리려는 순간, 두루마리 망토를 두른 버그버그가 책장을 마구 섞어 버렸어요! 다섯 문제를 풀어 이야기를 제자리로 돌려놓아요.
  fallback_text: input() 으로 받은 값은 늘 글자예요. 숫자 계산을 하려면 int() 로 바꾸고, 글자와 견줄 때는 따옴표를 붙여요. 잘못 고르면 while 로 다시 묻고, 갈림길이 여럿이면 if, elif, else 를 위에서부터 차례로 봐요.
  boss:
    name: 이야기 뒤죽박죽 버그버그
    look: storyteller
    intro: 옛날 옛적에… 히히, 내가 이야기를 다 섞어 놨지! 다섯 장을 바로잡으면 이야기를 돌려줄게!
    on_defeat: 으앗, 이야기가 다 제자리로 돌아갔네! 사실 나도 이 이야기 끝이 궁금했어. 다음엔 관객으로 올게!
    on_victory: 히히, 이야기는 아직 뒤죽박죽이야! 극장에서 연습하고 다시 와. 다음 장에서 기다릴게!
rounds:
  - quiz_kind: multiple_choice
    review_quest: b3000000-0000-0000-0000-000000000010
    prompt:
      quiz:
        question: 손님이 사탕 수로 4를 입력했다고 해요. 돌리면 무엇이 나올까?
        code: |-
          candy = "4"  # 4를 입력했다고 해요
          print(candy * 3)
        options:
          - { id: opt-4sev, text: '444' }
          - { id: opt-158n, text: '12' }
          - { id: opt-4zzu, text: '7' }
          - { id: opt-4u1k, text: '4 4 4' }
    answer:
      quiz_answer:
        accepted: [opt-4sev]
        explanation: 입력은 글자라서 "4" * 3 은 글자 "4" 를 세 번 이어 붙인 444 예요. 12 를 만들려면 int(candy) * 3 이에요.
        explanations:
          opt-158n: 숫자 4라면 12 지만, 입력은 글자라서 이어 붙여요.
          opt-4zzu: 4 + 3 이 아니라 곱하기예요. 그리고 글자라서 이어 붙여요.
          opt-4u1k: 글자를 이어 붙일 때 사이에 빈칸이 생기지 않아요.
  - quiz_kind: fill_blank
    review_quest: b3000000-0000-0000-0000-000000000009
    prompt:
      quiz:
        question: 빈칸을 채워 입력한 사과 수에 3개를 더해요
        code: |-
          apples = "5"  # 5를 입력했다고 해요
          total = {{bk-n915}}(apples) + 3
          print(f"사과 {total}개")
        tokens:
          - { id: tok-zqa0, text: int }
          - { id: tok-3e4g, text: str }
          - { id: tok-yc0w, text: len }
    answer:
      quiz_answer:
        accepted:
          - { bk-n915: tok-zqa0 }
        explanation: int 로 글자 "5" 를 숫자 5 로 바꿔야 3 을 더해 사과 8개가 돼요.
        explanations:
          tok-3e4g: str 은 글자로 만드는 주문이에요. 글자에 숫자 3 을 더하면 에러가 나요.
          tok-yc0w: len 은 글자 수를 세요. "5" 는 한 글자라 1 + 3 = 4 가 돼요.
