          - { id: ln-5qw2, code: 'while door != "1" and door != "2":' }
          - { id: ln-v0gn, code: 'print("다시 골라 줘요!")' }
          - { id: ln-4z1u, code: n = n + 1 }
          - { id: ln-fn0b, code: 'door = answers[n]' }
          - { id: ln-6vmr, code: 'print(f"{door}번 문으로 가요!")' }
