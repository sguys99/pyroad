  - quiz_kind: bug_hunt
    review_quest: b3000000-0000-0000-0000-000000000013
    prompt:
      quiz:
        question: 2를 입력했는데 선물을 주지 않고 모험이 끝나 버려요. 틀린 줄을 찾아 고쳐요
        lines:
          - { id: ln-pl03, code: 'choice = "2"  # 2를 입력했다고 해요' }
          - { id: ln-30oc, code: 'if choice == "1":' }
          - { id: ln-5zts, code: '    print("노래를 불러 줘요")' }
          - { id: ln-p6fj, code: 'elif choice == 2:' }
          - { id: ln-1ciw, code: '    print("선물을 줘요")' }
          - { id: ln-4t61, code: 'else:' }
          - { id: ln-n9ju, code: '    print("모험 끝")' }
        fixes:
          - { id: fx-nz5h, code: 'elif choice == "2":' }
          - { id: fx-w4qh, code: 'elif int(choice) == 2:' }
          - { id: fx-h92o, code: 'elif choice = "2":' }
          - { id: fx-qhw6, code: 'elif choice == "1":' }
    answer:
      quiz_answer:
        accepted:
          - { line: ln-p6fj, fix: fx-nz5h }
          - { line: ln-p6fj, fix: fx-w4qh }
        explanation: choice 는 글자 "2" 라서 숫자 2 와 견주면 False 예요. 그래서 else 로 가 버렸어요. 따옴표를 붙여 글자끼리 견주거나 int(choice) 로 바꾸면 선물을 줘요.
        explanations:
          fx-h92o: '= 하나는 값을 넣는 주문이라 견줄 수 없어요. == 를 써요.'
          fx-qhw6: 1 은 노래를 부르는 갈림길이에요. 2 를 견줘야 해요.
  - quiz_kind: multiple_choice
    review_quest: b3000000-0000-0000-0000-000000000011
    prompt:
      quiz:
        question: 손님이 3을 입력했다고 해요. 돌리면 무엇이 나올까?
        code: |-
          door = "3"  # 3을 입력했다고 해요
          if door == "1":
              print("동굴")
          elif door == "2":
              print("강")
          else:
              print("다시 골라 줘요")
        options:
          - { id: opt-0g3n, text: '다시 골라 줘요' }
          - { id: opt-i8pd, text: '강' }
          - { id: opt-04tn, text: '동굴' }
          - { id: opt-40ks, text: "동굴\n강" }
    answer:
      quiz_answer:
        accepted: [opt-0g3n]
        explanation: '"3" 은 "1" 도 "2" 도 아니라서 if 와 elif 를 지나 else 로 가요.'
        explanations:
          opt-i8pd: elif 는 "2" 일 때만이에요. 손님은 3을 입력했어요.
          opt-04tn: if 는 "1" 일 때만 실행돼요.
          opt-40ks: if, elif, else 중에서 하나만 실행돼요.
