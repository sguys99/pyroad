    review_quest: b3000000-0000-0000-0000-000000000012
    prompt:
      quiz:
        question: 손님이 3, 안녕, 2 를 차례로 입력했다고 해요. 줄을 순서대로 놓고 들여쓰기도 맞춰, 1이나 2가 나올 때까지 다시 물어요
