  hints:
    level_1: 움직인 다음에 "벽을 넘었나?" 를 물어보고, 넘었으면 벽 자리로 되돌려요.
    level_2: 'if x > 200: 아래에 x = 200 을, if x < -200: 아래에 x = -200 을 들여 써요. 둘 다 t.goto(x, 0) 보다 위예요.'
    level_3: |-
      if x > 200:
          x = 200
      if x < ___:
          x = -200
      빈칸에 왼쪽 벽 숫자를 넣어 보세요!
  solution_code: |
    import time
    import turtle
    from pyroad import get_key

    t = turtle.Turtle()
    x = 0

    for frame in range(150):
        key = get_key()
        if key == "Right":
            x = x + 10
        elif key == "Left":
            x = x - 10

        if x > 200:
            x = 200
        if x < -200:
            x = -200

        t.goto(x, 0)
        time.sleep(1 / 30)

    print(t.position())
