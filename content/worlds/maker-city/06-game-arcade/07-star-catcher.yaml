# 3월드 프로젝트 6-7: 별똥별 잡기 게임 (5단계, 고쳐 나가기 + 자리표 주석 — world3.md §3 제안 B)
# 작성 안내: content/README.md "프로젝트 퀘스트" · 설계: docs/curriculum/world3.md §4 3-6
# 게임 시간은 range(900) 으로 끝이 있음 (제안 E). 키 손님은 잠을 건너뛰어 900프레임도 바로 끝남 (P11-04)
# 별똥별 x 는 무작위 → 시드를 고정하지 않고, 충돌은 고정 좌표 검사 줄(제안 F), 끝 줄은 "게임 끝! 점수:" 까지만 봄
# 3~5단계 손님(오른쪽 세 번)은 채점을 바로 끝내고(30초 플레이 없이) 느릿이 움직임이 그대로인지 확인
# 거북이는 goto 로 옮기기만 (clear 없음) — 명령 스트림이 작아 작품 저장 상한 안
# 마지막 단계를 끝낸 완성 작품(플레이 기록)만 갤러리에 출품 (publishableQuests: 3월드 project 완료)

