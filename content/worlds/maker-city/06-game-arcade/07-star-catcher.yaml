          빈칸에 그림판에 글씨를 쓰는 주문을 넣어 보세요!
      solution_code: |
        # 별똥별 잡기 게임
        import time
        import random    # (3단계에서 써요)
        import turtle
        from pyroad import get_key

        screen = turtle.Screen()
        screen.bgcolor("midnightblue")   # 밤하늘
        screen.tracer(0)

        player = turtle.Turtle()   # 느릿이
        player.shape("turtle")
        player.color("lightgreen")
        player.penup()
        player.goto(0, -150)

        # 2단계: 게임 루프 — 1초에 30번 × 30초 = 900번 돌아요
        star = turtle.Turtle()     # 별똥별
        star.shape("circle")
        star.color("gold")
        star.penup()
        star.goto(random.randint(-200, 200), 200)
        def caught(a, b):
            return a.distance(b) < 20

        score = 0
        x = 0
        for frame in range(900):
            key = get_key()
            if key == "Right":
                x = x + 10
            elif key == "Left":
                x = x - 10
            if x > 200:
                x = 200
            if x < -200:
                x = -200
            player.goto(x, -150)
            star.goto(star.xcor(), star.ycor() - 5)
            if star.ycor() < -200:
                star.goto(random.randint(-200, 200), 200)
            if caught(player, star):
                score = score + 1
                star.goto(random.randint(-200, 200), 200)
            screen.update()
            time.sleep(1 / 30)

        print(player.position())

        # 4단계 검사 줄: 고치지 말고 결과만 봐요
        star.goto(player.xcor() + 5, player.ycor())
        test1 = caught(player, star)
        star.goto(player.xcor(), player.ycor() + 100)
        test2 = caught(player, star)
        print("검사:", test1, test2)

        # 5단계: 게임 끝
        print(f"게임 끝! 점수: {score}")
        pen = turtle.Turtle()
        pen.hideturtle()
        pen.color("white")
        pen.write(f"게임 끝! 점수: {score}", align="center", font=("Arial", 24, "bold"))
        screen.update()
