# 빈칸 하나만 다른 토큰으로 바꿔도 위치가 달라지게 키 순서를 고름 (quizzes.content.test)

id: b3000000-0000-0000-0000-000000000039
order: 6
title: 키 빈칸
concept: 키 이름으로 갈림길
xp_reward: 30
quest_type: quiz
quiz_kind: fill_blank
prompt:
  topic: 누른 키에 따라 다르게 움직이기
  learning_goals:
    - 키 이름을 견주는 if 와 elif 로 움직이는 방향을 정할 수 있다
  story_context: 버그버그가 게임기의 키 이름표를 떼어 가 버렸어요! 손님이 누른 키 네 개를 차례로 읽어 느릿이를 움직이는 코드의 빈칸을 채워 줘요.
  fallback_text: 오른쪽 키면 x 를 10 늘리고, 왼쪽 키면 10 줄여요. 키 이름은 따옴표 안에 대문자로 시작해요. 누른 키를 하나씩 따라가며 x 가 어떻게 바뀌는지 손가락으로 세어 봐요.
  quiz:
    question: 빈칸을 채워 오른쪽 키는 오른쪽으로, 왼쪽 키는 왼쪽으로 10씩 움직여요
    code: |-
      import turtle
      t = turtle.Turtle()
      keys = ["Right", "Right", "Left", "Right"]  # 손님이 누른 키
      x = 0
      for key in keys:
          if key == {{bk-r4wz}}:
              x = x + 10
          elif key == {{bk-m2pq}}:
              x = x - 10
          t.goto(x, 0)
      print(t.position())
    tokens:
      - { id: tok-k8vn, text: '"Right"' }
      - { id: tok-5ajd, text: '"Left"' }
      - { id: tok-w3ub, text: '"Up"' }
answer:
  quiz_answer:
    accepted:
      - { bk-r4wz: tok-k8vn, bk-m2pq: tok-5ajd }
    explanation: 오른쪽 키 세 번이면 +30, 왼쪽 키 한 번이면 -10 이라서 x 는 20 이에요. 느릿이는 (20.00,0.00) 에 있어요.
    explanations:
      tok-w3ub: '"Up" 은 위쪽 화살표예요. 이 손님은 위 키를 누르지 않았어요.'
