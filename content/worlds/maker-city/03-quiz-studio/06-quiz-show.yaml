  - step_number: 5
    prompt:
      step_goal: '틀린 문제를 wrong 에 모으고, 점수로 등급과 오답 노트 보여 주기'
      checklist:
        - 'hearts = 3 아래에 wrong = [] 을 만들어요'
        - '틀리면 wrong.append(card["q"]) 로 문제를 모아요'
        - 'if, elif, else 로 등급을 말하고 오답 노트를 보여 줘요'
      example_output: |-
        (앞에 이어서)
        게임 오버!
        점수: 0
        등급: 퀴즈 새싹! 다음엔 더 잘할 수 있어요
        오답 노트
        - 한 바퀴는 몇 도일까요?
        - 바다에서 가장 큰 동물은?
        - 다리가 8개인 바다 동물은?
      starter_code: |

        # 5단계: 등급과 오답 노트
        #   1) 위 코드를 고쳐요: hearts = 3 아래에 빈 리스트 wrong = [] 을 만들고,
        #      틀렸을 때(else) wrong.append(card["q"]) 로 틀린 문제를 모아요
        #   2) 여기 아래에 점수로 등급을 알려 줘요
        #      4점 이상 "등급: 퀴즈 왕!", 2점 이상 "등급: 퀴즈 박사!",
        #      아니면 "등급: 퀴즈 새싹! 다음엔 더 잘할 수 있어요"
        #   3) "오답 노트" 를 출력하고 wrong 의 문제를 "- 문제" 모양으로 한 줄씩 보여 줘요
      fallback_text: '오답 노트는 처음엔 빈 리스트예요. 틀릴 때마다 append 로 문제를 더하고, 마지막에 for 로 하나씩 보여 줘요. 등급은 큰 점수부터 차례로 if, elif, else 로 견줘요. 다 만들면 갤러리에 퀴즈쇼를 걸 수 있어요!'
    answer:
      validation:
        type: code_check
        expected: 'wrong.append('
      scenarios:
        - name: 세 번 틀린 손님
          inputs: ['몰라', '몰라', '몰라']
          expect:
            type: all
            rules:
              - { type: contains, expected: '오답 노트' }
              - { type: contains, expected: '다음엔 더 잘할 수 있어요' }
      hints:
        level_1: '틀린 문제를 모을 빈 리스트가 먼저 있어야 해요. 그리고 틀린 자리에서 하나씩 더해요.'
        level_2: 'hearts = 3 아래에 wrong = [] 을, else: 안에 wrong.append(card["q"]) 를 쓰고, 맨 아래에 등급 if/elif/else 와 오답 노트 for 를 써요.'
        level_3: |-
          if score >= 4:
              print("등급: 퀴즈 왕!")
          ___ score >= 2:
              print("등급: 퀴즈 박사!")
          else:
              print("등급: 퀴즈 새싹! 다음엔 더 잘할 수 있어요")
          print("오답 노트")
          for q in wrong:
              print("- " + q)
          빈칸에 "아니면 만약" 주문을 넣어 보세요!
      solution_code: |
        # 두근두근 퀴즈쇼
        bank = [
            {"q": "바다에서 가장 큰 동물은?", "a": "고래"},
            {"q": "무지개는 몇 가지 색일까요?", "a": "7"},
            {"q": "다리가 8개인 바다 동물은?", "a": "문어"},
            {"q": "한 바퀴는 몇 도일까요?", "a": "360"},
            {"q": "파이썬 섬에서 만난 튜터 뱀의 이름은?", "a": "파이뱀"},
        ]

        print("두근두근 퀴즈쇼에 오신 것을 환영해요!")
        print(f"오늘의 문제 {len(bank)}개")

        # 2단계: 문제를 차례로 내요
        import random
        random.shuffle(bank)
        hearts = 3
        wrong = []
        score = 0
        for card in bank:
            answer = input(card["q"] + " ").strip()
            if answer == card["a"]:
                print("딩동댕!")
                score = score + 1
            else:
                print("땡! 정답은 " + card["a"])
                wrong.append(card["q"])
                hearts = hearts - 1
                print(f"남은 하트: {hearts}")
                if hearts == 0:
                    print("게임 오버!")
                    break

        print(f"점수: {score}")

        # 5단계: 등급과 오답 노트
        if score >= 4:
            print("등급: 퀴즈 왕!")
        elif score >= 2:
            print("등급: 퀴즈 박사!")
        else:
            print("등급: 퀴즈 새싹! 다음엔 더 잘할 수 있어요")

        print("오답 노트")
        for q in wrong:
            print("- " + q)
