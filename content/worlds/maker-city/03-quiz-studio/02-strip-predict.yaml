  fallback_text: .strip() 은 글자 앞과 뒤에 붙은 빈칸을 모두 지워요. 글자 사이의 빈칸은 그대로 둬요. 대괄호 [ ] 는 빈칸이 남았는지 잘 보이게 하려고 붙인 거예요.
