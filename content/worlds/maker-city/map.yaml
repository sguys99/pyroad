bgm: world3
path: catmull_rom
# 앰비언트 (P5-09, full에서만 움직임): 도시라 나뭇잎 없이 구름·반짝임만. 톱니(cog)·열기구(balloon)·배·물결·새는 장식이 움직이고 집·가로등·나무는 정지
