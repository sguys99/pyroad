# 월드 3 지도 설정 (P11-11). 작성법: content/README.md "map.yaml"
# 그림책 3권 "메이커 시티": 설계도 모눈종이 위 도시(THEME_BASE maker_city — 거리 사이 블록·공원 + 왼쪽 아래 항구 + 설계 도구 표장, 노드마다 돌 광장)
# 2월드 배에서 내린 항구(왼쪽 아래)에서 출발해 골목을 지그재그로 오르고, 오른쪽 박람회장으로 내려오는 길
