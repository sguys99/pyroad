# 3월드 퀘스트 1-3: 도형 요술 함수
# 작성 안내: content/README.md · 설계: docs/curriculum/world3.md §4 3-1
# 함수는 학생이 직접 만듦 (시작 코드에 def 가 없어 code_check def polygon( 이 새로 쓴 글자, L4)

id: b3000000-0000-0000-0000-000000000003
order: 3
title: 도형 요술 함수
concept: def 와 매개변수로 정다각형
xp_reward: 100
quest_type: code
prompt:
  topic: 변의 수와 길이를 받는 polygon 함수 만들기
  learning_goals:
    - 'def polygon(n, size): 로 정다각형을 그리는 함수를 만들 수 있다'
    - 매개변수만 바꿔 삼각형, 오각형, 육각형을 그릴 수 있다
  story_context: 느릿이가 도형마다 명령을 새로 쓰기 힘들대요. 파이뱀이 요술 주문을 알려 줬어요. "변의 수와 길이만 알려 주면 어떤 도형이든 그리는 함수를 만들어 봐!"
  exercise_description: 'def polygon(n, size): 함수를 만들어 변이 n개, 한 변이 size인 정다각형을 그리세요. 아래 시작 코드가 함수를 불러 삼각형, 오각형, 육각형을 나란히 그려요'
  starter_code: |
    import turtle

    t = turtle.Turtle()

    # 여기에 def polygon(n, size): 를 만들어요
    #   for 로 n번: 앞으로 size 만큼 가고, 왼쪽으로 360 / n 도 돌아요



    # 아래는 그대로 두어요: 왼쪽으로 옮긴 뒤 도형 세 개를 나란히 그려요
    t.penup()
    t.back(150)
    t.pendown()
    polygon(3, 60)

    t.penup()
    t.forward(120)
    t.pendown()
    polygon(5, 50)

    t.penup()
    t.forward(120)
    t.pendown()
    polygon(6, 40)
  expected_output_hint: 그림판에 삼각형, 오각형, 육각형이 나란히 그려져야 해요
  checklist:
    - 'def polygon(n, size): 를 맨 위쪽에 만들어요'
    - 함수 안에서 for 로 n 번 forward(size) 와 left(360 / n) 을 해요
    - 도형 세 개가 모두 닫혀 있는지 그림판을 봐요
  example_output: (그림판에 정삼각형, 정오각형, 정육각형이 나란히)
  fallback_text: '함수는 자주 쓰는 명령을 묶어 이름을 붙인 거예요. def polygon(n, size): 아래에 for i in range(n): 를 쓰고, 그 안에 t.forward(size) 와 t.left(360 / n) 을 넣어요. n 에 3을 넣으면 삼각형, 5를 넣으면 오각형이 돼요. 함수는 부르는 줄보다 위에 있어야 해요.'
answer:
  validation:
    type: all
    rules:
      - { type: shape, shape: regular, n: 3 }
      - { type: shape, shape: regular, n: 5 }
      - { type: shape, shape: regular, n: 6 }
      - type: code_check
        expected: def polygon(
  hints:
    level_1: 첫 번째 네모에서 쓴 반복을 함수 안에 넣는데, 4 대신 n, 100 대신 size, 90 대신 360 / n 을 써요.
    level_2: 'def polygon(n, size): 다음 줄에 for i in range(n): 을 들여 쓰고, 그 안에 두 줄을 한 번 더 들여 써요.'
    level_3: |-
      def polygon(n, size):
          for i in range(___):
              t.forward(___)
              t.left(360 / n)
      빈칸에 매개변수 이름을 넣어 보세요!
  solution_code: |
    import turtle

    t = turtle.Turtle()

    def polygon(n, size):
        for i in range(n):
            t.forward(size)
            t.left(360 / n)

    t.penup()
    t.back(150)
    t.pendown()
    polygon(3, 60)

    t.penup()
    t.forward(120)
    t.pendown()
    polygon(5, 50)

    t.penup()
    t.forward(120)
    t.pendown()
    polygon(6, 40)
