  learning_goals:
    - 함수 안, 반복 안에 들어가는 줄의 들여쓰기를 고를 수 있다
    - 함수는 부르기 전에 만들어 둬야 한다는 것을 안다
  story_context: 물감 범벅 버그버그가 도형 요술 함수의 줄을 뒤섞어 놨어요! 느릿이가 삼각형을 그리고 나면 어느 쪽을 보고 있을지도 같이 알아봐요.
  fallback_text: 거북이를 먼저 불러 만들고, 함수는 부르는 줄보다 위에 둬요. def 줄 아래의 for 는 한 칸, for 아래의 두 명령은 두 칸 들여 써요. 도형을 다 그리면 거북이는 한 바퀴를 돌아 처음 방향을 봐요.
