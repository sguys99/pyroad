# 3월드 퀴즈 1-2: 몇 도 돌까? (출력 예측형 객관식)
# 작성 안내: content/README.md "퀴즈". 공개 부분(prompt)에 정답을 쓰지 마세요
# 각도는 초등 4학년 1학기 수학 → "한 바퀴 = 360"을 이야기로 먼저 (world3.md §2)

id: b3000000-0000-0000-0000-000000000002
order: 2
title: 몇 도 돌까?
concept: 한 바퀴 360도
xp_reward: 30
quest_type: quiz
quiz_kind: multiple_choice
prompt:
  topic: 정다각형을 그릴 때 한 번에 도는 각도
  learning_goals:
    - 거북이가 도형을 다 그리면 한 바퀴(360도)를 돈다는 것을 안다
    - 한 번에 도는 각도를 360 ÷ 변의 수로 구할 수 있다
  story_context: 느릿이가 오각형 별자리 벽화를 그리고 싶대요. 그런데 꼭짓점마다 몇 도씩 돌아야 할지 몰라 머리를 긁적이고 있어요. 도형을 한 번 다 그리고 나면 거북이는 꼭 제자리에서 한 바퀴를 돈 셈이에요!
  fallback_text: 거북이가 도형을 다 그리고 처음 자리로 돌아오면 모두 합쳐 한 바퀴, 360도를 돌아요. 꼭짓점마다 똑같이 나눠 돌면 되니까 360을 변의 수로 나눠요. 나누기 / 는 소수점이 있는 수로 답해요.
  quiz:
    question: 정오각형을 그릴 때 꼭짓점마다 도는 각도예요. 돌리면 무엇이 나올까?
    code: |-
      n = 5
      print(360 / n)
    options:
      - { id: opt-ix15, text: '72.0' }
      - { id: opt-3lev, text: '60.0' }
      - { id: opt-ez7g, text: '90.0' }
      - { id: opt-5kvu, text: '108.0' }
answer:
  quiz_answer:
    accepted: [opt-ix15]
    explanation: 360을 5로 나누면 72예요. 나누기 / 는 소수점이 붙어서 72.0 으로 나와요. 꼭짓점마다 72도씩 다섯 번 돌면 딱 한 바퀴!
    explanations:
      opt-3lev: 60도씩은 육각형이에요. 360 ÷ 6 = 60.
      opt-ez7g: 90도씩은 네모예요. 360 ÷ 4 = 90.
      opt-5kvu: 108은 오각형 안쪽 모서리의 각도예요. 거북이가 도는 각도는 바깥쪽이라 360 ÷ 5 예요.
