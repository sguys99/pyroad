        t.goto(-300, -100)
        t.pendown()

        t.fillcolor("green")
        t.begin_fill()
        for i in range(2):
            t.forward(600)
            t.right(90)
            t.forward(200)
            t.right(90)
        t.end_fill()

        # 2단계: 집 두 채
        def polygon(n, size):
            for i in range(n):
                t.forward(size)
                t.left(360 / n)

        def house(x, y):
            t.penup()
            t.goto(x, y)
            t.pendown()
            polygon(4, 80)
            t.penup()
            t.goto(x, y + 80)
            t.pendown()
            polygon(3, 80)

        house(-250, -100)
        house(-100, -100)

        # 3단계: 해님
        t.penup()
        t.goto(200, 150)
        t.pendown()
        t.color("orange")
        t.circle(30)

        t.penup()
        t.goto(200, 180)
        t.pendown()
        for i in range(12):
            t.forward(60)
            t.back(60)
            t.left(30)

        # 4단계: 꽃밭
        def flower(x, y, color):
            t.penup()
            t.goto(x, y)
            t.pendown()
            t.color(color)
            for i in range(6):
                t.circle(15)
                t.left(60)

        colors = ["red", "pink", "purple", "white", "yellow"]
        for i in range(5):
            flower(-250 + i * 120, -200, colors[i])

        # 5단계: 작품 이름표
        turtle.title("우리 거북이 마을")
        t.penup()
        t.goto(-280, -280)
        t.color("black")
        t.write("그린이 별똥별", font=("Arial", 16, "normal"))
