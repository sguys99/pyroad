      solution_code: |
        # 나의 가상 펫
        class Pet:
            def __init__(self, name):
                self.name = name
                self.hunger = 50   # 배고픔 (0~100)
                self.mood = 50     # 기분 (0~100)

            def status(self):
                print(f"{self.name}의 상태")
                print(f"배고픔 {self.hunger} " + "#" * (self.hunger // 10))
                print(f"기분 {self.mood} " + "#" * (self.mood // 10))

            def feed(self):
                self.hunger = max(0, self.hunger - 30)
                print(f"{self.name}: 냠냠! 맛있어요")

            def play(self):
                self.mood = min(100, self.mood + 20)
                self.hunger = min(100, self.hunger + 10)
                print(f"{self.name}: 신나요!")

            def sleep(self):
                self.mood = min(100, self.mood + 10)
                print(f"{self.name}: 쿨쿨, 잘 잤어요")

            # (4단계) 여기에 tick 메서드를 만들어요


        # 펫 이름을 입력받아 펫을 만들고 상태를 보여 줘요
        name = input("펫 이름은? ")
        pet = Pet(name)
        pet.status()

        # 3단계: 돌봄 메뉴
        # (5단계) 여기서 반복을 5일로 바꿔요
        while True:
            choice = input("1 밥, 2 놀기, 3 잠, 0 끝: ")
            if choice == "1":
                pet.feed()
            elif choice == "2":
                pet.play()
            elif choice == "3":
                pet.sleep()
            elif choice == "0":
                print(f"잘 가, {pet.name}!")
                break
            # (4단계) 여기서 시간이 흘러요
            pet.status()
