# 3월드 퀘스트 4-1: 펫 상태 카드
# 작성 안내: content/README.md · 설계: docs/curriculum/world3.md §4 3-4
# 막대는 # 로 (■ 는 글꼴마다 폭이 달라요, P0-14). 막대 글자를 그대로 print 하면 code_check "// 10" 에서 떨어짐

id: b3000000-0000-0000-0000-000000000021
order: 1
title: 펫 상태 카드
concept: 딕셔너리 상태와 막대
xp_reward: 100
quest_type: code
prompt:
  topic: 딕셔너리로 펫 상태를 적고 막대로 보여 주기
  learning_goals:
    - 딕셔너리에 펫의 이름, 배고픔, 기분을 담을 수 있다
    - '"#" * (값 // 10) 으로 값만큼 막대를 만들 수 있다'
  story_context: 가상 펫 돌봄 센터에 아기 강아지 콩이가 왔어요! 그런데 콩이가 배고픈지, 기분이 좋은지 한눈에 볼 수가 없대요. 콩이의 상태 카드를 만들어 줘요.
  exercise_description: 'pet 딕셔너리의 배고픔과 기분을 "#" * (값 // 10) 막대로 "배고픔: ######" 처럼 출력하세요'
  starter_code: |
    pet = {"이름": "콩이", "배고픔": 60, "기분": 40}

    print("이름: " + pet["이름"])
    # 배고픔 60 이면 # 6개, 기분 40 이면 # 4개예요
    # "#" * (값 // 10) 으로 막대를 만들어 "배고픔: ######" 과 "기분: ####" 를 출력해요
  expected_output_hint: 이름, 배고픔 막대, 기분 막대가 한 줄씩 나와야 해요
  checklist:
    - pet["배고픔"] 으로 배고픔 값을 꺼내요
    - '"#" * (값 // 10) 으로 막대를 만들어요'
    - 배고픔과 기분을 한 줄씩 출력해요
  example_output: |-
    이름: 콩이
    배고픔: ######
    기분: ####
  fallback_text: '// 는 나눈 몫만 남기는 나눗셈이에요. 60 // 10 은 6이에요. 글자에 숫자를 곱하면 그 글자가 그만큼 이어져요. "#" * 6 은 ######! 그래서 "#" * (pet["배고픔"] // 10) 처럼 쓰면 값에 맞는 막대가 생겨요.'
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |-
          이름: 콩이
          배고픔: ######
          기분: ####
      - type: code_check
        expected: // 10
  hints:
    level_1: 값을 10으로 나눈 몫만큼 # 를 이어 붙이면 막대가 돼요.
    level_2: 'print("배고픔: " + "#" * (pet["배고픔"] // 10)) 처럼 써요. 기분도 똑같이!'
    level_3: |-
      print("배고픔: " + "#" * (pet["배고픔"] ___ 10))
      print("기분: " + "#" * (pet["기분"] ___ 10))
      빈칸에 몫만 남기는 나눗셈 기호를 넣어 보세요!
  solution_code: |
    pet = {"이름": "콩이", "배고픔": 60, "기분": 40}

    print("이름: " + pet["이름"])
    print("배고픔: " + "#" * (pet["배고픔"] // 10))
    print("기분: " + "#" * (pet["기분"] // 10))
