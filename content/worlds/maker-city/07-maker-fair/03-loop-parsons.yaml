prompt:
  topic: 키를 하나씩 읽어 거북이를 움직이는 반복의 줄 순서와 들여쓰기
  learning_goals:
    - 반복 안의 if·elif 와 그 안의 명령 들여쓰기를 고를 수 있다
    - 반복이 끝난 뒤 한 번만 할 일은 들여 쓰지 않는다는 것을 안다
  story_context: 박람회 오락실 부스의 게임기가 고장 났어요! 버그버그가 느릿이를 움직이는 주문 줄을 뒤섞어 놨대요.
  fallback_text: 거북이를 먼저 만들고, 키를 하나씩 도는 for 를 써요. for 안의 if·elif 는 한 칸, 그 안의 움직이는 명령은 두 칸 들여 써요. 위치는 다 움직인 뒤 한 번만 보여 줘요.
  quiz:
    question: 줄을 순서대로 놓고 들여쓰기도 맞춰, 키를 다 누른 뒤 느릿이의 위치를 한 번 보여 줘요
    indent: true
    lines:
      - { id: ln-m4qa, code: import turtle }
      - { id: ln-9zrk, code: t = turtle.Turtle() }
      - { id: ln-c2vw, code: 'for key in ["Right", "Right", "Up"]:' }
      - { id: ln-h7eb, code: 'if key == "Right":' }
      - { id: ln-x5pd, code: t.setx(t.xcor() + 10) }
      - { id: ln-0gun, code: 'elif key == "Up":' }
      - { id: ln-t8yf, code: t.sety(t.ycor() + 10) }
      - { id: ln-w1js, code: print(t.position()) }
