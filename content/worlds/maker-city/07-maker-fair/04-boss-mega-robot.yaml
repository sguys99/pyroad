          - { id: ln-j2dv, code: '        self.mood = 50' }
          - { id: ln-f5kx, code: '    def play(self):' }
          - { id: ln-0rcz, code: '        self.mood = self.mood + 30' }
          - { id: ln-u9ty, code: 'answer = "2"  # 2를 입력했다고 해요' }
          - { id: ln-g3pl, code: 'pet = Pet("별이")' }
