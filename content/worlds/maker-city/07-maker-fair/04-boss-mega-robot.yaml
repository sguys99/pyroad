  - quiz_kind: bug_hunt
    review_quest: b3000000-0000-0000-0000-000000000027
    prompt:
      quiz:
        question: 손님이 2를 입력해서 별이와 두 번 놀아 주려는데 에러가 나요. 틀린 줄을 찾아 고쳐요
        lines:
