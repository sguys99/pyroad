          - { id: ln-y1eo, code: '    pet.play()' }
          - { id: ln-q5bj, code: 'if pet.mood >= 100:' }
          - { id: ln-c8hn, code: '    print(f"{pet.name}: 최고로 신나요!")' }
          - { id: ln-t0vk, code: 'else:' }
