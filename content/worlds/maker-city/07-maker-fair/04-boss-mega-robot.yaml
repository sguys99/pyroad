          print(statistics.mean(votes))
        options:
          - { id: opt-n3dk, text: '4' }
          - { id: opt-9wsa, text: '12' }
          - { id: opt-c6ge, text: '5' }
          - { id: opt-y2rb, text: '3' }
    answer:
      quiz_answer:
        accepted: [opt-n3dk]
        explanation: 평균은 모두 더해 똑같이 나눈 값이에요. 3 + 5 + 4 = 12 를 3 으로 나누면 4 예요.
        explanations:
          opt-9wsa: 12 는 모두 더한 합이에요. 세 반이니까 3 으로 나눠요.
          opt-c6ge: 5 는 가장 큰 값이에요.
          opt-y2rb: 3 은 가장 작은 값이에요.
