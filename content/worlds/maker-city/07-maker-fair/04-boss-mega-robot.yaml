        accepted:
          - { line: ln-6mwa, fix: fx-n6xe }
        explanation: answer 는 글자 "2" 라서 range 에 바로 넣으면 TypeError 예요. int(answer) 로 숫자 2 로 바꾸면 두 번 놀아 기분이 110 이 되고 "최고로 신나요!" 가 나와요.
        explanations:
          fx-b2qr: 글자 "2" 를 돌면 한 글자뿐이라 한 번만 놀아요. 기분이 80 에서 멈춰요.
          fx-h4wd: 따옴표를 붙여도 여전히 글자라서 range 에 넣을 수 없어요.
