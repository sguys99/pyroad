      starter_code: |

        # ── 3단계: 기능 더하기 ──
        # 기획 카드의 2번, 3번 기능을 더해요
        # 함수(def)를 하나 만들어 부르고, 조건(if)도 하나 꼭 써 봐요
      fallback_text: '함수는 여러 번 쓸 기능에 이름을 붙여 두는 거예요. 별 그리기, 장면 보여 주기, 점수 더하기처럼요. 조건은 "이럴 때는 이렇게"예요. 높은 별은 크게, 정답이면 칭찬, 벽에 닿으면 멈추기처럼 내 작품에 맞게 써 봐요.'
    answer:
