  - step_number: 3
    prompt:
      step_goal: '기능 더하기: 남은 기능을 만들며 함수(def)와 조건(if)을 하나씩 꼭 쓰기'
      checklist:
        - 'def 로 기능 하나를 함수로 만들고 불러요'
        - 'if 로 상황에 따라 다르게 해요'
