          - { type: code_check, expected: 'if ', whole_word: true }
      hints:
        level_1: '함수 하나와 조건 하나를 내 작품에 맞게 더해요. 무엇을 해도 괜찮아요!'
        level_2: 'def 이름(값): 아래에 들여 써서 기능을 만들고, 맨 아래에서 이름(값) 으로 불러요. 그리고 if 조건: 으로 상황에 따라 다르게 해요.'
        level_3: |-
          def star(x, y, size):
              ___
          for p in points:
              if p[1] > 100:
                  star(p[0], p[1], 20)
          빈칸에 별을 그리는 주문을 넣어 보세요! (그림 작품일 때)
      solution_code: |
        # 나만의 작품 기획 카드
        title = "반짝반짝 별자리"
        kind = "그림"
        features = ["밤하늘에 별자리 선 긋기", "크기가 다른 별 찍기", "별자리 이름 쓰기"]

        print("작품:", title)
        print("종류:", kind)
        print("만들 기능")
        for i in range(len(features)):
            print(f"{i + 1}. {features[i]}")

        # ── 2단계: 첫 기능 ──
        import turtle

        screen = turtle.Screen()
        screen.bgcolor("midnightblue")
        t = turtle.Turtle()
        t.color("gold")
        t.pensize(2)

        # 별자리 점 11개를 차례로 이어요
        points = [(-220, 40), (-170, 110), (-110, 70), (-60, 140), (0, 90), (50, 150), (100, 80), (150, 130), (190, 60), (230, 120), (250, 30)]
        t.penup()
        t.goto(points[0])
        t.pendown()
        for p in points:
            t.goto(p)

        # ── 3단계: 기능 더하기 ──
        def star(x, y, size):
            t.penup()
            t.goto(x - size / 2, y)
            t.pendown()
            t.begin_fill()
            for i in range(5):
                t.forward(size)
                t.right(144)
            t.end_fill()

        for p in points:
            if p[1] > 100:
                star(p[0], p[1], 20)   # 높이 있는 별은 크게
            else:
                star(p[0], p[1], 10)

        t.penup()
        t.goto(-90, -150)
        t.write(title, font=("Arial", 20, "bold"))
