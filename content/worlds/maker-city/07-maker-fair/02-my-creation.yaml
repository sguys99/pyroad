# 3월드 프로젝트 F-2: 나만의 작품 (4단계, 자유 — world3.md §4 3-F, 제안 H·I)
# 작성 안내: content/README.md "프로젝트 퀘스트" · 설계: docs/curriculum/world3.md §4 3-F·§8
# 그림·이야기·퀴즈·펫·게임 무엇이든 만드는 자유 작품이라 품질은 채점하지 않고 "개념 표지 + any + 끝 줄"만 봄 (world3.md §10)
#   1단계 기획 카드(출력 "작품:"·"만들 기능") → 2단계 하나[선분 ≥10 · input( · get_key(] → 3단계 def + if → 4단계 credits()
# 시험 손님이 없음: 아이마다 입력 수가 달라 손님을 정할 수 없음 → "코드 돌려보기" 한 번이 채점(입력은 직접, 게임은 직접 플레이)
# 정답(solution_code)은 예시 작품 하나 "반짝반짝 별자리"(그림). 이야기형·게임형 다른 정답은 gradingVariants 에
# 시작 코드의 빈칸 ___ 은 따옴표 밖이라 안 채우면 NameError → 시작 코드 불합격 (§10 ③)
# 기획 도우미(project_planner)·작품 평가 친구(creation_feedback)는 화면(MakerHelper)이 이 퀘스트에서 부름 (P11-14)
# 마지막 단계를 끝낸 완성 작품만 갤러리에 출품 (publishableQuests: 3월드 project 완료)

