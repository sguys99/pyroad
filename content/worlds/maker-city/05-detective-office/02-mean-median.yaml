  starter_code: |
    import statistics

    jumps = [35, 42, 28, 50, 42, 31, 46]   # 동물 친구 7명의 줄넘기 기록

    # 1) 직접 구하기: 모두 더해(sum) 사람 수(len)로 똑같이 나누고 소수 첫째 자리까지 반올림해요
    my_avg = round(___ / len(jumps), 1)
    print(f"직접 구한 평균: {my_avg}")

    # 2) statistics.mean( ) 으로 평균을 구하고 round( , 1) 로 반올림해 "statistics 평균: ..." 을 출력해요

    # 3) 두 평균이 같은지 == 로 견줘 "같아요? ..." 를 출력해요

