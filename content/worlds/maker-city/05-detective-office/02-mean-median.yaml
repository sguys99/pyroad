  hints:
    level_1: 빈칸에는 기록을 모두 더한 값이 들어가요. 그다음 statistics 도구로 한 번 더 구해 견줘요.
    level_2: 'sum(jumps) 를 빈칸에 넣고, stat_avg = round(statistics.mean(jumps), 1), print(f"같아요? {my_avg == stat_avg}"), print(f"가운데 값: {statistics.median(jumps)}") 을 써요.'
    level_3: |-
      my_avg = round(sum(jumps) / len(jumps), 1)
      stat_avg = round(statistics.mean(jumps), 1)
      print(f"statistics 평균: {stat_avg}")
      print(f"같아요? {my_avg == stat_avg}")
      print(f"가운데 값: {statistics.___(jumps)}")
      빈칸에 "가운데" 라는 뜻의 영어 낱말을 넣어 보세요!
  solution_code: |
    import statistics

    jumps = [35, 42, 28, 50, 42, 31, 46]   # 동물 친구 7명의 줄넘기 기록

    my_avg = round(sum(jumps) / len(jumps), 1)
    print(f"직접 구한 평균: {my_avg}")

    stat_avg = round(statistics.mean(jumps), 1)
    print(f"statistics 평균: {stat_avg}")

    print(f"같아요? {my_avg == stat_avg}")

    print(f"가운데 값: {statistics.median(jumps)}")
