  fallback_text: '평균은 모두 더한 다음 사람 수로 똑같이 나눈 값이에요. 7명의 기록을 더하면 274, 7로 나누면 39.14… 라서 round( , 1) 로 39.1 로 만들어요. 가운데 값은 기록을 작은 것부터 줄 세웠을 때 한가운데(4번째) 친구의 기록이에요. statistics 가 대신 줄을 세워 찾아 줘요.'
