  solution_code: |
    import turtle

    t = turtle.Turtle()
    t.speed(0)

    def draw_bar(x, height, color, label):
        t.penup()
        t.goto(x, -100)
        t.pendown()
        t.fillcolor(color)
        t.begin_fill()
        for i in range(2):
            t.forward(60)
            t.left(90)
            t.forward(height)
            t.left(90)
        t.end_fill()
        t.penup()
        t.goto(x + 15, -125)
        t.write(label, font=("Arial", 12, "normal"))

    draw_bar(-100, 140, "red", "딸기")
    draw_bar(0, 100, "green", "사과")
