# 2월드 퀘스트 1-10: 비밀 암호 만들기 (챌린지)
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-1 (제안 B: ord/chr 없이 index + % 26)

id: b2000000-0000-0000-0000-000000000010
order: 10
title: 비밀 암호 만들기
concept: index(), % 돌아가기
xp_reward: 120
quest_type: code
prompt:
  topic: 글자를 세 칸씩 밀어 암호 만들기
  learning_goals:
    - index()로 글자의 자리 번호를 찾을 수 있다
    - '% 26으로 z 다음에 다시 a로 돌아오게 할 수 있다'
    - 반복하며 새 글자를 한 글자씩 붙여 만들 수 있다
  story_context: 공방 주인이 버그버그 몰래 비밀 쪽지를 보내고 싶대요. 알파벳을 세 칸씩 밀면 아무도 못 읽는 암호가 돼요! python 을 암호로 바꿔 볼까요?
  exercise_description: 'word = "python" 의 글자마다 abc.index()로 번호를 찾고, 3칸 민 번호를 % 26으로 돌려 새 글자를 붙여 "암호: sbwkrq"를 출력하세요'
  starter_code: |
    abc = "abcdefghijklmnopqrstuvwxyz"
    word = "python"
    secret = ""

    for ch in word:
        num = abc.index(ch)    # 이 글자가 abc 에서 몇 번인지 찾아요
        # 3칸 밀어요. z 를 넘어가면 % 26 으로 a 쪽으로 돌아와요
        new_num = ___
        secret = secret + abc[new_num]

    print(f"암호: {secret}")
  expected_output_hint: '암호: sbwkrq 가 나와야 해요'
  checklist:
    - 'new_num 에 num 보다 3 큰 수를 넣어요'
    - '% 26 으로 z 다음은 a 로 돌아오게 해요'
    - 'y 가 b 로 바뀌었는지 봐요'
  example_output: |-
    암호: sbwkrq
  fallback_text: 'p는 15번이라 3칸 밀면 18번 s가 돼요. 그런데 y는 24번이라 3칸 밀면 27번, abc에 없는 번호예요! (24 + 3) % 26 은 1이라서 b로 돌아와요. 시계가 12 다음에 1로 돌아오는 것과 같아요.'
  is_challenge: true
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: '암호: sbwkrq'
      - type: code_check
        expected: '% 26'
  hints:
    level_1: 3칸 미는 건 번호에 3을 더하는 거예요. 그런데 y나 z에 3을 더하면 어떻게 될까요?
    level_2: 'abc 는 26글자라 번호는 0~25 예요. 나머지 % 26 을 쓰면 26은 0, 27은 1로 돌아와요.'
    level_3: 'new_num = (num + 3) % 26 을 써 보세요!'
  solution_code: |
    abc = "abcdefghijklmnopqrstuvwxyz"
    word = "python"
    secret = ""

    for ch in word:
        num = abc.index(ch)
        new_num = (num + 3) % 26
        secret = secret + abc[new_num]

    print(f"암호: {secret}")
