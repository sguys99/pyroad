# 2월드 퀘스트 3-7: X 표시를 찾아라
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-3

id: b2000000-0000-0000-0000-000000000025
order: 7
title: X 표시를 찾아라
concept: 좌표 찾기, range(len())
xp_reward: 90
quest_type: code
prompt:
  topic: 줄 번호와 칸 번호로 격자 돌기
  learning_goals:
    - range(len(grid))로 줄 번호를 돌 수 있다
    - 줄 번호와 칸 번호(좌표)로 원하는 칸을 찾을 수 있다
  story_context: 새 지도에서 X 표시가 어디 있는지 파이뱀이 궁금해해요. 칸을 하나씩 열어 보다가 X 를 만나면 몇째 줄 몇째 칸인지 알려 줘요!
  exercise_description: 'for r in range(len(grid)): 와 for c in range(len(grid[r])): 로 모든 칸을 돌다가 칸이 "X" 이면 "보물은 1줄 2칸"처럼 출력하세요 (번호는 0부터)'
  starter_code: |
    grid = [
        [".", ".", ".", "."],
        [".", "#", "X", "."],
        ["#", ".", ".", "."],
    ]

    # 줄 번호 r 와 칸 번호 c 로 모든 칸을 돌아요 (0부터)
    for r in range(___):
        for c in range(___):
            # grid[r][c] 가 "X" 이면 f"보물은 {r}줄 {c}칸" 을 보여 줘요
            ___
  expected_output_hint: 보물은 1줄 2칸 이 나와야 해요
  checklist:
    - '바깥 빈칸은 len(grid), 안쪽 빈칸은 len(grid[r]) 예요'
    - 'if grid[r][c] == "X": 로 물어봐요'
    - 보물은 1줄 2칸 이 나오는지 봐요
  example_output: |-
    보물은 1줄 2칸
  fallback_text: 'range(len(grid))는 줄 번호 0, 1, 2 를 차례로 줘요. 그 안에서 range(len(grid[r]))로 칸 번호를 돌면, grid[r][c]로 모든 칸을 하나씩 볼 수 있어요.'
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: 보물은 1줄 2칸
      - type: code_check
        expected: range(len(
  hints:
    level_1: 칸 자체가 아니라 번호가 필요해요. 번호를 차례로 만드는 주문 range 안에 무엇을 넣을까요?
    level_2: '줄 수는 len(grid), r 번 줄의 칸 수는 len(grid[r]) 예요. 칸이 X 인지는 if grid[r][c] == "X": 로 물어요.'
    level_3: |-
      빈칸에 len(grid) 와 len(grid[r]) 를 넣고, 마지막 ___ 을 이렇게 바꿔 보세요!
      if grid[r][c] == "X":
          print(f"보물은 {r}줄 {c}칸")
  solution_code: |
    grid = [
        [".", ".", ".", "."],
        [".", "#", "X", "."],
        ["#", ".", ".", "."],
    ]

    for r in range(len(grid)):
        for c in range(len(grid[r])):
            if grid[r][c] == "X":
                print(f"보물은 {r}줄 {c}칸")
