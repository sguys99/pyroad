# 2월드 퀘스트 3-9: 다이아몬드 무늬 (챌린지)
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-3
# 첫 줄 앞 공백은 전체 앞 공백이라 output_match 가 무시하지만, 나머지 줄이 모두 맞아야 함 (§10)

id: b2000000-0000-0000-0000-000000000027
order: 9
title: 다이아몬드 무늬
concept: 반복으로 무늬 만들기
xp_reward: 120
quest_type: code
prompt:
  topic: 공백과 별로 다이아몬드 무늬 만들기
  learning_goals:
    - 줄 번호에 따라 공백 수와 별 수가 바뀌는 규칙을 찾을 수 있다
    - 반복을 두 번 써서 늘어나는 무늬와 줄어드는 무늬를 만들 수 있다
  story_context: 미로 맨 끝 문에 다이아몬드 자물쇠가 있어요! 별로 다이아몬드 무늬를 그리면 문이 열리고 별똥이가 보물을 떨어뜨려 준대요.
  exercise_description: '공백과 별로 5줄 다이아몬드(위 3줄은 별 1, 3, 5개, 아래 2줄은 별 3, 1개)를 반복문으로 출력하세요'
  starter_code: |
    # 다이아몬드 무늬를 만들어요 (위 3줄, 아래 2줄)
    #   *
    #  ***
    # *****
    #  ***
    #   *

    # 위쪽 3줄: 줄마다 앞 공백은 하나씩 줄고, 별은 2개씩 늘어요
    # 빈칸에 식을 넣을 때는 괄호 ( ) 안에 넣어야 먼저 계산돼요
    for i in range(1, 4):
        print(" " * (___) + "*" * (___))

    # 아래쪽 2줄: 이번엔 반대로! 반복을 하나 더 써요
  expected_output_hint: 별이 1, 3, 5, 3, 1개인 다이아몬드 5줄이 나와야 해요
  checklist:
    - '위쪽 공백은 (3 - i) 칸, 별은 (2 * i - 1) 개예요. 식은 괄호로 묶어요'
    - '아래쪽은 i 가 2, 1 이 되는 반복을 하나 더 써요'
    - 별 줄 끝에 띄어쓰기를 붙이지 않아요
  example_output: |2-
      *
     ***
    *****
     ***
      *
  fallback_text: 'i 가 1, 2, 3 일 때 공백은 2, 1, 0 칸(3 - i), 별은 1, 3, 5 개(2 * i - 1)예요. 아래쪽은 같은 식에 i 를 2, 1 로 넣으면 돼요. for i in [2, 1]: 처럼 리스트를 돌아도 돼요.'
  is_challenge: true
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |2-
            *
           ***
          *****
           ***
            *
      # 답을 그대로 print 해도 통과하지 않게 (제안 F)
      - type: code_check
        expected: for
        whole_word: true
  hints:
    level_1: 줄 번호 i 가 1, 2, 3 일 때 공백과 별이 몇 개인지 표로 적어 보세요. 어떤 규칙이 보이나요?
    level_2: '공백은 3 - i, 별은 2 * i - 1 이에요. 아래쪽은 i 를 2, 1 로 거꾸로 돌리면 같은 식을 쓸 수 있어요.'
    level_3: |-
      위쪽 빈칸은 (3 - i) 와 (2 * i - 1) 이에요. 아래쪽은 이렇게 써 보세요!
      for i in [2, 1]:
          print(" " * (3 - i) + "*" * (2 * i - 1))
  solution_code: |
    for i in range(1, 4):
        print(" " * (3 - i) + "*" * (2 * i - 1))

    for i in [2, 1]:
        print(" " * (3 - i) + "*" * (2 * i - 1))
