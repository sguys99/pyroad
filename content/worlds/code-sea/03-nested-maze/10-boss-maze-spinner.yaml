# 2월드 보스 3: 소용돌이 버그버그 (P10-07)
# 작성 안내: content/README.md "보스". 라운드 하나 = 퀴즈 하나와 같은 규칙. 공개 부분(prompt)에 정답을 쓰지 마세요

id: b2000000-0000-0000-0000-000000000203
order: 10
title: 소용돌이 버그버그
concept: 중첩 반복 총정리
xp_reward: 60
quest_type: boss
prompt:
  topic: 중첩 반복 횟수, 2차원 리스트 번호, 격자 그리기 총정리
  learning_goals:
    - 반복 안의 반복이 몇 번, 어떤 모양으로 도는지 따라갈 수 있다
    - grid[줄][칸] 번호로 2차원 리스트의 값을 꺼낼 수 있다
    - 격자를 그리고 세는 코드를 알맞은 차례와 들여쓰기로 놓을 수 있다
  story_context: 미로 한가운데에서 물이 빙글빙글 돌기 시작했어요! 소용돌이 속에서 버그버그가 팽이처럼 돌며 나타났어요. 줄과 칸을 차근차근 따라가서 소용돌이를 멈춰 봐요!
  fallback_text: 바깥 반복이 한 번 돌 때마다 안쪽 반복은 처음부터 끝까지 다 돌아요. 2차원 리스트는 grid[줄][칸]으로 꺼내고, 줄과 칸 번호는 모두 0부터 세요. 한 줄을 다 모은 다음에 보여 줘요.
  boss:
    name: 소용돌이 버그버그
    look: maze
    intro: 빙글빙글~ 나는 소용돌이 버그버그! 줄과 칸을 뱅뱅 꼬아 놨지. 여섯 문제를 풀면 길을 열어 줄게!
    on_defeat: 어지러워라, 소용돌이가 멈췄어! 줄과 칸을 하나도 안 놓치다니 대단해. 다음 섬 놀이공원에는 무엇이 나올지 모르는 기구가 많대!
    on_victory: 빙글빙글, 아직 길을 잃었구나! 바깥 반복 한 번에 안쪽 반복이 다 돈다는 걸 떠올리고 다시 와!
rounds:
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000019
    prompt:
      quiz:
        question: 소용돌이 계단을 쌓아요. 돌리면 무엇이 나올까?
        code: |-
          for i in range(3):
              line = ""
              for j in range(i + 1):
                  line = line + "#"
              print(line)
        options:
          - { id: opt-k2hy, text: "#\n##\n###" }
          - { id: opt-w8ra, text: "###\n###\n###" }
          - { id: opt-c5nf, text: "##\n###\n####" }
          - { id: opt-u3dm, text: '######' }
    answer:
      quiz_answer:
        accepted: [opt-k2hy]
        explanation: 바깥 반복의 i 가 0, 1, 2 로 바뀌고, 안쪽은 i + 1 번 돌아요. 그래서 1개, 2개, 3개짜리 줄이 차례로 나와요.
        explanations:
          opt-w8ra: 안쪽 반복 횟수가 i 에 따라 달라져요. 매번 3번 도는 게 아니에요.
          opt-c5nf: i 는 0부터 시작해서 첫 줄은 0 + 1 로 한 칸이에요.
          opt-u3dm: 줄마다 바깥 반복 안에서 print 를 해서 세 줄로 나와요.
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000022
    prompt:
      quiz:
        question: 보물 지도에서 칸 하나와 크기를 꺼내요. 돌리면 무엇이 나올까?
        code: |-
          grid = [[".", "#", "."],
                  ["#", "X", "."]]
          print(grid[1][1], len(grid), len(grid[0]))
        options:
          - { id: opt-f7je, text: 'X 2 3' }
          - { id: opt-q4bs, text: '. 2 3' }
          - { id: opt-z9wc, text: 'X 3 2' }
          - { id: opt-a6pv, text: '# 3 2' }
    answer:
      quiz_answer:
        accepted: [opt-f7je]
        explanation: grid[1] 은 두 번째 줄이고, 그 줄의 1번은 두 번째 칸 X 예요. 줄은 2개, 첫 줄의 칸은 3개예요.
        explanations:
          opt-q4bs: 번호는 0부터 세요. 1번 줄 1번 칸은 맨 앞 칸이 아니에요.
          opt-z9wc: len(grid) 는 줄 수, len(grid[0]) 은 한 줄의 칸 수예요.
          opt-a6pv: 줄 수와 칸 수가 바뀌었어요. 1번 줄 1번 칸도 다시 세어 봐요.
  - quiz_kind: parsons
    review_quest: b2000000-0000-0000-0000-000000000019
    prompt:
      quiz:
        question: 줄을 순서대로 놓고 들여쓰기도 맞춰, 3줄 4칸 바닥 타일을 깔아요
        indent: true
        lines:
          - { id: ln-r7kb, code: 'for i in range(3):' }
          - { id: ln-h3xe, code: 'row = ""' }
          - { id: ln-p8sw, code: 'for j in range(4):' }
          - { id: ln-b5ma, code: 'row = row + "#"' }
          - { id: ln-e2qt, code: 'print(row)' }
    answer:
      quiz_answer:
        accepted:
          - - { id: ln-r7kb, indent: 0 }
            - { id: ln-h3xe, indent: 1 }
            - { id: ln-p8sw, indent: 1 }
            - { id: ln-b5ma, indent: 2 }
            - { id: ln-e2qt, indent: 1 }
        explanation: 줄마다 빈 글자로 새로 시작하고, 안쪽 반복에서 타일 4개를 붙여요. 안쪽이 끝나면 바깥 반복 안에서 한 줄을 보여 줘서 #### 가 세 줄 나와요.
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000025
    prompt:
      quiz:
        question: 소용돌이 속 보물을 찾아요. 돌리면 무엇이 나올까?
        code: |-
          grid = [[".", "."], [".", "X"]]
          for r in range(len(grid)):
              for c in range(len(grid[r])):
                  if grid[r][c] == "X":
                      print(f"보물은 {r}줄 {c}칸")
        options:
          - { id: opt-m6tg, text: '보물은 1줄 1칸' }
          - { id: opt-b2xk, text: '보물은 2줄 2칸' }
          - { id: opt-y5ol, text: '보물은 0줄 0칸' }
          - { id: opt-h9cd, text: '보물은 1줄 0칸' }
    answer:
      quiz_answer:
        accepted: [opt-m6tg]
        explanation: X 는 두 번째 줄의 두 번째 칸에 있어요. 번호는 0부터 세서 둘 다 1이에요.
        explanations:
          opt-b2xk: range(len(grid)) 는 0부터 세요. 두 번째 줄은 1번이에요.
          opt-y5ol: 0줄 0칸은 맨 앞 칸이에요. 거기에는 점이 있어요.
          opt-h9cd: 1번 줄의 0번 칸은 점이에요. X 는 그 옆 칸에 있어요.
  - quiz_kind: parsons
    review_quest: b2000000-0000-0000-0000-000000000025
    prompt:
      quiz:
        question: 줄을 순서대로 놓고 들여쓰기도 맞춰, 지도에 X 가 모두 몇 개인지 세어요
        indent: true
        lines:
          - { id: ln-s4fu, code: 'grid = [["X", "."], ["X", "X"]]' }
          - { id: ln-g9na, code: 'count = 0' }
          - { id: ln-c3wr, code: 'for row in grid:' }
          - { id: ln-x6dj, code: 'for cell in row:' }
          - { id: ln-k8pb, code: 'if cell == "X":' }
          - { id: ln-a4ze, code: 'count = count + 1' }
          - { id: ln-o7lh, code: 'print(count)' }
    answer:
      quiz_answer:
        accepted:
          - - { id: ln-s4fu, indent: 0 }
            - { id: ln-g9na, indent: 0 }
            - { id: ln-c3wr, indent: 0 }
            - { id: ln-x6dj, indent: 1 }
            - { id: ln-k8pb, indent: 2 }
            - { id: ln-a4ze, indent: 3 }
            - { id: ln-o7lh, indent: 0 }
          - - { id: ln-g9na, indent: 0 }
            - { id: ln-s4fu, indent: 0 }
            - { id: ln-c3wr, indent: 0 }
            - { id: ln-x6dj, indent: 1 }
            - { id: ln-k8pb, indent: 2 }
            - { id: ln-a4ze, indent: 3 }
            - { id: ln-o7lh, indent: 0 }
        explanation: 지도와 0에서 시작하는 수를 먼저 준비해요(어느 쪽이 먼저여도 괜찮아요). 줄마다, 칸마다 돌며 X 를 만나면 하나씩 더하고, 다 돈 뒤에 한 번만 보여 줘서 3이 나와요.
  - quiz_kind: bug_hunt
    review_quest: b2000000-0000-0000-0000-000000000027
    prompt:
      quiz:
        question: 별 피라미드 꼭대기에 별이 하나여야 하는데 두 개예요. 틀린 줄을 찾아 고쳐요
        lines:
          - { id: ln-d5vy, code: 'for i in range(1, 4):' }
          - { id: ln-t2mo, code: '    line = " " * (3 - i) + "*" * (2 * i)' }
          - { id: ln-n8gk, code: '    print(line)' }
        fixes:
          - {
              id: fx-q3wb,
              code: '    line = " " * (3 - i) + "*" * (2 * i - 1)',
            }
          - {
              id: fx-e7lx,
              code: '    line = " " * (3 - i) + "*" * (2 * i + 1)',
            }
          - { id: fx-v4hc, code: '    line = " " * (3 - i) + "*" * i' }
          - { id: fx-j9sa, code: '    line = " " * (4 - i) + "*" * (2 * i)' }
    answer:
      quiz_answer:
        accepted:
          - { line: ln-t2mo, fix: fx-q3wb }
        explanation: 피라미드는 별이 1개, 3개, 5개로 늘어나요. 2 * i 에서 1을 빼면 i 가 1, 2, 3 일 때 1, 3, 5 가 돼요.
        explanations:
          ln-d5vy: 세 줄을 그리는 반복은 맞아요.
          ln-n8gk: 만든 줄을 보여 주는 것은 맞아요. 줄을 만드는 곳을 살펴봐요.
          fx-e7lx: 1을 더하면 3개, 5개, 7개가 되어 꼭대기가 별 셋이에요.
          fx-v4hc: 별이 1개, 2개, 3개라 가운데가 맞지 않는 삼각형이 돼요.
          fx-j9sa: 앞 빈칸만 늘어나고 별은 여전히 2개, 4개, 6개예요.
