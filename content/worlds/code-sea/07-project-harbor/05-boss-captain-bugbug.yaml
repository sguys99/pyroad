# 2월드 보스 7: 버그버그 선장 (P10-07, 2월드 최종 보스, world2.md 제안 J)
# 작성 안내: content/README.md "보스". 라운드 하나 = 퀴즈 하나와 같은 규칙. 공개 부분(prompt)에 정답을 쓰지 마세요
# 2-1 ~ 2-6 에서 한 문제씩 + 종합 1문제. review_quest 는 그 개념을 배운 앞 스테이지 퀘스트 (같은 월드면 됨, build.ts)

id: b2000000-0000-0000-0000-000000000207
order: 5
title: 버그버그 선장
concept: 2월드 총정리
xp_reward: 78
quest_type: boss
prompt:
  topic: 코드 바다에서 배운 문자열, 딕셔너리, 중첩 반복, math, 에러, 알고리즘 총정리
  learning_goals:
    - 여러 섬에서 배운 주문이 섞인 코드를 한 줄씩 따라갈 수 있다
    - 에러가 나는 줄을 찾아 멈추지 않게 고칠 수 있다
    - 리스트 속 딕셔너리를 다루는 코드의 버그를 고칠 수 있다
  story_context: 두 프로그램을 완성하자 항구에 커다란 해적선이 들어왔어요! 뱃머리에 선장 모자를 쓴 버그버그가 서 있네요. 지금까지 만난 버그버그들의 대장, 버그버그 선장이래요. 코드 바다에서 배운 모든 주문으로 마지막 시험을 통과하면 별똥이가 코드 선장 모자를 씌워 준대요!
  fallback_text: 코드는 위에서 아래로 한 줄씩 따라가요. 글자와 리스트 번호는 0부터 세고, 딕셔너리는 이름표로 꺼내요. 반복 안의 반복은 바깥 한 번에 안쪽이 다 돌아요. 에러가 나면 맨 아래 줄의 에러 이름부터 읽어요. 섬마다 배운 것을 하나씩 떠올려 봐요.
  boss:
    name: 버그버그 선장
    look: captain
    intro: 으하하! 나는 코드 바다의 주인, 버그버그 선장이다! 섬마다 내 부하들을 이겼다고? 마지막 일곱 문제를 풀어 보거라!
    on_defeat: 으으, 내가 졌다! 너야말로 진짜 코드 선장이로구나. 이 선장 모자는 이제 네 거야. 다음 바다에서도 같이 모험하자!
    on_victory: 으하하, 아직 내 배를 넘기엔 이르다! 섬마다 배운 주문을 다시 떠올리고 돌아오너라. 기다리고 있으마!
rounds:
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000008
    prompt:
      quiz:
        question: 산호 문자열 공방에서 배운 주문이에요. 선장의 깃발 글자를 쪼개요. 돌리면 무엇이 나올까?
        code: |-
          flag = "pirate,ship"
          parts = flag.split(",")
          print(parts[1].upper() + "!")
        options:
          - { id: opt-z5qe, text: 'SHIP!' }
          - { id: opt-m8ta, text: 'PIRATE!' }
          - { id: opt-d3wv, text: 'ship!' }
          - { id: opt-k7nj, text: 'PIRATE,SHIP!' }
    answer:
      quiz_answer:
        accepted: [opt-z5qe]
        explanation: split 으로 쉼표마다 쪼개면 pirate 와 ship 두 조각이 돼요. 1번 조각은 두 번째인 ship 이고, upper 로 큰 글자가 돼요.
        explanations:
          opt-m8ta: 리스트 번호는 0부터 세요. 1번은 두 번째 조각이에요.
          opt-d3wv: upper 는 모든 글자를 큰 글자로 바꿔요.
          opt-k7nj: split 으로 쪼갠 다음 조각 하나만 꺼냈어요.
  - quiz_kind: fill_blank
    review_quest: b2000000-0000-0000-0000-000000000017
    prompt:
      quiz:
        question: 등대 딕셔너리 도서관에서 배운 주문이에요. 빈칸을 채워 잡은 물고기를 종류별로 세고 모두 보여 줘요
        code: |-
          fish = ["고등어", "참치", "고등어"]
          count = {}
          for f in fish:
              count[f] = count.{{bk-q6wd}}(f, 0) + 1
          for name, n in count.{{bk-j2ns}}():
              print(f"{name}: {n}마리")
        tokens:
          - { id: tok-x8rc, text: get }
          - { id: tok-f4ab, text: items }
          - { id: tok-u9kh, text: keys }
          - { id: tok-c3mz, text: append }
    answer:
      quiz_answer:
        accepted:
          - { bk-q6wd: tok-x8rc, bk-j2ns: tok-f4ab }
        explanation: get 은 처음 보는 물고기면 0을 줘서 1부터 셀 수 있어요. items 는 이름표와 내용을 한 쌍씩 꺼내서 고등어 2마리, 참치 1마리가 나와요.
        explanations:
          tok-u9kh: keys 는 이름표만 꺼내요. 내용 n 은 함께 나오지 않아요.
          tok-c3mz: append 는 리스트에 더하는 메서드예요. 딕셔너리에는 없어요.
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000023
    prompt:
      quiz:
        question: 소용돌이 반복 미로에서 배운 주문이에요. 선장의 보물 지도를 그려요. 돌리면 무엇이 나올까?
        code: |-
          grid = [["#", "."], [".", "#"], ["#", "#"]]
          for row in grid:
              line = ""
              for cell in row:
                  line = line + cell
              print(line)
        options:
          - { id: opt-p2xg, text: "#.\n.#\n##" }
          - { id: opt-w6co, text: "#.#\n.##" }
          - { id: opt-a9le, text: '#..###' }
          - { id: opt-h4ub, text: "##\n.#\n#." }
    answer:
      quiz_answer:
        accepted: [opt-p2xg]
        explanation: 바깥 반복은 줄을 하나씩, 안쪽 반복은 그 줄의 칸을 하나씩 붙여요. 줄마다 한 번 보여 줘서 세 줄이 리스트 차례 그대로 나와요.
        explanations:
          opt-w6co: 바깥 반복은 칸이 아니라 줄을 하나씩 꺼내요. 그래서 세로가 아니라 가로로 이어요.
          opt-a9le: print 가 바깥 반복 안에 있어서 줄마다 따로 보여 줘요.
          opt-h4ub: 줄은 리스트에 적힌 차례대로 나와요. 거꾸로가 아니에요.
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000028
    prompt:
      quiz:
        question: 해적선 랜덤 놀이공원에서 배운 주문이에요. 선장이 금화 7개를 둘로 나눠요. 돌리면 무엇이 나올까?
        code: |-
          import math
          print(math.floor(7 / 2), math.ceil(7 / 2))
        options:
          - { id: opt-s3fy, text: '3 4' }
          - { id: opt-e8kd, text: '4 3' }
          - { id: opt-n6wr, text: '3.5 3.5' }
          - { id: opt-b2qm, text: '3 3' }
    answer:
      quiz_answer:
        accepted: [opt-s3fy]
        explanation: 7 나누기 2는 3.5예요. floor 는 내림이라 3, ceil 은 올림이라 4가 돼요.
        explanations:
          opt-e8kd: floor 는 내림, ceil 은 올림이에요. 둘이 바뀌었어요.
          opt-n6wr: floor 와 ceil 은 소수점 없는 정수로 만들어 줘요.
          opt-b2qm: ceil 은 올림이라 3.5 가 4가 돼요.
  - quiz_kind: bug_hunt
    review_quest: b2000000-0000-0000-0000-000000000039
    prompt:
      quiz:
        question: 버그 병원선에서 배운 주문이에요. 선원 명단에 버그버그가 없어서 코드가 멈춰요. 없으면 0이 나오게 틀린 줄을 찾아 고쳐요
        lines:
          - { id: ln-t3ka, code: 'crew = {"파이뱀": 3, "별똥이": 2}' }
          - { id: ln-y7mc, code: 'for name in ["파이뱀", "버그버그"]:' }
          - { id: ln-g5wb, code: '    print(name, crew[name])' }
        fixes:
          - { id: fx-r8dn, code: '    print(name, crew.get(name, 0))' }
          - { id: fx-v2hp, code: '    print(name, crew.get[name])' }
          - { id: fx-l6qs, code: '    print(name, crew(name))' }
          - { id: fx-c9yz, code: '    print(name, crew[0])' }
    answer:
      quiz_answer:
        accepted:
          - { line: ln-g5wb, fix: fx-r8dn }
        explanation: 명단에 버그버그 이름표가 없어서 대괄호로 꺼내면 KeyError 가 나요. get 으로 꺼내면 없는 이름표 대신 0을 줘서 멈추지 않아요.
        explanations:
          ln-t3ka: 선원 명단 딕셔너리는 잘 만들었어요.
          ln-y7mc: 이름을 하나씩 도는 반복은 맞아요.
          fx-v2hp: get 은 괄호로 불러요. 대괄호를 쓰면 멈춰요.
          fx-l6qs: 딕셔너리는 함수처럼 괄호로 부를 수 없어요.
          fx-c9yz: 이름표는 번호가 아니라 이름이에요. 0 이름표도 없어서 멈춰요.
  - quiz_kind: parsons
    review_quest: b2000000-0000-0000-0000-000000000047
    prompt:
      quiz:
        question: 해저 알고리즘 산맥에서 배운 주문이에요. 줄을 순서대로 놓고 들여쓰기도 맞춰, 가장 큰 보물을 직접 찾아요
        indent: true
        lines:
          - { id: ln-n4xw, code: 'treasure = [30, 80, 50]' }
          - { id: ln-b7je, code: 'best = treasure[0]' }
          - { id: ln-w3go, code: 'for t in treasure:' }
          - { id: ln-h9sa, code: 'if t > best:' }
          - { id: ln-d6ry, code: 'best = t' }
          - { id: ln-k2mf, code: 'print(f"가장 큰 보물: {best}")' }
    answer:
      quiz_answer:
        accepted:
          - - { id: ln-n4xw, indent: 0 }
            - { id: ln-b7je, indent: 0 }
            - { id: ln-w3go, indent: 0 }
            - { id: ln-h9sa, indent: 1 }
            - { id: ln-d6ry, indent: 2 }
            - { id: ln-k2mf, indent: 0 }
        explanation: 보물 리스트를 먼저 만들고, 첫 보물을 대장으로 정해요. 하나씩 보며 더 큰 보물이 나오면 대장을 바꾸고, 다 본 뒤에 한 번 보여 줘서 80이 나와요.
  - quiz_kind: bug_hunt
    review_quest: b2000000-0000-0000-0000-000000000055
    prompt:
      quiz:
        question: 선장의 마지막 문제! 용돈 기입장의 금액을 모두 더해야 하는데 TypeError 가 나요. 틀린 줄을 찾아 고쳐요
        lines:
          - {
              id: ln-s8pv,
              code: 'records = [{"내용": "간식", "금액": 1500}, {"내용": "선물", "금액": 3000}]',
            }
          - { id: ln-e4tk, code: 'total = 0' }
          - { id: ln-m2zd, code: 'for r in records:' }
          - { id: ln-q9ha, code: '    total = total + r' }
          - { id: ln-x5bc, code: 'print(f"모두 {total}원")' }
        fixes:
          - { id: fx-o7wm, code: '    total = total + r["금액"]' }
          - { id: fx-h3ce, code: '    total = total + records["금액"]' }
          - { id: fx-z6ug, code: '    total = total + r["내용"]' }
          - { id: fx-a4kx, code: '    total = r["금액"]' }
    answer:
      quiz_answer:
        accepted:
          - { line: ln-q9ha, fix: fx-o7wm }
        explanation: r 은 기록 딕셔너리 하나라서 숫자와 바로 더할 수 없어요. r["금액"] 으로 금액만 꺼내 더하면 모두 4500원이 나와요.
        explanations:
          ln-s8pv: 리스트 속 딕셔너리로 기록을 잘 적었어요.
          ln-e4tk: 합계를 0에서 시작하는 것은 맞아요.
          ln-m2zd: 기록을 하나씩 도는 반복은 맞아요.
          ln-x5bc: 합계를 보여 주는 줄은 맞아요. 더하는 줄을 살펴봐요.
          fx-h3ce: records 는 리스트라서 이름표로 꺼낼 수 없어요. 지금 보고 있는 기록 r 에서 꺼내요.
          fx-z6ug: 내용은 간식 같은 글자라서 숫자와 더할 수 없어요.
          fx-a4kx: 더하지 않고 바꿔 넣기만 해서 마지막 금액만 남아요.
