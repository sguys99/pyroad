        ]

        print("[기입장]")
        for record in records:
            name = record["내용"]
            money = record["금액"]
            print(f"{name}: {money}원")

        # 3단계: 기록을 더하는 함수를 만들어요
        def add_record(name, money):
            records.append({"내용": name, "금액": money})

        add_record("간식", -800)
        add_record("심부름", 1000)
        print(f"기록 {len(records)}개")

        # 4단계: 남은 돈을 계산하는 함수를 만들어요
        def total():
            left = 0
            for record in records:
                left = left + record["금액"]
            return left

        income = 0
        spend = 0
        for record in records:
            if record["금액"] > 0:
                income = income + record["금액"]
            else:
                spend = spend - record["금액"]

        print(f"들어온 돈: {income}원")
        print(f"나간 돈: {spend}원")
        print(f"남은 돈: {total()}원")

        # 5단계: 이번 달 보고서를 만들어요
        add_record("선물", -2500)

        spent = {}
        for record in records:
            if record["금액"] < 0:
                name = record["내용"]
                if name not in spent:
                    spent[name] = 0
                spent[name] = spent[name] - record["금액"]

        print("[이번 달 보고서]")
        big_name = ""
        big_money = 0
        for name, money in spent.items():
            print(f"{name}: {money}원")
            if money > big_money:
                big_name = name
                big_money = money
        print(f"가장 많이 쓴 곳: {big_name}")
