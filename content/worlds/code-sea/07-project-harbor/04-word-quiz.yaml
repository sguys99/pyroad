# 공개: 학생 화면으로 그대로 내려갑니다 (quests.prompt_skeleton). 정답을 쓰지 마세요
prompt:
  topic: '응용 프로젝트: 영어 단어 퀴즈 만들기'
  learning_goals:
    - 딕셔너리와 함수로 채점하는 프로그램을 만들 수 있다
    - random.shuffle로 문제 순서를 섞어도 점수는 같다는 것을 확인할 수 있다
    - 틀린 단어를 리스트에 모아 오답 노트를 만들 수 있다
  story_context: 항구의 선원 학교에서 영어 단어 시험을 본대요! 별똥이가 친구들 답안지를 한 장 주워 왔어요. 파이뱀과 함께 단어장을 만들고, 답안지를 채점하고, 틀린 단어를 모은 오답 노트까지 만드는 퀴즈 프로그램을 완성해 봐요.
  exercise_description: 영어 단어와 뜻을 담은 단어장 딕셔너리를 만들고, 답을 채점하는 함수, 문제 순서 섞기, 오답 노트까지 5단계로 하나씩 더해 단어 퀴즈 프로그램을 완성하세요.
  starter_code: |
    # 단어 퀴즈 프로그램을 만들어 봐요!
  expected_output_hint: 프로젝트를 5단계로 나누어 완성해요
  fallback_text: 단어 퀴즈는 영어 단어를 이름표, 우리말 뜻을 내용으로 하는 딕셔너리에서 시작해요. 답이 맞는지 알려 주는 함수를 만들고, 반복하며 맞힌 개수를 세요. 순서를 섞어도 맞힌 개수는 그대로라는 것도 확인해 봐요!
