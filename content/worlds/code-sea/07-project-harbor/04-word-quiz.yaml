  validation:
    type: all
    rules:
      - type: contains
        expected: '맞힌 개수: 3/5'
      - type: contains
        expected: '틀린 단어: 2개'
      - type: code_check
        expected: random.shuffle
  hints:
    level_1: 이 프로젝트는 5단계로 나뉘어 있어요. 단계마다 안내와 해 볼 일을 따라가 보세요!
    level_2: 단어장 딕셔너리, 채점 함수, 순서 섞기, 오답 노트 순서로 만들어요.
    level_3: 막히면 단계마다 있는 힌트를 열어 보세요. 빈칸 ___ 을 채우면 돼요!
