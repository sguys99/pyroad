# 실력 확인 퀴즈 (P10-03, docs/curriculum/world2.md §7): 1월드를 다 깨지 않고 코드 바다를 여는 시험
# 작성 안내: content/README.md "실력 확인 퀴즈". 문제 하나 = 보스 라운드 하나와 같은 모양·규칙
# - 묶음 2벌 × 10문제, KST 날마다 번갈아 나옴. 8문제 이상 맞히면 합격 (00052)
# - 1월드 퀴즈·보스와 겹치지 않는 새 문제. 1월드 스테이지 1~7을 고르게, 퀴즈 4종을 섞어
# - review_quest: 틀리면 "더 연습하면 좋은 단계"로 보여 줄 1월드 퀘스트 (그 스테이지 이름이 나옴)
# - 학생에게 정답·해설을 보여 주지 않습니다 (explanation 은 검수용)

sets:
  # ── 1벌 (설계서 §7 표) ──
  - questions:
      # 1 · 1단계 파이썬 마을 · print 와 \n
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000024
        prompt:
          quiz:
            question: 이 코드를 돌리면 무엇이 나올까?
            code: |-
              print("물고기\n문어")
            options:
              - { id: opt-r4kd, text: "물고기\n문어" }
              - { id: opt-w8ze, text: '물고기\n문어' }
              - { id: opt-b2xa, text: '물고기 문어' }
              - { id: opt-h6mu, text: '물고기문어' }
        answer:
          quiz_answer:
            accepted: [opt-r4kd]
            explanation: \n 은 줄을 바꾸는 특수 문자라서 물고기 다음 줄에 문어가 나와요.
      # 2 · 2단계 변수의 숲 · 변수 다시 넣기
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000027
        prompt:
          quiz:
            question: 조개껍데기 상자의 값이 바뀌어요. 돌리면 무엇이 나올까?
            code: |-
              shell = 3
              shell = shell + 2
              print(shell)
            options:
              - { id: opt-n5gq, text: '5' }
              - { id: opt-c9vt, text: '3' }
              - { id: opt-k3pw, text: 'shell' }
              - { id: opt-y7fe, text: 'shell + 2' }
        answer:
          quiz_answer:
            accepted: [opt-n5gq]
            explanation: 오른쪽 shell + 2 를 먼저 계산해서 3 + 2 = 5 를 다시 shell 상자에 넣어요.
      # 3 · 2단계 변수의 숲 · str() 변환
      - quiz_kind: bug_hunt
        review_quest: b1000000-0000-0000-0000-000000000007
        prompt:
          quiz:
            question: 돌고래 나이를 보여 주려는데 오류가 나요. 틀린 줄을 찾아 고쳐요
            lines:
              - { id: ln-d4sk, code: 'name = "돌고래"' }
              - { id: ln-u7ma, code: 'age = 10' }
              - { id: ln-f2yc, code: 'print(name + "의 나이: " + age)' }
            fixes:
              - { id: fx-q8lo, code: 'print(name + "의 나이: " + str(age))' }
              - { id: fx-g3tb, code: 'print(name + "의 나이: " + int(age))' }
              - { id: fx-v6wr, code: 'print(name + "의 나이: " + "age")' }
        answer:
          quiz_answer:
            accepted:
              - { line: ln-f2yc, fix: fx-q8lo }
            explanation: 글자와 숫자는 + 로 바로 이을 수 없어요. str()로 숫자를 글자로 바꿔야 해요.
      # 4 · 3단계 조건의 갈림길 · if/elif/else
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000009
        prompt:
          quiz:
            question: 점수에 따라 메달을 줘요. 돌리면 무엇이 나올까?
            code: |-
              score = 85
              if score >= 90:
                  print("금메달")
              elif score >= 80:
                  print("은메달")
              else:
                  print("동메달")
            options:
              - { id: opt-s2jh, text: '은메달' }
              - { id: opt-e5wx, text: '금메달' }
              - { id: opt-a8ny, text: '동메달' }
              - { id: opt-l4qc, text: "은메달\n동메달" }
        answer:
          quiz_answer:
            accepted: [opt-s2jh]
            explanation: 85는 90보다 작고 80 이상이라 elif 줄만 실행돼요. 맞는 조건을 찾으면 나머지는 건너뛰어요.
      # 5 · 3단계 조건의 갈림길 · and/or
      - quiz_kind: fill_blank
        review_quest: b1000000-0000-0000-0000-000000000011
        prompt:
          quiz:
            question: 빈칸을 채워 표가 있고 키도 120 이상일 때만 배에 타게 해요
            code: |-
              ticket = True
              height = 110
              if ticket {{bk-r7ma}} height >= 120:
                  print("배에 타요")
              else:
                  print("다음에 타요")
            tokens:
              - { id: tok-z5ub, text: and }
              - { id: tok-o2kv, text: or }
              - { id: tok-i9de, text: not }
        answer:
          quiz_answer:
            accepted:
              - { bk-r7ma: tok-z5ub }
            explanation: 두 조건이 모두 참이어야 할 때는 and 를 써요. 키가 110이라 "다음에 타요"가 나와요.
      # 6 · 4단계 반복의 동굴 · range 끝 숫자
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000012
        prompt:
          quiz:
            question: 동굴 계단 번호를 세요. 돌리면 무엇이 나올까?
            code: |-
              for i in range(2, 5):
                  print(i)
            options:
              - { id: opt-m6tr, text: "2\n3\n4" }
              - { id: opt-x3fa, text: "2\n3\n4\n5" }
              - { id: opt-p7ge, text: "0\n1\n2\n3\n4" }
              - { id: opt-j2wn, text: "3\n4\n5" }
        answer:
          quiz_answer:
            accepted: [opt-m6tr]
            explanation: range(2, 5)는 2부터 시작해서 5 바로 앞인 4까지 세요. 끝 숫자는 들어가지 않아요.
      # 7 · 4단계 반복의 동굴 · while 누적 합 (들여쓰기)
      - quiz_kind: parsons
        review_quest: b1000000-0000-0000-0000-000000000034
        prompt:
          quiz:
            question: 줄을 순서대로 놓고 들여쓰기도 맞춰, while 로 1부터 5까지 더한 값을 한 번만 보여 줘요
            indent: true
            lines:
              - { id: ln-t5hu, code: 'total = 0' }
              - { id: ln-c2rq, code: 'n = 1' }
              - { id: ln-w9kx, code: 'while n <= 5:' }
              - { id: ln-e4ob, code: 'total = total + n' }
              - { id: ln-y8vj, code: 'n = n + 1' }
              - { id: ln-a3ls, code: 'print(total)' }
        answer:
          quiz_answer:
            accepted:
              - - { id: ln-t5hu, indent: 0 }
                - { id: ln-c2rq, indent: 0 }
                - { id: ln-w9kx, indent: 0 }
                - { id: ln-e4ob, indent: 1 }
                - { id: ln-y8vj, indent: 1 }
                - { id: ln-a3ls, indent: 0 }
              - - { id: ln-c2rq, indent: 0 }
                - { id: ln-t5hu, indent: 0 }
                - { id: ln-w9kx, indent: 0 }
                - { id: ln-e4ob, indent: 1 }
                - { id: ln-y8vj, indent: 1 }
                - { id: ln-a3ls, indent: 0 }
            explanation: 반복 안에서 total 에 n 을 더한 뒤 n 을 1 늘려요. 반복이 끝나면 들여쓰기 없이 한 번만 보여 줘서 15가 나와요.
      # 8 · 5단계 리스트 호수 · 번호·append·len
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000018
        prompt:
          quiz:
            question: 바닷가에서 주운 것을 리스트에 담아요. 돌리면 무엇이 나올까?
            code: |-
              shells = ["소라", "조개"]
              shells.append("불가사리")
              print(shells[1], len(shells))
            options:
              - { id: opt-f8dm, text: '조개 3' }
              - { id: opt-u3hz, text: '소라 3' }
              - { id: opt-q6sb, text: '조개 2' }
              - { id: opt-k9ya, text: '불가사리 3' }
        answer:
          quiz_answer:
            accepted: [opt-f8dm]
            explanation: 번호는 0부터 세서 shells[1]은 두 번째인 조개예요. append 로 하나 늘어 모두 3개예요.
      # 9 · 6단계 함수의 탑 · def·return
      - quiz_kind: fill_blank
        review_quest: b1000000-0000-0000-0000-000000000020
        prompt:
          quiz:
            question: 빈칸을 채워 두 수를 더해 돌려주는 함수를 만들어요
            code: |-
              {{bk-k2dw}} add(a, b):
                  {{bk-p8zn}} a + b

              print(add(3, 4))
            tokens:
              - { id: tok-g7ra, text: def }
              - { id: tok-n4ce, text: return }
              - { id: tok-b6ux, text: print }
        answer:
          quiz_answer:
            accepted:
              - { bk-k2dw: tok-g7ra, bk-p8zn: tok-n4ce }
            explanation: 함수는 def 로 만들고, 계산한 값은 return 으로 돌려줘요. 그래서 7이 나와요.
      # 10 · 6~7단계 종합 · return 을 빠뜨린 평균 함수
      - quiz_kind: bug_hunt
        review_quest: b1000000-0000-0000-0000-000000000044
        prompt:
          quiz:
            question: 평균을 보여 주려는데 None 이 나와요. 틀린 줄을 찾아 고쳐요
            lines:
              - { id: ln-h3pe, code: 'def average(nums):' }
              - { id: ln-z7ck, code: '    total = 0' }
              - { id: ln-r2wy, code: '    for n in nums:' }
              - { id: ln-m5ia, code: '        total = total + n' }
              - { id: ln-s8fo, code: '    total / len(nums)' }
              - { id: ln-x6dl, code: 'print(average([80, 90, 100]))' }
            fixes:
              - { id: fx-j5nv, code: '    return total / len(nums)' }
              - { id: fx-o8qa, code: '    print(total / len(nums))' }
              - { id: fx-w3ke, code: 'return total / len(nums)' }
        answer:
          quiz_answer:
            accepted:
              - { line: ln-s8fo, fix: fx-j5nv }
            explanation: 계산만 하고 돌려주지 않으면 함수는 None 을 돌려줘요. 함수 안에서 return 으로 돌려줘야 해요.

  # ── 2벌 (같은 규칙으로 새로 쓴 10문제) ──
  - questions:
      # 1 · 1단계 파이썬 마을 · 주석과 숫자 출력
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000003
        prompt:
          quiz:
            question: 메모가 섞인 코드예요. 돌리면 무엇이 나올까?
            code: |-
              # print("안녕")
              print("바닷가")
              print(7 + 3)
            options:
              - { id: opt-v2hs, text: "바닷가\n10" }
              - { id: opt-d9qe, text: "안녕\n바닷가\n10" }
              - { id: opt-i4mz, text: "바닷가\n7 + 3" }
              - { id: opt-t6wc, text: "바닷가\n73" }
        answer:
          quiz_answer:
            accepted: [opt-v2hs]
            explanation: '# 뒤는 메모라 실행하지 않아요. 따옴표 없는 7 + 3 은 계산해서 10이 나와요.'
      # 2 · 1단계 파이썬 마을 · 따옴표 짝
      - quiz_kind: bug_hunt
        review_quest: b1000000-0000-0000-0000-000000000023
        prompt:
          quiz:
            question: 바다 소식을 두 줄로 보여 주려는데 오류가 나요. 틀린 줄을 찾아 고쳐요
            lines:
              - { id: ln-k8ra, code: 'print("갈매기가 날아요")' }
              - { id: ln-p3zu, code: 'print("파도가 쳐요'')' }
            fixes:
              - { id: fx-e6yn, code: 'print("파도가 쳐요")' }
              - { id: fx-c4lm, code: 'print(''파도가 쳐요")' }
              - { id: fx-u9dg, code: 'print(파도가 쳐요)' }
        answer:
          quiz_answer:
            accepted:
              - { line: ln-p3zu, fix: fx-e6yn }
            explanation: 글자를 여는 따옴표와 닫는 따옴표는 같은 모양이어야 해요.
      # 3 · 2단계 변수의 숲 · 문자열 연결
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000028
        prompt:
          quiz:
            question: 생선 가게 간판을 만들어요. 돌리면 무엇이 나올까?
            code: |-
              fish = "고등어"
              count = "3"
              print(fish + count + "마리")
            options:
              - { id: opt-g5xk, text: '고등어3마리' }
              - { id: opt-w2ob, text: '고등어 3 마리' }
              - { id: opt-n8rf, text: 'fish3마리' }
              - { id: opt-a6jt, text: 'fishcount마리' }
        answer:
          quiz_answer:
            accepted: [opt-g5xk]
            explanation: 상자 이름 대신 상자 속 글자가 나오고, + 는 띄어쓰기 없이 글자를 그대로 이어 붙여요.
      # 4 · 2단계 변수의 숲 · int() 변환
      - quiz_kind: fill_blank
        review_quest: b1000000-0000-0000-0000-000000000007
        prompt:
          quiz:
            question: 빈칸을 채워 글자 "4"를 숫자로 바꾼 뒤 2를 더해 6이 나오게 해요
            code: |-
              apples = "4"
              total = {{bk-m3jx}}(apples) + 2
              print(total)
            tokens:
              - { id: tok-s7pe, text: int }
              - { id: tok-h2qa, text: str }
              - { id: tok-y5wi, text: print }
        answer:
          quiz_answer:
            accepted:
              - { bk-m3jx: tok-s7pe }
            explanation: int()는 글자를 숫자로 바꿔요. 숫자 4가 되어야 2를 더할 수 있어요.
      # 5 · 3단계 조건의 갈림길 · % 와 if/else
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000030
        prompt:
          quiz:
            question: 숫자 요정이 짝을 맞춰 봐요. 돌리면 무엇이 나올까?
            code: |-
              n = 7
              if n % 2 == 0:
                  print("짝수")
              else:
                  print("홀수")
            options:
              - { id: opt-z3cu, text: '홀수' }
              - { id: opt-l7ha, text: '짝수' }
              - { id: opt-q2vd, text: '1' }
              - { id: opt-e9ks, text: "짝수\n홀수" }
        answer:
          quiz_answer:
            accepted: [opt-z3cu]
            explanation: 7 % 2 는 나머지 1이라 0과 같지 않아요. 그래서 else 줄이 실행돼요.
      # 6 · 3단계 조건의 갈림길 · 비교 연산자
      - quiz_kind: bug_hunt
        review_quest: b1000000-0000-0000-0000-000000000010
        prompt:
          quiz:
            question: 키가 120 이상이면 탈 수 있어야 하는데, 키가 딱 120인 친구가 못 타요. 틀린 줄을 찾아 고쳐요
            lines:
              - { id: ln-f6md, code: 'height = 120' }
              - { id: ln-o4tw, code: 'if height > 120:' }
              - { id: ln-j8yb, code: '    print("탈 수 있어요")' }
              - { id: ln-r5ce, code: 'else:' }
              - { id: ln-i2gx, code: '    print("다음에 타요")' }
            fixes:
              - { id: fx-b8wq, code: 'if height >= 120:' }
              - { id: fx-m4ul, code: 'if height < 120:' }
              - { id: fx-d6zr, code: 'if height == 130:' }
        answer:
          quiz_answer:
            accepted:
              - { line: ln-o4tw, fix: fx-b8wq }
            explanation: '> 는 120을 넣지 않아요. 120도 넣으려면 크거나 같다는 >= 를 써요.'
      # 7 · 4단계 반복의 동굴 · continue
      - quiz_kind: fill_blank
        review_quest: b1000000-0000-0000-0000-000000000015
        prompt:
          quiz:
            question: 빈칸을 채워 3만 건너뛰고 나머지 숫자는 모두 보여 줘요
            code: |-
              for n in range(1, 6):
                  if n == 3:
                      {{bk-w4fe}}
                  print(n)
            tokens:
              - { id: tok-k5oy, text: continue }
              - { id: tok-x8bh, text: break }
              - { id: tok-c3ni, text: pass }
        answer:
          quiz_answer:
            accepted:
              - { bk-w4fe: tok-k5oy }
            explanation: continue 는 이번 차례만 건너뛰고 다음 숫자로 가요. 그래서 1, 2, 4, 5가 나와요.
      # 8 · 5단계 리스트 호수 · 빈 리스트·append·len·번호
      - quiz_kind: parsons
        review_quest: b1000000-0000-0000-0000-000000000016
        prompt:
          quiz:
            question: 줄을 순서대로 놓아 빈 리스트에 고등어를 먼저, 참치를 다음에 넣고 물고기 수와 첫 번째 물고기를 보여 줘요
            lines:
              - { id: ln-n7sa, code: 'fish = []' }
              - { id: ln-g4qu, code: 'fish.append("고등어")' }
              - { id: ln-v9ej, code: 'fish.append("참치")' }
              - { id: ln-l2ko, code: 'print(len(fish), fish[0])' }
        answer:
          quiz_answer:
            accepted:
              - [ln-n7sa, ln-g4qu, ln-v9ej, ln-l2ko]
            explanation: 리스트를 먼저 만들고, 넣은 차례대로 번호가 붙어요. 2개를 넣었고 0번은 고등어예요.
      # 9 · 6단계 함수의 탑 · 기본 매개변수와 return
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000041
        prompt:
          quiz:
            question: 응원 함수를 불러요. 돌리면 무엇이 나올까?
            code: |-
              def cheer(word, times=2):
                  return word * times

              print(cheer("야호"))
            options:
              - { id: opt-p5xi, text: '야호야호' }
              - { id: opt-u8cw, text: '야호' }
              - { id: opt-b3ta, text: '야호 2' }
              - { id: opt-h7gn, text: '야호야호야호' }
        answer:
          quiz_answer:
            accepted: [opt-p5xi]
            explanation: times 를 주지 않아서 기본값 2를 써요. 글자 * 2 는 글자를 두 번 이어 붙여요.
      # 10 · 7단계 프로젝트 왕국 · 숫자 맞추기 (반복 + 조건)
      - quiz_kind: multiple_choice
        review_quest: b1000000-0000-0000-0000-000000000022
        prompt:
          quiz:
            question: 숫자 맞추기 게임에서 세 번 골랐어요. 돌리면 무엇이 나올까?
            code: |-
              secret = 7
