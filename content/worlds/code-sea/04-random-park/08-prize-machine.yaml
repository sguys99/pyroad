# 2월드 퀘스트 4-8: 황금 열쇠 뽑기 기계 (챌린지)
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-4
# 상품 5개 중 황금 열쇠가 꼭 있어(1/5) 금방 끝남. 시작 코드는 while 조건이 빈칸이라 바로 오류로 멈춤 (§10, B31)

id: b2000000-0000-0000-0000-000000000035
order: 8
title: 황금 열쇠 뽑기 기계
concept: while + random.choice
xp_reward: 120
quest_type: code
prompt:
  topic: 원하는 것이 나올 때까지 반복하기
  learning_goals:
    - while로 원하는 결과가 나올 때까지 무작위 뽑기를 되풀이할 수 있다
    - 반복할 때마다 횟수를 세어 몇 번 만에 끝났는지 알 수 있다
  story_context: 놀이공원 마지막 기구는 뽑기 기계예요! 황금 열쇠를 뽑으면 해적선 보물 창고 문이 열린대요. 황금 열쇠가 나올 때까지 계속 뽑아 봐요.
  exercise_description: 'while 로 황금 열쇠가 나올 때까지 random.choice(prizes)로 뽑고, 끝나면 "3번 만에 뽑았어요!" 처럼 몇 번 만에 뽑았는지 출력하세요'
  starter_code: |
    import random

    prizes = ["사탕", "풍선", "스티커", "모자", "황금 열쇠"]
    tries = 0
    prize = ""

    # 황금 열쇠가 아닌 동안 계속 뽑아요
    while ___:
        # 상품 하나를 무작위로 뽑아요
        prize = ___
        tries = tries + 1
        print(f"{tries}번째: {prize}")

    print(f"{tries}번 만에 뽑았어요!")
  expected_output_hint: '뽑은 상품과 횟수는 매번 달라요. 마지막 줄은 ○번 만에 뽑았어요! 모양이에요'
  checklist:
    - 'while 빈칸에 prize != "황금 열쇠" 를 써요. 황금 열쇠 가운데 띄어쓰기까지 리스트와 똑같이 써요'
    - 'prize = random.choice(prizes) 로 뽑아요'
    - 마지막에 황금 열쇠가 나오고 몇 번 만에 뽑았는지 나오는지 봐요
  example_output: |-
    1번째: 풍선
    2번째: 사탕
    3번째: 황금 열쇠
    3번 만에 뽑았어요!
  fallback_text: 'while 은 조건이 참인 동안 반복해요. prize != "황금 열쇠" 는 "아직 황금 열쇠가 아니야"라는 뜻이에요. 반복 안에서 prize 를 새로 뽑지 않으면 조건이 영원히 참이라 끝나지 않으니 꼭 뽑아야 해요.'
  is_challenge: true
answer:
  validation:
    type: all
    rules:
      - type: code_check
        expected: while
      - type: code_check
        expected: random.choice
      - type: contains
        expected: 번 만에 뽑았어요
  hints:
    level_1: 황금 열쇠가 "아닌" 동안 반복해요. 같지 않다는 비교 기호는 != 예요.
    level_2: 'while prize != "황금 열쇠": 로 쓰고, 반복 안에서 간식 추천기처럼 random.choice 로 뽑아요.'
    level_3: |-
      두 빈칸을 이렇게 채워 보세요!
      while prize != "황금 열쇠":
          prize = random.choice(prizes)
  solution_code: |
    import random

    prizes = ["사탕", "풍선", "스티커", "모자", "황금 열쇠"]
    tries = 0
    prize = ""

    while prize != "황금 열쇠":
        prize = random.choice(prizes)
        tries = tries + 1
        print(f"{tries}번째: {prize}")

    print(f"{tries}번 만에 뽑았어요!")
