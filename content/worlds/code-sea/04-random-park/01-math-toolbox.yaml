# 2월드 퀘스트 4-1: 수학 도구 상자
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-4

id: b2000000-0000-0000-0000-000000000028
order: 1
title: 수학 도구 상자
concept: import, math
xp_reward: 90
quest_type: code
prompt:
  topic: 모듈을 불러와 수학 도구 쓰기
  learning_goals:
    - import로 다른 사람이 만들어 둔 도구 상자(모듈)를 가져올 수 있다
    - math.sqrt, math.pi, math.ceil, math.floor를 쓸 수 있다
    - round(값, 2)로 소수 둘째 자리까지 반올림할 수 있다
  story_context: 해적선 놀이공원에 도착했어요! 기구를 고치는 해적 기술자가 수학 도구 상자를 빌려준대요. 상자 이름은 math 예요. import math 라고 부르면 상자가 열리고, 그 안의 도구를 math.도구이름 으로 꺼내 써요.
  exercise_description: 'import math 로 도구 상자를 가져와 math.sqrt(49), round(math.pi, 2), math.ceil(7 / 2) 를 차례로 출력하세요'
  starter_code: |
    # 1) 수학 도구 상자 math 를 가져와요
    ___

    # 예시: 7 / 2 = 3.5 를 내림하면 3
    print(math.floor(7 / 2))

    # 2) 49의 제곱근 (같은 수를 두 번 곱해 49가 되는 수)
    print(___)

    # 3) 원주율 math.pi (동그라미 둘레가 지름의 약 3.14배라는 수) 를 소수 둘째 자리까지 반올림
    print(___)

    # 4) 7 / 2 = 3.5 를 올림 (소수점 아래가 있으면 다음 정수로 올려요)
    print(___)
  expected_output_hint: 3, 7.0, 3.14, 4 가 한 줄씩 나와야 해요
  checklist:
    - 맨 위 빈칸에 import math 를 써요
    - 'math.sqrt(49), round(math.pi, 2), math.ceil(7 / 2) 를 print( ) 안에 넣어요'
    - 4줄이 나오는지 봐요
  example_output: |-
    3
    7.0
    3.14
    4
  fallback_text: 'import math 를 쓰면 수학 도구 상자가 열려요. math.sqrt(49)는 제곱근이라 7.0 이 나오고, round(math.pi, 2)는 3.14159… 를 둘째 자리까지 반올림해 3.14 예요. math.ceil 은 올림, math.floor 는 내림이에요. 이 도구들은 몇 번을 돌려도 늘 같은 답을 줘요.'
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |-
          3
          7.0
          3.14
          4
      - type: code_check
        expected: import math
      - type: code_check
        expected: math.sqrt(
      - type: code_check
        expected: math.ceil(
  hints:
    level_1: 도구 상자를 가져오는 주문은 import 예요. 상자 이름은 math 예요.
    level_2: '도구는 math.sqrt(49), math.ceil(7 / 2) 처럼 상자 이름 뒤에 점을 찍고 꺼내요. 반올림은 round(값, 2) 예요.'
    level_3: |-
      빈칸을 차례로 이렇게 채워 보세요!
      import math
      print(math.sqrt(49))
      print(round(math.pi, 2))
      print(math.ceil(7 / 2))
  solution_code: |
    import math

    print(math.floor(7 / 2))

    print(math.sqrt(49))

    print(round(math.pi, 2))

    print(math.ceil(7 / 2))
