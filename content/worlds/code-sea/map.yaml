# 월드 2 지도 설정 (P10-04). 작성법: content/README.md "map.yaml"
# 그림책 2권 "바다 여행": 섬에서 섬으로 건너는 바다 해도(THEME_BASE code_sea — 바다 물빛 + 나침반 + 노드마다 섬)
# 1월드(왼쪽 아래 → 오른쪽 위로 오르는 길)와 다르게, 가운데에서 위로 돌아 나갔다가 오른쪽 항구로 들어오는 고리 모양 항로
# 7번(2-F 항구, 보스)은 랜드마크 1.15배 + 왕관이라 오른쪽 가운데에 넉넉히

bgm: world2
path: catmull_rom
# 앰비언트 (P5-09, full에서만 움직임): 바다라 나뭇잎 없이 구름·물 위 반짝임만. 물결·배·부표·갈매기(bird)는 장식이 움직이고 고래·야자수·바위는 정지
# 동시 애니메이션 (worldMap.css 상한 16개 안팎): wide = 물결 3 + 배 1 + 부표 1 + 새 2 + 구름 3 + 반짝임 5 = 15, tall = 2 + 1 + 1 + 1 + 3 + 5 = 13 (1월드 15)
