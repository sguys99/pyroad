# 2월드 보스 2: 이름표 도둑 버그버그 (P10-07)
# 작성 안내: content/README.md "보스". 라운드 하나 = 퀴즈 하나와 같은 규칙. 공개 부분(prompt)에 정답을 쓰지 마세요

id: b2000000-0000-0000-0000-000000000202
order: 9
title: 이름표 도둑 버그버그
concept: 딕셔너리 총정리
xp_reward: 54
quest_type: boss
prompt:
  topic: 딕셔너리 키와 값, get, items, 개수 세기 총정리
  learning_goals:
    - 딕셔너리에 값을 더하고 고친 뒤 결과를 알아낼 수 있다
    - 없는 이름표를 꺼낼 때 멈추지 않는 방법을 고를 수 있다
    - 딕셔너리로 개수를 세고 모두 더하는 코드를 만들 수 있다
  story_context: 등대 도서관을 다 정리하고 나오려는데, 책장 꼭대기에서 이름표를 한 아름 안은 버그버그가 나타났어요! 떼어 간 이름표를 돌려받으려면 버그버그의 문제를 풀어야 해요.
  fallback_text: 딕셔너리는 이름표(키)가 붙은 상자예요. 같은 이름표에 다시 넣으면 내용이 바뀌고, 새 이름표에 넣으면 상자가 하나 늘어요. 없는 이름표를 꺼내면 멈추지만, get 은 대신 줄 값을 정할 수 있어요. items 는 이름표와 내용을 한 쌍씩 꺼내요.
  boss:
    name: 이름표 도둑 버그버그
    look: library
    intro: 쉿! 여긴 도서관이야. 나는 이름표 도둑 버그버그! 이름표를 돌려받고 싶으면 다섯 문제를 풀어 봐!
    on_defeat: 이런, 이름표가 다 제자리에 붙었네! 책장이 반짝반짝해졌어. 다음 섬 소용돌이 미로는 길이 겹겹이래, 조심해!
    on_victory: 후후, 이름표는 아직 내 주머니에 있어. 이름표와 내용을 다시 짝지어 보고 또 와!
rounds:
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000012
    prompt:
      quiz:
        question: 책 이름표를 고치고 하나 더 붙였어요. 돌리면 무엇이 나올까?
        code: |-
          book = {"제목": "바다 동화", "쪽수": 30}
          book["쪽수"] = 32
          book["빌린 사람"] = "별똥이"
          print(len(book), book["쪽수"])
        options:
          - { id: opt-n5wd, text: '3 32' }
          - { id: opt-g2ke, text: '2 32' }
          - { id: opt-v8qa, text: '3 30' }
          - { id: opt-p4ti, text: '4 32' }
    answer:
      quiz_answer:
        accepted: [opt-n5wd]
        explanation: 쪽수 이름표는 이미 있어서 내용만 32로 바뀌어요. 빌린 사람은 새 이름표라 하나 늘어서 이름표는 모두 3개예요.
        explanations:
          opt-g2ke: 빌린 사람은 새 이름표라서 딕셔너리가 하나 커져요.
          opt-v8qa: 같은 이름표에 다시 넣으면 내용이 새 값으로 바뀌어요.
          opt-p4ti: 쪽수는 이미 있던 이름표라 늘지 않아요. 새로 생긴 건 하나뿐이에요.
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000014
    prompt:
      quiz:
        question: 없는 책을 찾아도 멈추지 않게 했어요. 돌리면 무엇이 나올까?
        code: |-
          shelf = {"동화": 4, "과학": 2}
          print(shelf.get("만화", 0) + shelf.get("동화", 0))
        options:
          - { id: opt-r3ub, text: '4' }
          - { id: opt-f9lm, text: '6' }
          - { id: opt-c6xo, text: '0' }
          - { id: opt-w2hj, text: '40' }
    answer:
      quiz_answer:
        accepted: [opt-r3ub]
        explanation: 만화 이름표는 없어서 get 이 대신 0을 줘요. 동화는 4권이 있어서 0 + 4 로 4가 나와요.
        explanations:
          opt-f9lm: 과학 2권은 더하지 않았어요. 만화와 동화만 꺼냈어요.
          opt-c6xo: 동화 이름표는 있어서 get 이 진짜 내용 4를 줘요.
          opt-w2hj: 숫자끼리 + 하면 이어 붙이지 않고 더해요.
  - quiz_kind: fill_blank
    review_quest: b2000000-0000-0000-0000-000000000017
    prompt:
      quiz:
        question: 빈칸을 채워 별과 달이 각각 몇 표인지 세어요
        code: |-
          votes = ["별", "달", "별"]
          count = {}
          for v in votes:
              if v {{bk-m4ra}} count:
                  count[v] = count[v] + 1
              else:
                  count[v] = {{bk-y7ce}}
          print(count)
        tokens:
          - { id: tok-k5dz, text: in }
          - { id: tok-b3wq, text: not in }
          - { id: tok-h8nv, text: '1' }
          - { id: tok-s2fo, text: '0' }
    answer:
      quiz_answer:
        accepted:
          - { bk-m4ra: tok-k5dz, bk-y7ce: tok-h8nv }
        explanation: 이미 이름표가 있으면 1을 더하고, 처음 보는 이름표면 첫 표로 1을 넣어요. 별 2표, 달 1표가 나와요.
        explanations:
          tok-b3wq: 이름표가 없을 때 1을 더하려고 하면 꺼낼 내용이 없어서 멈춰요.
          tok-s2fo: 처음 나온 표도 한 표예요. 0으로 시작하면 한 표씩 모자라요.
  - quiz_kind: parsons
    review_quest: b2000000-0000-0000-0000-000000000015
    prompt:
      quiz:
        question: 줄을 순서대로 놓고 들여쓰기도 맞춰, 책장의 책을 모두 더해 보여 줘요
        indent: true
        lines:
          - { id: ln-t6pa, code: 'shelf = {"동화": 4, "만화": 5}' }
          - { id: ln-e3vk, code: 'total = 0' }
          - { id: ln-q9bm, code: 'for name, count in shelf.items():' }
          - { id: ln-a5xs, code: 'total = total + count' }
          - { id: ln-j2dh, code: 'print(total)' }
    answer:
      quiz_answer:
        accepted:
          - - { id: ln-t6pa, indent: 0 }
            - { id: ln-e3vk, indent: 0 }
            - { id: ln-q9bm, indent: 0 }
            - { id: ln-a5xs, indent: 1 }
            - { id: ln-j2dh, indent: 0 }
          - - { id: ln-e3vk, indent: 0 }
            - { id: ln-t6pa, indent: 0 }
            - { id: ln-q9bm, indent: 0 }
            - { id: ln-a5xs, indent: 1 }
            - { id: ln-j2dh, indent: 0 }
        explanation: 책장과 0에서 시작하는 합계를 먼저 준비하고(어느 쪽이 먼저여도 괜찮아요), items 로 한 쌍씩 돌며 권수를 더해요. 다 돈 뒤에 한 번만 보여 주면 9가 나와요.
  - quiz_kind: bug_hunt
    review_quest: b2000000-0000-0000-0000-000000000014
    prompt:
      quiz:
        question: 버그버그가 작가 이름표를 떼어 가서 코드가 멈춰요. 없으면 몰라요 가 나오게 틀린 줄을 찾아 고쳐요
        lines:
          - { id: ln-w7fc, code: 'book = {"제목": "등대 이야기", "쪽수": 20}' }
          - { id: ln-l3oy, code: 'print(book["제목"])' }
          - { id: ln-g8ue, code: 'print(book["작가"])' }
        fixes:
          - { id: fx-d2nq, code: 'print(book.get("작가", "몰라요"))' }
          - { id: fx-r6jt, code: 'print(book[작가])' }
          - { id: fx-x9az, code: 'print(book.get["작가"])' }
          - { id: fx-m4ip, code: 'print(book("작가"))' }
    answer:
      quiz_answer:
        accepted:
          - { line: ln-g8ue, fix: fx-d2nq }
        explanation: 작가 이름표가 없어서 대괄호로 꺼내면 멈춰요. get 은 이름표가 없을 때 대신 줄 값을 정할 수 있어서, 몰라요 가 나와요.
        explanations:
          ln-w7fc: 책 딕셔너리는 잘 만들었어요. 다만 작가 이름표가 없어요.
          ln-l3oy: 제목 이름표는 있어서 잘 꺼내요.
          fx-r6jt: 따옴표가 없으면 작가 라는 변수를 찾다가 멈춰요.
          fx-x9az: get 은 괄호로 불러요. 대괄호를 쓰면 멈춰요.
          fx-m4ip: 딕셔너리는 함수처럼 괄호로 부를 수 없어요.
