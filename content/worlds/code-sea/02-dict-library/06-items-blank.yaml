      - { id: tok-u9mc, text: len }
      - { id: tok-o2ka, text: keys }
      - { id: tok-z7fj, text: values }
      - { id: tok-g4sx, text: sum }
answer:
  quiz_answer:
    accepted:
      - { bk-i6tz: tok-e5pw, bk-n3ry: tok-u9mc }
    explanation: items()는 이름표와 내용을 한 쌍씩 꺼내 name 과 count 에 나눠 담아요. len()은 이름표 수를 세서 2가 나와요.
