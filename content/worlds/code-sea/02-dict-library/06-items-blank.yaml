prompt:
  topic: 딕셔너리 돌기와 세기
  learning_goals:
    - 이름표와 내용을 한 쌍씩 꺼내는 메서드를 고를 수 있다
    - 딕셔너리의 이름표 수를 세는 함수를 고를 수 있다
  story_context: 책장을 한 바퀴 돌며 칸마다 권수를 보여 주고, 칸이 모두 몇 개인지 세려고 해요. 그런데 주문 두 군데가 지워졌어요!
  fallback_text: 이름표와 내용을 한 쌍씩 꺼내야 name 과 count 두 변수에 나눠 담을 수 있어요. 개수를 세는 함수는 리스트에서도 썼어요.
  quiz:
    question: 빈칸을 채워 책장을 한 바퀴 돌며 보여 주고, 이름표가 몇 개인지 세어요
    code: |-
      shelf = {"동화": 4, "과학": 2}
      for name, count in shelf.{{bk-i6tz}}():
          print(f"{name}: {count}권")
      print({{bk-n3ry}}(shelf))
    tokens:
