# 2월드 퀘스트 2-8: 단어장 만들기 (챌린지)
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-2

id: b2000000-0000-0000-0000-000000000018
order: 8
title: 단어장 만들기
concept: split() + 딕셔너리 세기
xp_reward: 120
quest_type: code
prompt:
  topic: 문장을 쪼개 단어 수 세기
  learning_goals:
    - split()으로 문장을 단어 리스트로 쪼갤 수 있다
    - 딕셔너리로 단어마다 나온 횟수를 셀 수 있다
    - if로 조건에 맞는 단어만 골라 보여 줄 수 있다
  story_context: 등대지기가 쓴 일기에 자꾸 나오는 단어가 있대요. 단어장을 만들어 어떤 단어가 많이 나왔는지 찾아봐요!
  exercise_description: 'sentence 를 split()으로 단어로 쪼개 단어마다 개수를 count 딕셔너리에 세고, 2번 넘게 나온 단어만 "the: 3번"처럼 출력하세요'
  starter_code: |
    sentence = "the sea is blue and the sky is blue and the sun is hot"
    words = sentence.___()
    count = {}

    # 1) words 를 돌며 단어마다 개수를 세요 (반장 투표 세기처럼!)

    # 2) 2번 넘게 나온 단어만 보여 줘요
    for word, n in count.items():
        if ___:
            print(f"{word}: {n}번")
  expected_output_hint: '2번 넘게 나온 the: 3번 과 is: 3번 이 나와야 해요'
  checklist:
    - 'split() 으로 문장을 단어로 쪼개요'
    - '반장 투표처럼 단어마다 개수를 세요'
    - 'if n > 2: 로 2번 넘게 나온 단어만 골라요'
  example_output: |-
    the: 3번
    is: 3번
  fallback_text: 'split()은 괄호를 비우면 띄어쓰기마다 잘라요. 반장 투표 세기와 똑같이 count 딕셔너리로 단어를 세고, 마지막에 n > 2 인 단어만 보여 주면 돼요. 2번 나온 blue 와 and 는 빠져야 해요.'
  is_challenge: true
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |-
          the: 3번
          is: 3번
      - type: code_check
        expected: .split(
      - type: code_check
        expected: for
        whole_word: true
  hints:
    level_1: 먼저 문장을 단어 리스트로 쪼개야 해요. 조개 목걸이에서 쓴 메서드 기억나요?
    level_2: 'for w in words: 로 돌며 반장 투표처럼 if w in count: 이면 1 늘리고, 아니면 1로 시작해요. "2번 넘게"는 n > 2 예요.'
    level_3: |-
      words = sentence.split() 으로 쪼개고, 1) 자리에 이렇게 써 보세요! 마지막 빈칸은 n > 2 예요.
      for w in words:
          if w in count:
              count[w] = count[w] + 1
          else:
              count[w] = 1
  solution_code: |
    sentence = "the sea is blue and the sky is blue and the sun is hot"
    words = sentence.split()
    count = {}

    for w in words:
        if w in count:
            count[w] = count[w] + 1
        else:
            count[w] = 1

    for word, n in count.items():
        if n > 2:
            print(f"{word}: {n}번")
