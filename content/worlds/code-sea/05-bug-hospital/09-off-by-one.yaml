# 2월드 퀴즈 5-9: 하나 모자라요
# 작성 안내: content/README.md "퀴즈". 공개 부분(prompt)에 정답을 쓰지 마세요

id: b2000000-0000-0000-0000-000000000044
order: 9
title: 하나 모자라요
concept: range 끝 숫자
xp_reward: 30
quest_type: quiz
quiz_kind: bug_hunt
prompt:
  topic: 마지막 값을 빼먹는 버그 찾기
  learning_goals:
    - range의 끝 숫자는 들어가지 않아 마지막 값이 빠지는 버그를 찾을 수 있다
  story_context: 버그버그는 1일부터 7일까지 날마다 약을 한 알씩 먹어야 해요. 그런데 약 기록 코드가 하루를 빼먹어요! 에러 쪽지 없이 조용히 틀리는 버그예요.
  fallback_text: range(시작, 끝)은 끝 숫자 바로 앞에서 멈춰요. 7일째까지 돌려면 끝 숫자가 얼마여야 할지 생각해 보세요.
  quiz:
    question: 7일 동안 7알 이 나와야 하는데 하루가 모자라요. 틀린 줄을 찾아 고쳐요
    lines:
      - { id: ln-wb05, code: 'pills = 0' }
      - { id: ln-k2qn, code: 'for day in range(1, 7):' }
      - { id: ln-g8rs, code: '    pills = pills + 1' }
      - { id: ln-u3hm, code: 'print(f"{day}일 동안 {pills}알")' }
    fixes:
      - { id: fx-n9wb, code: 'for day in range(1, 8):' }
      - { id: fx-145j, code: 'for day in range(0, 7):' }
      - { id: fx-z5zg, code: 'for day in range(2, 8):' }
      - { id: fx-gw9k, code: 'for day in range(1, 6):' }
answer:
  quiz_answer:
    accepted:
      - { line: ln-k2qn, fix: fx-n9wb }
    explanation: range(1, 8)은 1부터 8 바로 앞인 7까지 돌아서 7일 동안 7알이 돼요. 원래 줄은 6일째에서 멈춰 하루가 모자랐어요.
    explanations:
      ln-wb05: 약 개수를 0부터 세기 시작하는 건 맞아요.
      ln-g8rs: 하루에 한 알씩 더하는 줄은 맞아요.
      ln-u3hm: 결과를 보여 주는 줄은 맞아요. 문제는 반복이 며칠 도는지예요.
      fx-145j: 7번 돌지만 0일부터 6일까지라서 마지막 날이 6일이 돼요.
      fx-z5zg: 2일부터 시작해서 첫날이 빠져요.
      fx-gw9k: 이러면 5일째에서 멈춰 이틀이 모자라요.
