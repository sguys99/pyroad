  solution_code: |
    # 병원선 매점 계산기
    price = {"사과": 3, "우유": 4, "빵": 5}
    basket = ["사과", "우유", "바나나"]
    delivery = "2"

    total = 0
    for item in basket:
        total = total + price.get(item, 0)
    print(f"합계: {total}원")

    total = total + int(delivery)
    print(f"배달비 더해서: {total}원")

    print(f"마지막 물건: {basket[-1]}")
