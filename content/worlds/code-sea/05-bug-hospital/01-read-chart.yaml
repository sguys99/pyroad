# 2월드 퀘스트 5-1: 진료 기록 읽기
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-5
# 고치기 퀘스트: 시작 코드는 일부러 NameError (§10). 답만 print 하지 않게 고친 줄을 code_check (제안 F)

id: b2000000-0000-0000-0000-000000000036
order: 1
title: 진료 기록 읽기
concept: 에러 메시지 읽기, NameError
xp_reward: 85
quest_type: code
prompt:
  topic: 에러 메시지에서 에러 이름과 줄 번호 찾기
  learning_goals:
    - 에러 메시지의 마지막 줄에서 에러 이름을 찾을 수 있다
    - 에러 메시지의 line 숫자를 보고 몇째 줄이 아픈지 찾을 수 있다
    - NameError는 없는 이름(오타)을 썼을 때 난다는 것을 안다
  story_context: 바다 위 병원선에 버그버그가 실려 왔어요! 코드를 너무 많이 먹어서 배탈이 났대요. 의사 가운을 입은 모험가가 진료 기록을 열었더니 코드가 멈추고 빨간 쪽지가 나왔어요. 이 쪽지가 바로 에러 메시지예요.
  exercise_description: '코드를 실행해 에러 메시지를 읽어 보세요. 마지막 줄의 에러 이름과 line 숫자를 보고, 그 줄의 변수 이름 오타를 고쳐 세 줄이 모두 나오게 하세요'
  starter_code: |
    # 버그버그 진료 기록
    patient = "버그버그"
    temperature = 38
    fever = temprature - 37
    print(f"환자: {patient}")
    print(f"체온: {temperature}도")
    print(f"열이 {fever}도 높아요")
  expected_output_hint: '환자: 버그버그, 체온: 38도, 열이 1도 높아요 가 한 줄씩 나와야 해요'
  checklist:
    - 먼저 그대로 실행해서 에러 메시지를 읽어요
    - 'line 뒤의 숫자가 가리키는 줄을 찾아요'
    - 그 줄의 이름 오타를 위에서 만든 변수 이름과 똑같이 고쳐요
  example_output: |-
    환자: 버그버그
    체온: 38도
    열이 1도 높아요
  fallback_text: '에러 메시지는 아래에서부터 읽어요. 맨 아래 줄 NameError 는 "그런 이름은 없어요"라는 뜻이고, 그 위의 line 4 는 4번째 줄이 아프다는 뜻이에요. 4번째 줄의 temprature 를 3번째 줄에서 만든 temperature 와 똑같이 고쳐요.'
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |-
          환자: 버그버그
          체온: 38도
          열이 1도 높아요
      - type: code_check
        expected: fever = temperature
  hints:
    level_1: 에러 메시지 맨 아래 줄을 보세요. 어떤 이름이 없다고 하나요?
    level_2: 'line 4 는 4번째 줄이에요. 그 줄의 이름과 3번째 줄에서 만든 이름을 한 글자씩 비교해 보세요.'
    level_3: '4번째 줄을 fever = temperature - 37 로 고쳐 보세요!'
  solution_code: |
    # 버그버그 진료 기록
    patient = "버그버그"
    temperature = 38
    fever = temperature - 37
    print(f"환자: {patient}")
    print(f"체온: {temperature}도")
    print(f"열이 {fever}도 높아요")
