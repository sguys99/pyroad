  fallback_text: 알고리즘은 문제를 푸는 순서예요. 합은 0에서 시작해 하나씩 더하고, 가장 큰 값은 첫 값을 대장으로 두고 더 큰 값이 나오면 바꿔요. 찾으면 break 로 멈추고, 반씩 줄여 찾을 때는 가운데를 먼저 봐요. 줄 세우기는 남은 것 중 가장 작은 것을 하나씩 데려와요.
