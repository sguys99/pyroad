        question: 물고기 대장이 바뀔 때마다 알려 줘요. 돌리면 무엇이 나올까?
        code: |-
          fish = [4, 9, 2, 11, 7]
          leader = fish[0]
          for f in fish:
              if f > leader:
                  leader = f
                  print(leader)
        options:
          - { id: opt-r3hx, text: "9\n11" }
          - { id: opt-c7ua, text: "4\n9\n11" }
          - { id: opt-n4gt, text: '11' }
