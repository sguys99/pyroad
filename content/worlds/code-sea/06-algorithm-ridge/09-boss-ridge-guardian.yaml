rounds:
  - quiz_kind: multiple_choice
    review_quest: b2000000-0000-0000-0000-000000000046
    prompt:
      quiz:
        question: 진주 세 알의 무게를 더하고 평균을 내요. 돌리면 무엇이 나올까?
        code: |-
          pearls = [3, 5, 4]
          total = 0
          for p in pearls:
              total = total + p
          print(total, round(total / len(pearls), 1))
        options:
          - { id: opt-j6sw, text: '12 4.0' }
          - { id: opt-q2dn, text: '12 4' }
          - { id: opt-f8ky, text: '12 3.0' }
          - { id: opt-v5mb, text: '4.0 12' }
    answer:
      quiz_answer:
        accepted: [opt-j6sw]
        explanation: 3 + 5 + 4 로 합계는 12예요. 12를 진주 개수 3으로 나누면 4.0 인데, / 로 나누면 언제나 소수점이 붙어요.
        explanations:
          opt-q2dn: / 로 나눈 결과에는 소수점이 붙어요. round 를 해도 4.0 으로 남아요.
          opt-f8ky: 진주는 3개라서 3으로 나눠요. 12 ÷ 3 은 4예요.
          opt-v5mb: print 는 쓴 차례대로 보여 줘요. 합계가 먼저예요.
