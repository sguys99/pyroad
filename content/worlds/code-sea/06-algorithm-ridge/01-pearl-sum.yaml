# 2월드 퀘스트 6-1: 진주 합계와 평균
# 작성 안내: content/README.md · 설계: docs/curriculum/world2.md §3 2-6
# 평균은 round(…, 1)로 소수 길이를 고정 (§10)

id: b2000000-0000-0000-0000-000000000046
order: 1
title: 진주 합계와 평균
concept: 합계·평균 직접 구하기
xp_reward: 90
quest_type: code
prompt:
  topic: sum() 없이 합계와 평균 구하기
  learning_goals:
    - for로 하나씩 더해 합계를 직접 구할 수 있다
    - 합계를 개수로 나누고 round(값, 1)로 평균을 구할 수 있다
    - 내가 만든 결과가 sum()과 같은지 ==로 확인할 수 있다
  story_context: 바다 밑 산맥 입구에 버그버그가 "내장 함수 금지 구역" 팻말을 세워 놨어요! 내장 함수는 sum, max, sort 처럼 파이썬에 처음부터 들어 있는 함수예요. 이걸 못 쓴대요. 첫 봉우리에서는 진주 다섯 알의 무게를 직접 더해 합계와 평균을 구해야 해요.
  exercise_description: 'sum() 없이 for 로 진주 무게를 더해 "합계: 53"과 "평균: 10.6"을 출력하세요. 마지막 줄은 sum() 과 같은지 확인해요'
  starter_code: |
    pearls = [12, 7, 15, 9, 10]
    total = 0

    # 1) sum() 없이 for 로 하나씩 더해요
    ___

    print(f"합계: {total}")

    # 2) 평균 = 합계 ÷ 개수, 소수 첫째 자리까지
    avg = ___
    print(f"평균: {avg}")

    # 3) 내가 구한 합계가 sum() 과 같은지 확인해요
    print(total == sum(pearls))
  expected_output_hint: '합계: 53, 평균: 10.6, True 가 한 줄씩 나와야 해요'
  checklist:
    - 'for p in pearls: 아래에서 total = total + p 로 더해요'
    - 'avg = round(total / len(pearls), 1) 로 평균을 구해요'
    - 마지막 줄에 True 가 나오는지 봐요
  example_output: |-
    합계: 53
    평균: 10.6
    True
  fallback_text: '합계는 빈 바구니 total = 0 에서 시작해 진주를 하나씩 넣는 것과 같아요. 평균은 합계를 개수 len(pearls) 로 나눈 값이고, round(값, 1)로 소수 첫째 자리까지만 보여 줘요. 마지막 줄이 True 면 내가 만든 방법이 sum() 과 똑같다는 뜻이에요.'
answer:
  validation:
    type: all
    rules:
      - type: output_match
        expected: |-
          합계: 53
          평균: 10.6
          True
      - type: code_check
        expected: for
        whole_word: true
  hints:
    level_1: 1월드 합계 구하기처럼 0에서 시작해 반복하며 하나씩 더해요.
    level_2: 'for p in pearls: 아래에 total = total + p 를 들여써요. 평균은 round(total / len(pearls), 1) 이에요.'
    level_3: |-
      빈칸을 이렇게 채워 보세요!
      for p in pearls:
          total = total + p
      avg = round(total / len(pearls), 1)
  solution_code: |
    pearls = [12, 7, 15, 9, 10]
    total = 0

    for p in pearls:
        total = total + p

    print(f"합계: {total}")

    avg = round(total / len(pearls), 1)
    print(f"평균: {avg}")

    print(total == sum(pearls))
